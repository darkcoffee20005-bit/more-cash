# استضافة مور كاش على Render (الخطة المجانية): نفس البرنامج ونفس قاعدة MongoDB Atlas.
# الاستخدام: render.com ← New ← Blueprint ← اختر هذا المستودع، ثم أدخل MONGODB_URI و PLATFORM_ADMINS عند الطلب.
services:
  - type: web
    name: more-cash
    runtime: node
    plan: starter              # مدفوعة صغيرة: لا تنام أبداً (المجانية تنام بعد 15 دقيقة بلا زيارة)
    region: singapore          # الأقرب لقاعدة البيانات (Atlas هونغ كونغ)
    branch: main
    buildCommand: npm ci --omit=dev && node scripts/build_demo.mjs public/demo.html
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false            # يُدخَل في لوحة Render، لا يُكتب هنا أبداً
      - key: MONGODB_DB
        value: morecash
      - key: PLATFORM_ADMINS
        sync: false
      - key: SUPPORT_WHATSAPP   # رقم الدعم بصيغة 964… (اختياري)
        sync: false
      - key: PIN_PEPPER         # يولّده Render عشوائياً مرة واحدة، لا يُكتب في أي مكان
        generateValue: true
      - key: REQUIRE_MONGODB   # لا يعمل أبداً بملف محلي على الخادم (البيانات تضيع عند إعادة التشغيل)
        value: "true"
      - key: REQUIRE_APPROVAL  # كل مقهى جديد ينتظر موافقتك واشتراكه من لوحة المزوّد #/platform
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
