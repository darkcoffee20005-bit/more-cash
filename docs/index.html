const __m_server_db_scoped_js = await (async () => {

// عزل بيانات كل مقهى: غلاف فوق قاعدة البيانات يضيف tenantId تلقائياً لكل قراءة وكتابة.
// طبقة الخدمات (server/app/*) لا تعرف شيئاً عن تعدد المقاهي؛ تستلم هذا الغلاف بدل القاعدة نفسها،
// فيستحيل أن يقرأ مقهى بيانات مقهى آخر حتى لو نسيت خدمةٌ ما شرطاً في استعلامها.
//
// المستندات ذات المعرّف الثابت (settings: 'store'، counters: 'receipt'…) تُخزَّن بمعرّف مسبوق
// بالمقهى ('<tenantId>:store') كي لا تتصادم بين المقاهي، ويُعاد المعرّف الأصلي عند القراءة.

const FIXED_ID = new Set(['settings', 'counters']);

function scopeDb(db, tenantId) {
  if (typeof tenantId !== 'string' || !tenantId) throw new Error('tenantId required');
  const cache = new Map();
  return {
    tenantId,
    collection(name) {
      if (!cache.has(name)) cache.set(name, new ScopedCollection(db.collection(name), tenantId, FIXED_ID.has(name)));
      return cache.get(name);
    },
  };
}

class ScopedCollection {
  constructor(coll, tenantId, fixedIds) {
    this.c = coll;
    this.t = tenantId;
    this.fixed = fixedIds;
    this.prefix = `${tenantId}:`;
  }

  _id(v) {
    if (!this.fixed) return v;
    if (typeof v === 'string') return this.prefix + v;
    if (v && typeof v === 'object' && Array.isArray(v.$in)) return { ...v, $in: v.$in.map((x) => this.prefix + x) };
    return v;
  }

  filter(f = {}) {
    const out = { ...f, tenantId: this.t };
    if ('_id' in f) out._id = this._id(f._id);
    return out;
  }

  doc(d) {
    const out = { ...d, tenantId: this.t };
    if (this.fixed && '_id' in d) out._id = this._id(d._id);
    return out;
  }

  /** يعيد المستند كما تعرفه الخدمات: بلا tenantId وبمعرّفه الأصلي */
  view(d) {
    if (!d) return d;
    const { tenantId, ...rest } = d;
    if (this.fixed && typeof rest._id === 'string' && rest._id.startsWith(this.prefix)) rest._id = rest._id.slice(this.prefix.length);
    return rest;
  }

  find(filter, options) { return new ScopedCursor(this.c.find(this.filter(filter), options), (d) => this.view(d)); }
  async findOne(filter, options) { return this.view(await this.c.findOne(this.filter(filter), options)); }
  async countDocuments(filter, options) { return this.c.countDocuments(this.filter(filter), options); }
  async insertOne(doc, options) { return this.c.insertOne(this.doc(doc), options); }
  async insertMany(docs, options) { return this.c.insertMany(docs.map((d) => this.doc(d)), options); }

    <div class="row">${icon('clock')}<h2>فتح وردية جديدة</h2></div>
    <p class="muted">عدّ النقد الموجود في الدرج وأدخله. سيُحسب النقد المتوقع عند الإغلاق من هذا الرقم.</p>
    ${field('النقد في الدرج (د.ع)', '<input class="amount-input" name="startingCash" id="shift-start" inputmode="numeric" placeholder="0" autocomplete="off" autofocus>')}
    <button class="btn primary lg block" type="submit" ${state.busy ? 'disabled' : ''}>فتح الوردية</button>
  </form></div>`;
}

function catalogPane(s) {
  const { categoryId, search } = s.pos;
  const q = search.trim();
  const items = s.catalog.items.filter((i) => {
    if (q) return i.name.includes(q) || i.variants.some((v) => v.sku && v.sku.toLowerCase() === q.toLowerCase());
    return !categoryId || i.categoryId === categoryId;
  });
  const cats = [`<button class="chip cat-chip c-slate ${!categoryId && !q ? 'on' : ''}" data-action="pos-cat" data-id="">الكل</button>`,
    ...s.catalog.categories.map((c) => `<button class="chip cat-chip c-${c.color} ${categoryId === c.id && !q ? 'on' : ''}" data-action="pos-cat" data-id="${c.id}">${esc(c.name)}</button>`)];
  const tz = s.settings?.tzOffsetMin ?? 180;
  return `<section class="catalog" aria-label="الأصناف">
    <div class="catalog-head">
      <div class="pos-top"><h1>${esc(s.settings?.name ?? '')}</h1>
        ${s.shift ? `<span class="pill ok">${icon('clock', 'sm')} وردية #${s.shift.number}</span>` : ''}
        <span class="clock">${time(Date.now(), tz)}</span></div>
      ${offlineBanner(s)}
      ${lowBanner(s)}
      <div class="search-box">${icon('search', 'sm')}<input type="search" id="pos-search" placeholder="ابحث باسم الصنف أو SKU" value="${esc(search)}" data-input="pos-search" autocomplete="off"></div>
      <div class="cats" role="tablist">${cats.join('')}</div>
    </div>
    <div class="tiles" data-keep-scroll="tiles">
      ${items.length ? items.map(tile).join('') : `<div class="empty" style="grid-column:1/-1">${icon('search')}<p>لا أصناف مطابقة</p></div>`}
    </div>
  </section>`;
}

function ticketFab(s) {
  const cart = s.pos.cart;
  const count = cart.lines.reduce((a, l) => a + l.qty, 0);
  return `<button class="ticket-fab" data-action="ticket-toggle" aria-label="فتح نافذة الطلب">
    ${icon('sale', 'sm')}<span>${cart.ticket ? esc(cart.ticket.name) : 'الطلب'}</span>
    ${count ? `<span class="fab-count">${count}</span><b class="num">${money(safeTotals().total)}</b>` : '<span class="muted-on">فارغ</span>'}</button>`;
}

function offlineBanner(s) {
  const pending = pendingSales().length;
  const failed = failedSales().length;
  if (s.online !== false && !pending && !failed) return '';
  const parts = [];
  if (s.online === false) parts.push('<b>بدون إنترنت</b> — البيع يعمل والمبيعات تُحفظ على الجهاز');
  if (pending) parts.push(s.online === false ? `${pending} بانتظار الإرسال` : `جارٍ إرسال ${pending} ${pending === 1 ? 'عملية محفوظة' : 'عمليات محفوظة'}…`);
  return `<div class="net-banner ${s.online === false ? 'off' : ''}" role="status">${icon(s.online === false ? 'alert' : 'clock', 'sm')}
    <span class="low-text">${parts.join(' · ') || ''}${failed ? `${parts.length ? ' · ' : ''}<b>${failed} لم تُقبل</b>` : ''}</span>
    ${failed ? '<button class="btn sm" data-action="offline-review">مراجعة</button>' : ''}</div>`;
}

const lowKey = (list) => list.map((x) => `${x.variantId}:${x.out ? 0 : 1}`).join(',');

function lowBanner(s) {
  const low = s.catalog.lowStock ?? [];
  if (!low.length || s.pos.lowDismissed === lowKey(low)) return '';
  const outN = low.filter((x) => x.out).length;
  const shown = low.slice(0, 4).map((x) => `<span class="${x.out ? 'low-out' : ''}">${esc(x.name)} <b class="num">${x.stock.toLocaleString('en-US')} ${esc(x.unit)}</b></span>`).join('');
  return `<div class="low-banner ${outN ? 'has-out' : ''}" role="alert">${icon('alert', 'sm')}
    <div class="low-text"><b>${outN ? `نفد ${outN} ومنخفض ${low.length - outN}` : `مخزون منخفض: ${low.length} ${low.length === 1 ? 'مادة' : 'مواد'}`}</b>
      <span class="low-list">${shown}${low.length > 4 ? `<span>+${low.length - 4}</span>` : ''}</span></div>
    ${can('admin.inventory') ? '<a class="btn sm" href="#/admin/inventory">المخزون</a>' : ''}
    <button class="icon-btn" data-action="low-dismiss" aria-label="إخفاء التنبيه">${icon('x', 'sm')}</button></div>`;
}

function tile(item) {
  const prices = item.variants.map((v) => v.price);
  const min = Math.min(...prices);
  const out = item.variants.every((v) => v.available !== null && v.available <= 0);
  const low = !out && item.variants.some((v) => v.available !== null && v.available > 0 && v.available <= 3);
  const meta = [item.variants.length === 2 ? 'حجمان' : item.variants.length > 2 ? `${item.variants.length} أحجام` : item.variants[0].name, item.modifierIds.length ? 'إضافات' : ''].filter(Boolean).join(' · ');
  return `<button class="tile c-${item.color} ${out ? 'out' : ''}" data-action="pos-item" data-id="${item.id}">
    ${out ? '<span class="t-flag pill bad">نفد</span>' : low ? '<span class="t-flag pill warn">قليل</span>' : ''}
    <span class="t-name">${esc(item.name)}</span>
    ${meta ? `<span class="t-meta">${esc(meta)}</span>` : ''}
    <span class="t-price num">${prices.length > 1 && Math.max(...prices) !== min ? 'من ' : ''}${money(min)}</span>
  </button>`;
}

function ticketPane(s) {
  const cart = s.pos.cart;
  const t = safeTotals();
  const customer = cart.customer;
  const lines = cart.lines.map((l, i) => {
    const calc = t.lines[i];
    const sub = [l.variantName, ...l.modifiers.map((m) => m.name)].filter(Boolean).join(' · ');
    const discounted = calc && calc.discount > 0 && l.discountIds.length;
    return `<li class="line ${s.pos.flashKey === l.key ? 'flash' : ''}" data-action="pos-line" data-key="${l.key}" role="button" tabindex="0">
      <span class="qty-badge">${l.qty}</span>
      <div><div class="l-name">${esc(l.itemName)}</div>${sub ? `<div class="l-sub">${esc(sub)}</div>` : ''}
        ${l.note ? `<div class="l-sub">✎ ${esc(l.note)}</div>` : ''}
        ${l.discountIds.length ? `<div class="l-disc">${l.discountIds.map((d) => esc(discountById(d)?.name ?? '')).join('، ')}</div>` : ''}</div>
      <div class="l-total num">${discounted ? `<s>${money(calc.gross, { symbol: false })}</s>` : ''}${money(discounted ? calc.gross - calc.discount + 0 : lineUnit(l) * l.qty, { symbol: false })}</div>
    </li>`;
  }).join('');
  const ticketDiscNames = cart.discountIds.map((d) => discountById(d)?.name).filter(Boolean);
  const dining = s.settings.diningOptions;

  return `<aside class="ticket ${cart.lines.length ? '' : 'is-empty'}" aria-label="التذكرة">
    <div class="ticket-head">
      <div class="ticket-title">
        <h2>${cart.ticket ? esc(cart.ticket.name) : 'طلب جديد'}</h2>
        <span class="spacer"></span>
        ${s.settings.features.openTickets && can('pos.tickets') ? `<button class="btn sm" data-action="pos-tickets">${icon('ticket', 'sm')} التذاكر${s.ticketsCount ? ` (${s.ticketsCount})` : ''}</button>` : ''}
        <button class="icon-btn" data-action="pos-clear" title="مسح الطلب" ${cart.lines.length ? '' : 'disabled'}>${icon('trash', 'sm')}</button>
        <button class="icon-btn" data-action="ticket-toggle" title="إخفاء نافذة الطلب" aria-label="إخفاء نافذة الطلب">${icon('arrow', 'sm')}</button>
      </div>
      <div class="ticket-meta">
        <select id="pos-dining" data-change="pos-dining" aria-label="نوع الطلب">${dining.map((d) => `<option value="${d.id}" ${cart.diningOption === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
        <button class="customer-chip ${customer ? 'set' : ''}" data-action="pos-customer">${icon('user', 'sm')} ${customer ? `${esc(customer.name)} · ${customer.points} نقطة` : 'إضافة عميل'}</button>
      </div>
    </div>
    <ul class="lines">${lines ? `<li class="more-lines" data-action="pos-all-lines" hidden></li>${lines}` : `<li class="empty">${icon('cup')}<p>اختر مشروباً لبدء الطلب</p></li>`}</ul>
    <div class="totals">
      <div class="t-row"><span>المجموع</span><span class="num">${money(t.gross)}</span></div>
      ${t.lineDiscount || t.ticketDiscount ? `<div class="t-row disc"><span>الخصم${ticketDiscNames.length ? ` (${esc(ticketDiscNames.join('، '))})` : ''}</span><span class="num">−${money(t.lineDiscount + t.ticketDiscount)}</span></div>` : ''}
      ${t.pointsDiscount ? `<div class="t-row disc"><span>استبدال نقاط</span><span class="num">−${money(t.pointsDiscount)}</span></div>` : ''}
      ${t.tax ? `<div class="t-row"><span>${esc(s.settings.tax.name)} ${s.settings.tax.mode === 'included' ? '(مشمولة)' : ''}</span><span class="num">${money(t.tax)}</span></div>` : ''}
    </div>
    <div class="ticket-actions">
      <div class="row">
        <button class="btn" data-action="pos-discounts" ${cart.lines.length && can('pos.discount') && s.catalog.discounts.length ? '' : 'disabled'}>${icon('tag', 'sm')} خصم</button>
        ${s.settings.features.openTickets && can('pos.tickets') ? `<button class="btn" data-action="pos-save" ${cart.lines.length && !s.busy ? '' : 'disabled'}>${icon('save', 'sm')} ${cart.ticket ? 'تحديث' : 'حفظ'}</button>` : ''}
      </div>
      <button class="btn primary lg block charge" data-action="pos-charge" ${cart.lines.length && !s.busy ? '' : 'disabled'}>
        <span>دفع</span><span class="amount num">${money(t.total)}</span>
      </button>
    </div>
  </aside>`;
}

// ---------------------------------------------------------------- النوافذ
const modals = {
  item(s) {
    const m = s.modal;
    const item = itemById(m.itemId);
    const variant = item.variants.find((v) => v.id === m.variantId);
    const groups = item.modifierIds.map(modifierById).filter(Boolean);
    const chosen = groups.flatMap((g) => g.options.filter((o) => m.options.includes(o.id)));
    const unit = unitPrice(variant.price, chosen.map((o) => o.price));
    const missing = groups.filter((g) => g.required && !g.options.some((o) => m.options.includes(o.id)));
    const discounts = s.catalog.discounts.filter((d) => !d.restricted || can('pos.discount_restricted'));
    const body = `
      ${item.variants.length > 1 ? `<div class="opt-group"><h3>الحجم</h3><div class="opts">${item.variants.map((v) => `
        <button class="opt ${v.id === variant.id ? 'on' : ''}" data-action="item-variant" data-id="${v.id}">
          <span>${esc(v.name)}</span><small>${money(v.price)}${v.available !== null && v.available <= 0 ? ' · نفد' : ''}</small></button>`).join('')}</div></div>` : ''}
      ${groups.map((g) => `<div class="opt-group"><h3>${esc(g.name)} ${g.required ? '<span class="pill petrol">إلزامي</span>' : '<span class="pill">اختياري</span>'}${g.selection === 'multi' ? '<span class="muted small">أكثر من خيار</span>' : ''}</h3>
        <div class="opts">${g.options.map((o) => `<button class="opt ${m.options.includes(o.id) ? 'on' : ''}" data-action="item-option" data-group="${g.id}" data-id="${o.id}">
          <span>${esc(o.name)}</span><small>${o.price ? `+${money(o.price)}` : 'بلا إضافة'}</small></button>`).join('')}</div></div>`).join('')}
      <div class="row wrap"><h3 style="margin-inline-end:auto">الكمية</h3>
        <div class="stepper"><button data-action="item-qty" data-d="-1" aria-label="إنقاص">−</button><span>${m.qty}</span><button data-action="item-qty" data-d="1" aria-label="زيادة">+</button></div></div>
      ${field('ملاحظة للباريستا', `<input id="item-note" maxlength="120" value="${esc(m.note ?? '')}" data-input="item-note" placeholder="مثلاً: حار جداً، بدون رغوة">`)}
      ${m.lineKey && can('pos.discount') && discounts.length ? `<div class="opt-group"><h3>خصم على هذا الصنف</h3><div class="opts">${discounts.map((d) => `
        <button class="opt ${m.discountIds.includes(d.id) ? 'on' : ''}" data-action="item-discount" data-id="${d.id}"><span>${esc(d.name)}</span><small>${discountLabel(d)}${d.restricted ? ' · مقيد' : ''}</small></button>`).join('')}</div></div>` : ''}`;
    const foot = `${m.lineKey ? `<button class="btn danger" data-action="item-remove">${icon('trash', 'sm')} حذف</button>` : ''}
      <button class="btn primary lg" data-action="item-save" ${missing.length ? 'disabled' : ''}>${missing.length ? `اختر ${esc(missing[0].name)}` : `${m.lineKey ? 'حفظ' : 'إضافة'} · ${money(unit * m.qty)}`}</button>`;
    return modalFrame({ title: item.name, body, foot, cls: 'wide' });
  },

  'line-missing'(s) {
    const line = s.pos.cart.lines.find((l) => l.key === s.modal.key);
    if (!line) return '';
    return modalFrame({ title: line.itemName, sub: esc(line.variantName ?? ''),
      body: `<p>${icon('alert', 'sm')} هذا الصنف أو حجمه لم يعد متاحاً في القائمة، فلا يمكن بيعه. احذفه من الطلب ثم أضف البديل.</p>`,
      foot: `<button class="btn danger solid" data-action="line-remove">${icon('trash', 'sm')} حذف من الطلب</button>` });
  },

  'offline-failed'(s) {
    const list = failedSales();
    const reason = (x) => ({ TOTAL_MISMATCH: 'تغيّر سعر أو خصم قبل الإرسال', NO_OPEN_SHIFT: 'أُغلقت الوردية قبل الإرسال', OUT_OF_STOCK: 'نفد المخزون', UNKNOWN_VARIANT: 'صنف لم يعد في القائمة' }[x.error] ?? x.error);
    return modalFrame({ title: 'مبيعات محفوظة لم يقبلها الخادم', cls: 'wide', body: list.length ? `<p class="muted small">بيعت هذه الطلبات بلا إنترنت، ثم رفضها الخادم عند الإرسال. راجعها: أعد المحاولة بعد حل السبب، أو احذفها وسجّلها يدوياً.</p>
      <div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الموظف</th><th class="num">المبلغ</th><th>السبب</th><th></th></tr></thead><tbody>
      ${list.map((x) => `<tr><td class="small">${time(x.queuedAt, s.settings?.tzOffsetMin ?? 180)}</td><td>${esc(x.summary?.employee ?? '')}</td><td class="num">${money(x.summary?.total ?? 0)}</td><td class="small">${esc(reason(x))}</td>
        <td><div class="row" style="gap:6px;justify-content:flex-end"><button class="btn sm" data-action="offline-retry" data-id="${x.body.clientId}">إعادة</button><button class="btn sm danger" data-action="offline-discard" data-id="${x.body.clientId}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">لا شيء للمراجعة.</p>', foot: '<button class="btn" data-action="close-modal">إغلاق</button>' });
  },

  'all-lines'(s) {
    const t = safeTotals();
    const rows = s.pos.cart.lines.map((l, i) => `<tr class="click" data-action="pos-line" data-key="${l.key}"><td class="num">${l.qty}×</td>
      <td><b>${esc(l.itemName)}</b><div class="muted small">${esc([l.variantName, ...l.modifiers.map((x) => x.name)].filter(Boolean).join(' · '))}</div></td>
      <td class="num">${money(t.lines[i] ? t.lines[i].gross - t.lines[i].discount : lineUnit(l) * l.qty)}</td></tr>`).join('');
    return modalFrame({ title: `الطلب · ${s.pos.cart.lines.reduce((a, l) => a + l.qty, 0)} قطعة`, cls: 'wide',
      body: `<div class="table-wrap"><table><tbody>${rows}</tbody></table></div><p class="muted small">اضغط على صنف لتعديل حجمه أو إضافاته.</p>`,
      foot: `<button class="btn primary" data-action="close-modal">تم</button>` });
  },

  discounts(s) {
    const cart = s.pos.cart;
    const list = s.catalog.discounts.filter((d) => !d.restricted || can('pos.discount_restricted'));
    return modalFrame({ title: 'خصم على الطلب', body: `<div class="opts">${list.map((d) => `
      <button class="opt ${cart.discountIds.includes(d.id) ? 'on' : ''}" data-action="ticket-discount" data-id="${d.id}">
        <span>${esc(d.name)}</span><small>${discountLabel(d)}${d.restricted ? ' · يتطلب مديراً' : ''}</small></button>`).join('')}</div>
      <p class="muted small">النسبة تُحسب على المجموع بعد خصومات الأصناف، ثم يُطرح الخصم الثابت. يوزَّع الخصم على الأصناف لحساب الأرباح بدقة.</p>`,
    foot: '<button class="btn primary" data-action="close-modal">تم</button>' });
  },

  customer(s) {
    const m = s.modal;
    const cart = s.pos.cart;
    const loyalty = s.settings.loyalty?.enabled;
    const current = cart.customer;
    const list = (m.results ?? []).map((c) => `<tr class="click" data-action="customer-pick" data-id="${c.id}">
      <td><b>${esc(c.name)}</b><div class="muted small">${esc(c.phone ?? '')}</div></td>
      <td class="num">${c.visits} زيارة</td><td class="num">${loyalty ? `${c.points} نقطة` : ''}</td></tr>`).join('');
    const body = current ? `
      <div class="card pad row wrap"><div class="avatar">${esc(current.name.slice(0, 1))}</div>
        <div><b>${esc(current.name)}</b><div class="muted small">${current.points} نقطة متاحة</div></div><span class="spacer"></span>
        <button class="btn sm danger" data-action="customer-remove">إزالة</button></div>
      ${loyalty && current.points > 0 ? `<form class="stack" data-form="customer-points">
        ${field('استبدال نقاط (1 نقطة = 1 د.ع)', `<input class="amount-input" name="points" id="cust-points" inputmode="numeric" value="${cart.pointsRedeemed || ''}" placeholder="0">`, `بحد أقصى ${Math.min(current.points, cartTotals({ ...cart, pointsRedeemed: 0 }).net)} نقطة`)}
        <button class="btn olive" type="submit">${icon('star', 'sm')} تطبيق</button></form>` : ''}`
      : `<div class="search-box">${icon('search', 'sm')}<input type="search" id="cust-search" placeholder="اسم العميل أو رقم الهاتف" value="${esc(m.search ?? '')}" data-input="customer-search" autofocus autocomplete="off"></div>
      ${list ? `<div class="table-wrap"><table><tbody>${list}</tbody></table></div>` : `<p class="muted small">${m.search ? 'لا نتائج' : 'ابحث، أو أضف عميلاً جديداً'}</p>`}
      <form class="card pad stack" data-form="customer-create"><h3>عميل جديد</h3>
        <div class="grid-2">${field('الاسم', '<input name="name" id="cust-name" required minlength="2" maxlength="50">')}${field('الهاتف', '<input name="phone" id="cust-phone" inputmode="tel" maxlength="20" dir="ltr">')}</div>
        <button class="btn" type="submit">${icon('plus', 'sm')} إضافة وربط بالطلب</button></form>`;
    return modalFrame({ title: 'العميل', body, cls: 'wide' });
  },

  tickets(s) {
    const list = s.modal.list;
    const rows = list === undefined ? '<p class="muted">جارٍ التحميل…</p>' : list.length ? `<div class="table-wrap"><table>
      <thead><tr><th>التذكرة</th><th>الأصناف</th><th>آخر تعديل</th><th class="num">الإجمالي</th><th></th></tr></thead><tbody>
      ${list.map((t) => `<tr class="click" data-action="ticket-open" data-id="${t.id}"><td><b>${esc(t.name)}</b>${t.note ? `<div class="muted small">${esc(t.note)}</div>` : ''}</td>
        <td class="num">${t.lines.reduce((a, l) => a + l.qty, 0)}</td><td class="muted small">${esc(t.updatedBy ?? '')}</td><td class="num">${money(t.displayTotal)}</td>
        <td>${can('pos.void_saved') ? `<button class="icon-btn" data-action="ticket-delete" data-id="${t.id}" aria-label="حذف التذكرة">${icon('trash', 'sm')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('ticket')}<p>لا توجد تذاكر محفوظة</p></div>`;
    return modalFrame({ title: 'التذاكر المفتوحة', body: rows, cls: 'wide' });
  },

  'save-ticket'(s) {
    const cart = s.pos.cart;
    return modalFrame({ title: 'حفظ التذكرة', body: `<form class="stack" data-form="ticket-save" id="ticket-form">
      ${field('اسم التذكرة', `<input name="name" id="ticket-name" required maxlength="40" value="${esc(cart.ticket?.name ?? '')}" placeholder="طاولة 3، أو اسم العميل" autofocus>`)}
      <div class="row wrap">${['طاولة 1', 'طاولة 2', 'طاولة 3', 'طاولة 4', 'سفري'].map((n) => `<button type="button" class="chip" data-action="ticket-name" data-name="${n}">${n}</button>`).join('')}</div>
      ${field('ملاحظة', '<input name="note" id="ticket-note" maxlength="120">')}
      <button class="btn primary lg" type="submit" ${s.busy ? 'disabled' : ''}>حفظ</button></form>` });
  },

  pay(s) {
    const m = s.modal;
    if (m.stage === 'done') return doneView(m);
    const total = m.total;
    const paid = m.payments.reduce((a, p) => a + p.amount, 0);
    const remaining = total - paid;
    const types = s.settings.paymentTypes.filter((p) => p.active);
    const type = types.find((p) => p.id === m.typeId) ?? types[0];
    const isCash = type.kind === 'cash';
    const amount = parseAmount(m.amountText) ?? remaining;
    const tendered = cashTendered(m, amount);
    const short = isCash && Number.isSafeInteger(amount) ? Math.max(0, amount - tendered) : 0;
    const valid = Number.isSafeInteger(amount) && amount > 0 && amount <= remaining && short === 0;
    return `<div class="modal full" role="dialog" aria-modal="true" aria-label="الدفع" data-stop><div class="pay">
      <section class="pay-side">
        <div class="row"><button class="icon-btn" style="color:#fff" data-action="close-modal" aria-label="رجوع">${icon('arrow')}</button><span class="label" style="color:#b8bf98">${s.pos.cart.ticket ? esc(s.pos.cart.ticket.name) : 'طلب جديد'}</span></div>
        <div><div class="due-label">المستحق</div><div class="due num">${money(total)}</div></div>
        <div class="pay-summary">${s.pos.cart.lines.map((l) => `<div><span>${l.qty}× ${esc(l.itemName)}${l.variantName ? ` ${esc(l.variantName)}` : ''}</span><span class="num">${money(lineUnit(l) * l.qty, { symbol: false })}</span></div>`).join('')}
          ${s.pos.cart.customer ? `<div><span>${icon('user', 'sm')} ${esc(s.pos.cart.customer.name)}</span></div>` : ''}</div>
        ${m.payments.length ? `<div class="split">${m.payments.map((p, i) => `<div class="split-row"><span>${esc(p.typeName)}</span><span class="num">${money(p.amount)}</span>
          <button class="icon-btn" style="width:28px;height:28px;color:#dde2c8" data-action="pay-remove" data-i="${i}" aria-label="حذف الدفعة">${icon('x', 'sm')}</button></div>`).join('')}
          <div class="row"><span>المتبقي</span><span class="spacer"></span><span class="remaining num">${money(remaining)}</span></div></div>` : ''}
        <div class="spacer"></div>
        <p class="small" style="color:#b8bf98">التقسيم: غيّر المبلغ إلى جزء من المستحق ثم أضف الدفعة، وأكمل الباقي بطريقة أخرى.</p>
      </section>
      <section class="pay-main">
        <div class="pay-types">${types.map((p) => `<button class="pay-type ${p.id === type.id ? 'on' : ''}" data-action="pay-type" data-id="${p.id}">${icon(p.kind === 'cash' ? 'cash' : p.kind === 'card' ? 'card' : 'wallet')} ${esc(p.name)}</button>`).join('')}</div>
        ${field('المبلغ لهذه الدفعة', `<input class="amount-input" id="pay-amount" inputmode="numeric" value="${esc(m.amountText ?? String(remaining))}" data-input="pay-amount" autocomplete="off">`)}
        ${isCash ? `<div class="stack" style="gap:8px"><span class="label">المستلم من العميل</span>
          <div class="bills">
            <button class="bill exact ${m.bills.length ? '' : 'on'}" data-action="pay-exact">بالضبط</button>
            ${BILLS.map((b) => { const n = m.bills.filter((x) => x === b).length; return `<button class="bill ${n ? 'on' : ''}" data-action="pay-bill" data-v="${b}">${money(b, { symbol: false })}${n > 1 ? `<span class="bill-n">×${n}</span>` : ''}</button>`; }).join('')}
          </div></div>
          <div class="change-box ${short ? 'short' : ''}">
            <div><div class="muted small">المستلم</div><b class="num">${money(Number.isSafeInteger(tendered) ? tendered : 0)}</b></div>
            <div><div class="muted small">${short ? 'ناقص' : 'الباقي للعميل'}</div><b class="num big">${money(short || Math.max(0, tendered - (Number.isSafeInteger(amount) ? amount : 0)))}</b></div>
          </div>` : field('رقم المرجع (اختياري)', '<input id="pay-ref" maxlength="40" dir="ltr" autocomplete="off">')}
        <div class="spacer"></div>
        ${amount < remaining ? `<button class="btn lg block" data-action="pay-add" ${valid ? '' : 'disabled'}>${icon('plus', 'sm')} إضافة دفعة ${money(Number.isSafeInteger(amount) ? amount : 0)}</button>` : ''}
        <button class="btn primary lg block" data-action="pay-confirm" ${(valid && amount === remaining) || (remaining === 0) ? '' : 'disabled'} ${s.busy ? 'disabled' : ''}>${s.busy ? 'جارٍ الحفظ…' : `${icon('check', 'sm')} تأكيد الدفع`}</button>
      </section></div></div>`;
  },
};

function doneView(m) {
  const change = m.receipt.payments.reduce((a, p) => a + (p.change ?? 0), 0);
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="تم الدفع" data-stop><div class="done">
    <div class="tick">${icon('check')}</div>
    <h2>${m.offline ? 'تم البيع · محفوظ على الجهاز' : `تم الدفع · إيصال #${m.receipt.number}`}</h2>
    ${m.offline ? '<p class="muted small">لا يوجد إنترنت الآن. سيُرسل البيع تلقائياً ويأخذ رقم إيصاله عند عودة الاتصال.</p>' : ''}
    ${change ? `<div><div class="muted">الباقي للعميل</div><div class="change num">${money(change)}</div></div>` : `<p class="muted">${money(m.receipt.totals.total)}</p>`}
    ${m.receipt.pointsEarned ? `<span class="pill olive">${icon('star', 'sm')} +${m.receipt.pointsEarned} نقطة لـ ${esc(m.receipt.customerName)}</span>` : ''}
    <div class="row" style="width:100%">${m.offline ? '' : `<button class="btn lg" style="flex:1" data-action="pay-print">${icon('print', 'sm')} طباعة</button>`}
      <button class="btn primary lg" style="flex:1.4" data-action="pay-new" autofocus>طلب جديد</button></div>
  </div></div>`;
}

// ---------------------------------------------------------------- الإجراءات
function cartLineFrom({ item, variant, optionIds, qty, note, discountIds = [], key }) {
  const mods = item.modifierIds.map(modifierById).filter(Boolean).flatMap((g) => g.options.filter((o) => optionIds.includes(o.id)));
  return {
    key: key ?? uid(), itemId: item.id, itemName: item.name, variantId: variant.id, variantName: variant.name, price: variant.price,
    modifiers: mods.map((o) => ({ id: o.id, name: o.name, price: o.price })), qty, note: note || '', discountIds,
  };
}

function addToCart(line) {
  const cart = state.pos.cart;
  const same = cart.lines.find((l) => l.variantId === line.variantId && !l.note && !line.note && !l.discountIds.length
    && l.modifiers.map((m) => m.id).sort().join() === line.modifiers.map((m) => m.id).sort().join());
  if (same) { same.qty += line.qty; return same.key; }
  cart.lines.push(line);
  return line.key;
}

function defaultOptions(item) {
  // الإضافة الإلزامية ذات الاختيار الواحد: يُختار أول خيار تلقائياً (مثل الحليب الكامل)
  return item.modifierIds.map(modifierById).filter((g) => g && g.required && g.selection === 'single').map((g) => g.options[0]?.id).filter(Boolean);
}

on({
  'open-shift': (_el, _e, data) => busy(async () => {
    const startingCash = parseAmount(data.startingCash) ?? 0;
    if (!Number.isSafeInteger(startingCash)) throw new Error('أدخل مبلغاً صحيحاً بالدينار');
    state.shift = await post('/api/shifts/open', { startingCash });
    toast('فُتحت الوردية', 'ok');
  }),
  'pos-search': (el) => { state.pos.search = el.value; render(); },
  'pos-cat': (el) => { state.pos.categoryId = el.dataset.id || null; state.pos.search = ''; render(); },
  // النقر على الصنف يضيفه بالشكل القياسي (أول حجم + الخيارات الافتراضية) مباشرة؛ التفاصيل والإضافات بالضغط على سطره في الطلب
  'pos-item': (el) => {
    const item = itemById(el.dataset.id);
    const options = defaultOptions(item);
    const groups = item.modifierIds.map(modifierById).filter(Boolean);
    if (groups.some((g) => g.required && !g.options.some((o) => options.includes(o.id)))) {
      return openModal({ type: 'item', itemId: item.id, variantId: item.variants[0].id, options, qty: 1, note: '' });
    }
    const line = cartLineFrom({ item, variant: item.variants[0], optionIds: options, qty: 1 });
    state.pos.flashKey = addToCart(line);
    return render();
  },
  'item-variant': (el) => { state.modal.variantId = el.dataset.id; render(); },
  'item-option': (el) => {
    const m = state.modal;
    const group = modifierById(el.dataset.group);
    const id = el.dataset.id;
    const inGroup = group.options.map((o) => o.id);
    if (m.options.includes(id)) {
      if (!(group.required && group.selection === 'single')) m.options = m.options.filter((x) => x !== id);
    } else if (group.selection === 'single') m.options = [...m.options.filter((x) => !inGroup.includes(x)), id];
    else m.options = [...m.options, id];
    render();
  },
  'item-qty': (el) => { state.modal.qty = Math.max(1, Math.min(999, state.modal.qty + Number(el.dataset.d))); render(); },
  'item-note': (el) => { state.modal.note = el.value; },
  'item-save': () => {
    const m = state.modal;
    const item = itemById(m.itemId);
    const variant = item.variants.find((v) => v.id === m.variantId);
    const cart = state.pos.cart;
    if (m.lineKey) {
      const idx = cart.lines.findIndex((l) => l.key === m.lineKey);
      cart.lines[idx] = cartLineFrom({ item, variant, optionIds: m.options, qty: m.qty, note: m.note, discountIds: m.discountIds ?? cart.lines[idx].discountIds, key: m.lineKey });
    } else addToCart(cartLineFrom({ item, variant, optionIds: m.options, qty: m.qty, note: m.note }));
    closeModal();
  },
  'item-remove': () => { state.pos.cart.lines = state.pos.cart.lines.filter((l) => l.key !== state.modal.lineKey); closeModal(); },
  'pos-line': (el) => {
    const line = state.pos.cart.lines.find((l) => l.key === el.dataset.key);
    if (!line) return undefined;
    const item = itemById(line.itemId);
    if (!item || !item.variants.some((v) => v.id === line.variantId)) return openModal({ type: 'line-missing', key: line.key });
    return openModal({ type: 'item', itemId: line.itemId, variantId: line.variantId, options: line.modifiers.map((m) => m.id), qty: line.qty, note: line.note, lineKey: line.key, discountIds: [...line.discountIds] });
  },
  'item-discount': (el) => {
    const m = state.modal;
    m.discountIds = m.discountIds.includes(el.dataset.id) ? m.discountIds.filter((d) => d !== el.dataset.id) : [...m.discountIds, el.dataset.id];
    render();
  },
  'line-remove': () => { state.pos.cart.lines = state.pos.cart.lines.filter((l) => l.key !== state.modal.key); closeModal(); },
  'offline-review': () => openModal({ type: 'offline-failed' }),
  'offline-retry': (el) => { retryFailed(el.dataset.id); render(); },
  'offline-discard': (el) => {
    if (state.view.confirmDiscard !== el.dataset.id) { state.view.confirmDiscard = el.dataset.id; toast('اضغط مرة أخرى لحذف البيع المحفوظ نهائياً'); return; }
    discardFailed(el.dataset.id);
  },
  'pos-all-lines': () => openModal({ type: 'all-lines' }),
  'ticket-toggle': () => { state.pos.ticketHidden = !state.pos.ticketHidden; saveTicketHidden(state.pos.ticketHidden); render(); },
  'pos-discounts': () => openModal({ type: 'discounts' }),
  'ticket-discount': (el) => {
    const cart = state.pos.cart;
    cart.discountIds = cart.discountIds.includes(el.dataset.id) ? cart.discountIds.filter((d) => d !== el.dataset.id) : [...cart.discountIds, el.dataset.id];
    render();
  },
  'pos-dining': (el) => { state.pos.cart.diningOption = el.value; },
  'pos-clear': () => {
    if (!state.view.confirmClear) {
      state.view.confirmClear = true;
      toast('اضغط مرة أخرى لمسح الطلب');
      setTimeout(() => { state.view.confirmClear = false; }, 2500);
      return;
    }
    state.view.confirmClear = false;
    state.pos.cart = emptyCart();
    render();
  },

  // ---- العميل
  'pos-customer': () => openModal({ type: 'customer', search: '', results: [] }),
  'customer-search': (el) => {
    const m = state.modal;
    m.search = el.value;
    clearTimeout(m.timer);
    m.timer = setTimeout(async () => {
      try { m.results = await get('/api/customers', { search: m.search }); render(); } catch (e) { fail(e); }
    }, 220);
  },
  'customer-pick': (el) => {
    const c = state.modal.results.find((x) => x.id === el.dataset.id);
    state.pos.cart.customer = { id: c.id, name: c.name, points: c.points };
    state.pos.cart.pointsRedeemed = 0;
    closeModal();
  },
  'customer-create': (_el, _e, data) => busy(async () => {
    const c = await post('/api/customers', { name: data.name, phone: data.phone || null });
    state.pos.cart.customer = { id: c.id, name: c.name, points: c.points };
    state.modal = null;
    toast(`أُضيف ${c.name}`, 'ok');
  }),
  'customer-remove': () => { state.pos.cart.customer = null; state.pos.cart.pointsRedeemed = 0; render(); },
  'customer-points': (_el, _e, data) => {
    const cart = state.pos.cart;
    const pts = parseAmount(data.points) ?? 0;
    const max = Math.min(cart.customer.points, cartTotals({ ...cart, pointsRedeemed: 0 }).net);
    if (!Number.isSafeInteger(pts) || pts < 0 || pts > max) { toast(`الحد الأقصى ${max} نقطة`, 'bad'); return; }
    cart.pointsRedeemed = pts;
    closeModal();
  },

  // ---- التذاكر المفتوحة
  'pos-tickets': async () => {
    openModal({ type: 'tickets' });
    try { state.modal.list = await get('/api/tickets'); render(); } catch (e) { fail(e); }
  },
  'pos-save': () => {
    if (state.pos.cart.ticket) return saveTicket({ name: state.pos.cart.ticket.name, note: state.pos.cart.ticket.note });
    return openModal({ type: 'save-ticket' });
  },
  'ticket-name': (el) => { document.getElementById('ticket-name').value = el.dataset.name; },
  'ticket-save': (_el, _e, data) => saveTicket(data),
  'ticket-open': (el) => {
    const t = state.modal.list.find((x) => x.id === el.dataset.id);
    const lines = [];
    let missing = 0;
    for (const l of t.lines) {
      const item = state.catalog.items.find((i) => i.variants.some((v) => v.id === l.variantId));
      if (!item) { missing += 1; continue; }
      const variant = item.variants.find((v) => v.id === l.variantId);
      lines.push(cartLineFrom({ item, variant, optionIds: l.modifierOptionIds, qty: l.qty, note: l.note, discountIds: l.discountIds }));
    }
    state.pos.cart = { lines, discountIds: t.discountIds, customer: null, pointsRedeemed: 0, diningOption: t.diningOption ?? state.settings.diningOptions[0].id,
      ticket: { id: t.id, version: t.version, name: t.name, note: t.note } };
    if (t.customerId) get(`/api/customers/${t.customerId}`).then((c) => { state.pos.cart.customer = { id: c.id, name: c.name, points: c.points }; render(); }).catch(() => {});
    if (missing) toast(`${missing} صنف لم يعد متوفراً وأُزيل من التذكرة`, 'bad');
    closeModal();
  },
  'ticket-delete': (el) => busy(async () => {
    if (state.modal.confirmDelete !== el.dataset.id) { state.modal.confirmDelete = el.dataset.id; toast('اضغط مرة أخرى لتأكيد حذف التذكرة'); return; }
    await del(`/api/tickets/${el.dataset.id}`);
    state.modal.list = state.modal.list.filter((t) => t.id !== el.dataset.id);
    state.ticketsCount = state.modal.list.length;
    if (state.pos.cart.ticket?.id === el.dataset.id) state.pos.cart = emptyCart();
  }),

  'low-dismiss': () => { state.pos.lowDismissed = lowKey(state.catalog.lowStock ?? []); render(); },

  // ---- الدفع
  'pos-charge': () => {
    let total;
    try { total = cartTotals().total; } catch (e) { fail(e); return; }
    const cash = state.settings.paymentTypes.find((p) => p.active && p.kind === 'cash');
    openModal({ type: 'pay', stage: 'pay', total, payments: [], typeId: cash?.id, amountText: String(total), bills: [], clientId: uid() });
  },
  'pay-type': (el) => { const m = state.modal; m.typeId = el.dataset.id; m.bills = []; render(); },
  'pay-amount': (el) => { state.modal.amountText = el.value; render(); },
  'pay-exact': () => { state.modal.bills = []; render(); },
  // فئة نقدية: تُضاف للمستلم ما دام أقل من المبلغ (50 + 10 ألف)، وإلا تبدأ اختياراً جديداً
  'pay-bill': (el) => {
    const m = state.modal;
    const v = Number(el.dataset.v);
    const remaining = m.total - m.payments.reduce((a, x) => a + x.amount, 0);
    const amount = parseAmount(m.amountText) ?? remaining;
    const sum = m.bills.reduce((a, b) => a + b, 0);
    m.bills = m.bills.length && sum < amount ? [...m.bills, v] : [v];
    render();
  },
  'pay-add': () => {
    const m = state.modal;
    const p = currentPayment(m);
    if (!p) return;
    m.payments.push(p);
    const remaining = m.total - m.payments.reduce((a, x) => a + x.amount, 0);
    m.amountText = String(remaining);
    m.bills = [];
    render();
  },
  'pay-remove': (el) => {
    const m = state.modal;
    m.payments.splice(Number(el.dataset.i), 1);
    m.amountText = String(m.total - m.payments.reduce((a, x) => a + x.amount, 0));
    render();
  },
  'pay-confirm': () => busy(async () => {
    const m = state.modal;
    const payments = [...m.payments];
    const remaining = m.total - payments.reduce((a, x) => a + x.amount, 0);
    if (remaining > 0) {
      const p = currentPayment(m);
      if (!p || p.amount !== remaining) throw new Error('أكمل المبلغ المتبقي');
      payments.push(p);
    }
    const cart = state.pos.cart;
    const body = {
      clientId: m.clientId,
      lines: cart.lines.map((l) => ({ variantId: l.variantId, qty: l.qty, modifierOptionIds: l.modifiers.map((x) => x.id), note: l.note || null, discountIds: l.discountIds })),
      discountIds: cart.discountIds, customerId: cart.customer?.id ?? null, pointsRedeemed: cart.pointsRedeemed,
      diningOption: cart.diningOption, ticketId: cart.ticket?.id ?? null, ticketName: cart.ticket?.name ?? null,
      clientTotal: m.total, payments: payments.map((p) => ({ typeId: p.typeId, amount: p.amount, tendered: p.tendered })),
    };
    let r;
    try {
      r = await post('/api/sales', body);
      state.online = true;
    } catch (e) {
      if (e.code !== 'NETWORK') throw e;
      // انقطع الإنترنت: يُحفظ البيع على الجهاز ويُرسل تلقائياً عند عودة الاتصال (نفس clientId → لا تكرار)
      state.online = false;
      const change = payments.reduce((a, p) => a + Math.max(0, (p.tendered ?? p.amount) - p.amount), 0);
      queueSale(body, { total: m.total, lines: cart.lines.reduce((a, l) => a + l.qty, 0), employee: state.employee?.name ?? '' });
      state.modal = { type: 'pay', stage: 'done', offline: true, receipt: { number: null, totals: { total: m.total }, payments: [{ change }], pointsEarned: 0 } };
      if (cart.ticket) state.ticketsCount = Math.max(0, state.ticketsCount - 1);
      state.pos.cart = emptyCart();
      return;
    }
    state.modal = { type: 'pay', stage: 'done', receipt: r.receipt };
    if (cart.ticket) state.ticketsCount = Math.max(0, state.ticketsCount - 1);
    state.pos.cart = emptyCart();
    refreshAvailability();
  }),
  'pay-print': () => printReceipt(state.modal.receipt),
  'pay-new': () => closeModal(),
});

// فئات الدينار العراقي المعروضة عند الدفع نقداً
const BILLS = [5000, 10000, 25000, 50000];

/** المستلم نقداً: المبلغ بالضبط ما لم تُختر فئات */
function cashTendered(m, amount) {
  return m.bills.length ? m.bills.reduce((a, b) => a + b, 0) : amount;
}

function currentPayment(m) {
  const type = state.settings.paymentTypes.find((p) => p.id === m.typeId);
  const remaining = m.total - m.payments.reduce((a, x) => a + x.amount, 0);
  const amount = parseAmount(m.amountText) ?? remaining;
  if (!Number.isSafeInteger(amount) || amount <= 0 || amount > remaining) { toast('مبلغ غير صالح', 'bad'); return null; }
  let tendered = amount;
  if (type.kind === 'cash') {
    tendered = cashTendered(m, amount);
    if (tendered < amount) { toast('المستلم أقل من المبلغ', 'bad'); return null; }
  }
  return { typeId: type.id, typeName: type.name, amount, tendered };
}

async function saveTicket(data) {
  await busy(async () => {
    const cart = state.pos.cart;
    const body = {
      id: cart.ticket?.id, version: cart.ticket?.version, name: data.name, note: data.note || null,
      lines: cart.lines.map((l) => ({ variantId: l.variantId, qty: l.qty, modifierOptionIds: l.modifiers.map((x) => x.id), discountIds: l.discountIds, note: l.note || null })),
      discountIds: cart.discountIds, customerId: cart.customer?.id ?? null, diningOption: cart.diningOption, displayTotal: cartTotals().total,
    };
    await post('/api/tickets', body);
    if (!cart.ticket) state.ticketsCount += 1;
    state.pos.cart = emptyCart();
    state.modal = null;
    toast(`حُفظت التذكرة: ${data.name}`, 'ok');
  });
}

async function refreshAvailability() {
  try {
    const before = new Set((state.catalog?.lowStock ?? []).map((x) => `${x.variantId}:${x.out}`));
    state.catalog = (await get('/api/pos/bootstrap')).catalog;
    // مادة نزلت تحت الحد (أو نفدت) بسبب هذا البيع: تنبيه فوري
    const fresh = state.catalog.lowStock.filter((x) => !before.has(`${x.variantId}:${x.out}`));
    if (fresh.length) toast(`${fresh[0].out ? 'نفد' : 'انخفض مخزون'}: ${fresh.map((x) => x.name).join('، ')}`, 'bad');
    render();
  } catch { /* غير حرج */ }
}

async function enter() {
  if (!state.catalog) await loadBootstrap();
  else {
    const b = await get('/api/pos/bootstrap');
    Object.assign(state, { settings: b.settings, catalog: b.catalog, shift: b.shift, ticketsCount: b.ticketsCount });
  }
}

// ---------------------------------------------------------------- رسوم بيانية بسيطة (SVG بمقياس واحد)
function barChart(values, labels, { height = 200, highlight = -1, fmt = (v) => money(v, { symbol: false }) } = {}) {
  const w = 600;
  const pad = { t: 18, b: 28, l: 6, r: 6 };
  const max = Math.max(1, ...values);
  const nice = niceMax(max);
  const bw = (w - pad.l - pad.r) / values.length;
  const y = (v) => pad.t + (height - pad.t - pad.b) * (1 - v / nice);
  const grid = [0.5, 1].map((f) => `<line class="grid-line" x1="${pad.l}" x2="${w - pad.r}" y1="${y(nice * f)}" y2="${y(nice * f)}"/><text x="${w - pad.r}" y="${y(nice * f) - 3}" text-anchor="start">${fmt(nice * f)}</text>`).join('');
  const bars = values.map((v, i) => {
    const h = Math.max(v > 0 ? 2 : 0, height - pad.b - y(v));
    return `<rect class="bar ${i === highlight ? 'now' : ''}" x="${pad.l + i * bw + bw * 0.18}" y="${height - pad.b - h}" width="${bw * 0.64}" height="${h}" rx="3"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
  }).join('');
  const step = Math.ceil(values.length / 12);
  const xl = labels.map((l, i) => (i % step === 0 ? `<text x="${pad.l + i * bw + bw / 2}" y="${height - 8}" text-anchor="middle">${esc(l)}</text>` : '')).join('');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${height}" role="img" aria-label="رسم بياني">${grid}${bars}${xl}</svg></div>`;
}
function niceMax(v) {
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

function delta(now, before) {
  if (!before) return now ? '<span class="delta up">جديد اليوم</span>' : '<span class="delta muted">—</span>';
  const d = Math.round(((now - before) / Math.abs(before)) * 100);
  return `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% عن أمس</span>`;
}

const PAGES = {
  branches(s, a) {
    const list = a.branches;
    const rep = a.branchReport;
    const presets = [['today', 'اليوم'], ['yesterday', 'أمس'], ['week', '7 أيام'], ['month', 'هذا الشهر'], ['lastmonth', 'الشهر الماضي']];
    const head = `<div class="page-head"><h1>الفروع</h1><button class="btn primary" data-action="branch-new">${icon('plus', 'sm')} فرع جديد</button></div>
      <p class="muted small">كل فرع مقهى مستقل بموظفيه ومخزونه وإيصاله، تحت حسابك نفسه. هذا الجهاز يعمل الآن في: <b>${esc(s.shop?.name ?? '')}</b>.</p>`;
    if (!list) return `${head}<p class="muted">جارٍ التحميل…</p>`;
    const cols = (r) => `<td class="num">${money(r.net)}</td><td class="num">${r.salesCount}</td><td class="num">${money(r.profit)}</td><td class="num">${money(r.expenses)}</td><td class="num"><b>${money(r.netProfit)}</b></td>`;
    return `${head}
      <div class="toolbar"><div class="seg">${presets.map(([k, l]) => `<button class="${a.branchPreset === k ? 'on' : ''}" data-action="branch-preset" data-k="${k}">${l}</button>`).join('')}</div></div>
      <div class="table-wrap"><table><thead><tr><th>الفرع</th><th class="num">صافي المبيعات</th><th class="num">الإيصالات</th><th class="num">الربح الإجمالي</th><th class="num">المصروفات</th><th class="num">صافي الربح</th><th></th></tr></thead>
      <tbody>${(rep?.rows ?? list).map((r) => `<tr><td><b>${esc(r.name)}</b> ${r.current ? '<span class="pill ok">هذا الجهاز</span>' : ''}${list.find((x) => x.id === r.id)?.disabled ? ' <span class="pill bad">موقوف</span>' : ''}</td>
        ${rep ? cols(r) : '<td colspan="5" class="muted">…</td>'}
        <td>${r.current ? '' : `<button class="btn sm" data-action="branch-switch" data-id="${r.id}">التبديل لهذا الفرع</button>`}</td></tr>`).join('')}</tbody>
      ${rep && rep.rows.length > 1 ? `<tfoot><tr><td>المجموع</td>${cols(rep.totals)}<td></td></tr></tfoot>` : ''}</table></div>`;
  },

  expenses(s, a) {
    const e = a.expenses;
    const presets = [['today', 'اليوم'], ['week', '7 أيام'], ['month', 'هذا الشهر'], ['lastmonth', 'الشهر الماضي']];
    const head = `<div class="page-head"><h1>المصروفات</h1><button class="btn primary" data-action="exp-new">${icon('plus', 'sm')} مصروف</button></div>
      <div class="toolbar"><div class="seg">${presets.map(([k, l]) => `<button class="${a.expPreset === k ? 'on' : ''}" data-action="exp-preset" data-k="${k}">${l}</button>`).join('')}</div></div>`;
    if (!e) return `${head}<p class="muted">جارٍ التحميل…</p>`;
    const cats = Object.entries(e.byCategory).sort((x, y) => y[1] - x[1]);
    return `${head}
      <div class="kpis"><div class="kpi lead"><span class="label">مجموع المصروفات</span><b>${money(e.total)}</b><span class="muted small">${e.rows.length} مصروف</span></div>
        ${cats.slice(0, 3).map(([k, v]) => `<div class="kpi"><span class="label">${esc(EXPENSE_CATS[k] ?? k)}</span><b>${money(v)}</b></div>`).join('')}</div>
      <div class="table-wrap"><table><thead><tr><th>اليوم</th><th>البند</th><th>ملاحظة</th><th>بواسطة</th><th class="num">المبلغ</th><th></th></tr></thead>
      <tbody>${e.rows.map((x) => `<tr><td class="small">${esc(x.day)}</td><td><b>${esc(x.categoryName)}</b>${x.fromDrawer ? ' <span class="pill">من الدرج</span>' : ''}</td>
        <td class="small">${esc(x.note ?? '')}</td><td class="small">${esc(x.byName ?? '')}</td><td class="num">${money(x.amount)}</td>
        <td><button class="icon-btn" data-action="exp-delete" data-id="${x.id}" aria-label="حذف">${icon('trash', 'sm')}</button></td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">لا مصروفات في هذه الفترة</td></tr>'}</tbody></table></div>
      <p class="muted small">المصروفات تُطرح من الربح الإجمالي في التقرير اليومي والتقارير ليظهر صافي الربح. المصروف المدفوع من الدرج يُسجَّل أيضاً كسحب من الوردية.</p>`;
  },

  audit(s, a) {
    const groups = [['', 'الكل'], ['receipt', 'الاسترجاع'], ['discount', 'الخصومات'], ['inventory', 'المخزون'], ['item', 'الأصناف والأسعار'], ['shift', 'الورديات والنقد'], ['ticket', 'التذاكر'], ['employee', 'الموظفون'], ['settings', 'الإعدادات']];
    const presets = [['today', 'اليوم'], ['week', '7 أيام'], ['month', 'هذا الشهر']];
    const rows = a.audit;
    return `<div class="page-head"><h1>سجل العمليات</h1><span class="muted small">كل عملية حساسة مع الموظف ووقتها. لا يمكن تعديل السجل أو حذفه.</span></div>
      <div class="toolbar"><div class="seg">${presets.map(([k, l]) => `<button class="${a.auditPreset === k ? 'on' : ''}" data-action="audit-preset" data-k="${k}">${l}</button>`).join('')}</div></div>
      <div class="row wrap">${groups.map(([k, l]) => `<button class="chip ${(a.auditGroup ?? '') === k ? 'on' : ''}" data-action="audit-group" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الموظف</th><th>العملية</th><th>التفاصيل</th></tr></thead>
      <tbody>${rows === undefined || rows === null ? '<tr><td colspan="4" class="muted">جارٍ التحميل…</td></tr>'
        : rows.length ? rows.map((x) => `<tr class="${AUDIT_WARN.has(x.action) ? 'audit-warn' : ''}"><td class="small">${dateTime(x.at, tz())}</td><td>${esc(x.byName ?? '—')}</td>
          <td><b>${esc(AUDIT_LABELS[x.action] ?? x.action)}</b></td><td class="small">${auditDetails(x)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="muted">لا عمليات في هذه الفترة</td></tr>'}</tbody></table></div>`;
  },

  daily(s, a) {
    const d = a.daily;
    const head = `<div class="page-head"><h1>التقرير اليومي</h1>
      <div class="row wrap"><input type="date" id="daily-date" value="${esc(a.dailyDate ?? '')}" data-change="daily-date" aria-label="اليوم" style="width:auto">
        <button class="btn" data-action="daily-share" ${d ? '' : 'disabled'}>${icon('arrow', 'sm')} مشاركة</button>
        <button class="btn primary" data-action="daily-print" ${d ? '' : 'disabled'}>${icon('print', 'sm')} طباعة</button></div></div>`;
    if (!d) return `${head}<p class="muted">جارٍ التحميل…</p>`;
    const sm = d.summary;
    const kpi = (label, value, sub = '') => `<div class="kpi"><span class="muted small">${label}</span><b>${value}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}</div>`;
    return `${head}
      <div class="kpis">
        ${kpi('صافي المبيعات', money(sm.net), `${sm.salesCount} إيصال · متوسط ${money(sm.avgSale)}`)}
        ${kpi('الربح الإجمالي', money(sm.profit), `تكلفة الموارد ${money(d.consumptionCost)}`)}
        ${kpi('المصروفات', money(sm.expenses), d.expenses.length ? d.expenses.map((x) => esc(EXPENSE_CATS[x.category] ?? x.category)).join('، ') : 'لا مصروفات')}
        ${kpi('صافي الربح', `<span style="color:${sm.netProfit < 0 ? 'var(--bad)' : 'inherit'}">${money(sm.netProfit)}</span>`, 'بعد المصروفات')}
      </div>
      <div class="grid-2" style="align-items:start">
        <section class="card pad stack"><h2>طرق الدفع</h2>
          ${d.byPayment.length ? d.byPayment.map((p) => `<div class="r-line"><span>${esc(p.label)} <span class="muted small">${p.count} عملية</span></span><span class="num">${money(p.net)}</span></div>`).join('') : '<p class="muted">لا مدفوعات</p>'}
          ${sm.refundsCount ? `<div class="r-line"><span>المرتجعات <span class="muted small">${sm.refundsCount}</span></span><span class="num">${neg(sm.refunds)}</span></div>` : ''}
          ${sm.discounts ? `<div class="r-line"><span>الخصومات</span><span class="num">${neg(sm.discounts)}</span></div>` : ''}</section>
        <section class="card pad stack"><h2>الأصناف المباعة</h2>
          ${d.byItem.length ? `<div class="table-wrap"><table><thead><tr><th>الصنف</th><th class="num">الكمية</th><th class="num">الصافي</th></tr></thead><tbody>
            ${d.byItem.map((i) => `<tr><td>${esc(i.label)}</td><td class="num">${i.qty - i.refundedQty}</td><td class="num">${money(i.net)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لا مبيعات</p>'}</section>
      </div>
      <section class="card pad stack"><h2>الموارد المصروفة اليوم</h2>
        <p class="muted small">محسوبة من الكميات التقريبية في وصفة كل صنف، ومطروحة من المخزون تلقائياً مع كل بيع.</p>
        ${d.consumption.length ? `<div class="table-wrap"><table><thead><tr><th>المادة</th><th class="num">المصروف</th><th class="num">الهدر</th><th class="num">المتبقي</th><th class="num">التكلفة</th></tr></thead><tbody>
          ${d.consumption.map((c) => `<tr><td>${esc(c.name)} ${c.ingredient ? '<span class="pill olive">مكون</span>' : ''}</td><td class="num">${qty(c.used, c.unit)}</td><td class="num">${c.loss ? qty(c.loss, c.unit) : '—'}</td>
            <td class="num"><span class="${c.low ? 'pill warn' : ''}">${qty(c.stock, c.unit)}</span></td><td class="num">${money(c.cost)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لم يُصرف شيء من المخزون في هذا اليوم</p>'}
      </section>
      ${d.lowStock.length ? `<section class="card pad stack"><h2>${icon('alert', 'sm')} مواد تحت حد التنبيه</h2>
        <div class="row wrap">${d.lowStock.map((c) => `<span class="pill warn">${esc(c.name)}: ${qty(c.stock, c.unit)}</span>`).join('')}</div></section>` : ''}`;
  },

  dashboard(s, a) {
    const d = a.dashboard;
    if (!d) return '<p class="muted">جارٍ التحميل…</p>';
    const t = d.todaySummary;
    const y = d.yesterdaySummary;
    const hourNow = new Date(Date.now() + tz() * 60000).getUTCHours();
    const hours = d.byHour.slice(6, 24);
    const topMax = Math.max(1, ...d.topItems.map((i) => i.net));
    return `<div class="page-head"><h1>اليوم في ${esc(s.settings?.name ?? '')}</h1><span class="muted">${d.today}</span></div>
      <div class="kpis">
        <div class="kpi lead"><span class="label">صافي المبيعات</span><b>${money(t.net)}</b>${delta(t.net, y.net)}</div>
        <div class="kpi"><span class="label">الإيصالات</span><b class="num">${t.salesCount}</b>${delta(t.salesCount, y.salesCount)}</div>
        <div class="kpi"><span class="label">متوسط الفاتورة</span><b>${money(t.avgSale)}</b>${delta(t.avgSale, y.avgSale)}</div>
        <div class="kpi"><span class="label">الربح الإجمالي</span><b>${money(t.profit)}</b><span class="muted small">بعد تكلفة المكونات ${money(t.cogs)}</span></div>
      </div>
      <div class="row wrap">
        ${d.openShift ? `<span class="pill ok">${icon('clock', 'sm')} وردية #${d.openShift.number} مفتوحة · ${esc(d.openShift.openedByName)}</span>` : '<span class="pill">لا وردية مفتوحة</span>'}
        ${d.openTickets ? `<span class="pill petrol">${d.openTickets} تذكرة مفتوحة</span>` : ''}
        ${d.lowStock ? `<a class="pill warn" href="#/admin/inventory">${icon('alert', 'sm')} ${d.lowStock} مادة تحت حد المخزون</a>` : ''}
        ${t.refundsCount ? `<span class="pill bad">${t.refundsCount} استرجاع · ${money(t.refunds)}</span>` : ''}
      </div>
      <div class="split-view">
        <section class="card pad stack"><h2>المبيعات حسب الساعة</h2>${barChart(hours.map((h) => h.net), hours.map((h) => `${h.hour}`), { highlight: hourNow - 6 })}</section>
        <section class="card pad stack"><h2>آخر 7 أيام</h2>${barChart(d.week.map((x) => x.net), d.week.map((x) => x.key.slice(5)), { highlight: 6 })}</section>
      </div>
      <div class="split-view">
        <section class="card pad stack"><h2>الأكثر مبيعاً اليوم</h2>
          ${d.topItems.length ? d.topItems.map((i) => `<div class="stack" style="gap:4px"><div class="r-line"><span>${esc(i.label)} <span class="muted small">× ${i.qty - i.refundedQty}</span></span><span class="num">${money(i.net)}</span></div>
            <div class="meter"><i style="width:${Math.round((i.net / topMax) * 100)}%"></i></div></div>`).join('') : '<p class="muted">لا مبيعات بعد</p>'}</section>
        <section class="card pad stack"><h2>طرق الدفع</h2>
          ${d.byPayment.length ? d.byPayment.map((p) => `<div class="r-line"><span>${esc(p.label)} <span class="muted small">${p.count} عملية</span></span><span class="num">${money(p.net)}</span></div>`).join('') : '<p class="muted">لا مدفوعات بعد</p>'}</section>
      </div>`;
  },

  reports(s, a) {
    const r = a.report;
    const tab = a.reportTab ?? 'items';
    const presets = [['today', 'اليوم'], ['yesterday', 'أمس'], ['week', '7 أيام'], ['month', 'هذا الشهر'], ['lastmonth', 'الشهر الماضي']];
    const TABS = { items: 'الأصناف', categories: 'التصنيفات', employees: 'الموظفون', payments: 'طرق الدفع', modifiers: 'الإضافات', discounts: 'الخصومات', dining: 'نوع الطلب', days: 'الأيام' };
    const sm = r?.summary;
    const head = `<div class="page-head"><h1>التقارير</h1>
      ${globalThis.MORECASH_BACKEND ? '' : `<button class="btn sm" data-action="report-csv" ${r ? '' : 'disabled'}>`}${globalThis.MORECASH_BACKEND ? '' : `${icon('download', 'sm')} تصدير CSV</button>`}</div>
      <div class="toolbar"><div class="seg">${presets.map(([k, l]) => `<button class="${a.preset === k ? 'on' : ''}" data-action="report-preset" data-k="${k}">${l}</button>`).join('')}</div>
        <input type="date" id="rp-from" value="${esc(a.from ?? '')}" data-change="report-from" aria-label="من"><input type="date" id="rp-to" value="${esc(a.to ?? '')}" data-change="report-to" aria-label="إلى"></div>`;
    if (!r) return `${head}<p class="muted">جارٍ التحميل…</p>`;
    const summary = `<div class="table-wrap"><table><tbody>
      <tr><td>إجمالي المبيعات</td><td class="num">${money(sm.gross)}</td><td>الإيصالات</td><td class="num">${sm.salesCount}</td></tr>
      <tr><td>المرتجعات</td><td class="num">${neg(sm.refunds)}</td><td>عمليات الاسترجاع</td><td class="num">${sm.refundsCount}</td></tr>
      <tr><td>الخصومات</td><td class="num">${neg(sm.discounts)}</td><td>متوسط الفاتورة</td><td class="num">${money(sm.avgSale)}</td></tr>
      <tr><td><b>صافي المبيعات</b></td><td class="num"><b>${money(sm.net)}</b></td><td>صافي النقد</td><td class="num">${money(sm.cashNet)}</td></tr>
      <tr><td>تكلفة البضاعة</td><td class="num">${neg(sm.cogs)}</td><td>الضريبة</td><td class="num">${money(sm.tax)}</td></tr>
      <tr><td><b>الربح الإجمالي</b></td><td class="num"><b>${money(sm.profit)}</b></td><td>هامش الربح</td><td class="num">${sm.net ? `${Math.round((sm.profit / sm.net) * 100)}%` : '—'}</td></tr>
      <tr><td>المصروفات</td><td class="num">${neg(sm.expenses ?? 0)}</td><td><b>صافي الربح</b></td><td class="num"><b>${money(sm.netProfit ?? sm.profit)}</b></td></tr>
    </tbody></table></div>`;
    const table = reportTable(tab, r);
    return `${head}${summary}
      <div class="seg" style="overflow-x:auto;max-width:100%">${Object.entries(TABS).map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-action="report-tab" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="table-wrap">${table}</div>`;
  },

  shifts(s, a) {
    const list = a.shifts;
    return `<div class="page-head"><h1>الورديات</h1></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>الفتح</th><th>الإغلاق</th><th class="num">المتوقع</th><th class="num">الفعلي</th><th class="num">الفرق</th><th class="num">صافي المبيعات</th><th>ملاحظة</th></tr></thead>
      <tbody>${(list ?? []).map((x) => `<tr><td class="num">${x.number}</td><td class="small">${dateTime(x.openedAt, tz())}<div class="muted">${esc(x.openedByName)}</div></td>
        <td class="small">${x.closedAt ? `${dateTime(x.closedAt, tz())}<div class="muted">${esc(x.closedByName)}</div>` : '<span class="pill ok">مفتوحة</span>'}</td>
        <td class="num">${x.summary ? money(x.summary.expectedCash) : '—'}</td><td class="num">${x.actualCash !== undefined ? money(x.actualCash) : '—'}</td>
        <td class="num">${x.difference !== undefined ? `<span class="pill ${x.difference === 0 ? 'ok' : x.difference < 0 ? 'bad' : 'warn'}">${money(x.difference, { sign: true })}</span>` : '—'}</td>
        <td class="num">${x.summary ? money(x.summary.net) : '—'}</td><td class="small">${esc(x.note ?? '')}</td></tr>`).join('') || `<tr><td colspan="8" class="muted">${list ? 'لا ورديات' : 'جارٍ التحميل…'}</td></tr>`}</tbody></table></div>`;
  },

  items(s, a) {
    const items = a.items;
    const cats = new Map((a.categories ?? []).map((c) => [c.id, c]));
    const f = a.itemFilter ?? 'sale';
    const q = (a.itemSearch ?? '').trim();
    const list = (items ?? []).filter((i) => (f === 'sale' ? i.forSale : !i.forSale) && (!q || i.name.includes(q)));
    return `<div class="page-head"><h1>الأصناف</h1><button class="btn primary" data-action="item-new">${icon('plus', 'sm')} صنف جديد</button></div>
      <div class="toolbar"><div class="seg"><button class="${f === 'sale' ? 'on' : ''}" data-action="items-filter" data-f="sale">للبيع</button><button class="${f === 'ing' ? 'on' : ''}" data-action="items-filter" data-f="ing">المكونات</button></div>
        <input type="search" id="it-search" placeholder="بحث" value="${esc(q)}" data-input="items-search"></div>
      <div class="table-wrap"><table><thead><tr><th>الصنف</th><th>${f === 'sale' ? 'التصنيف' : 'الوحدة'}</th><th>الأحجام</th><th class="num">${f === 'sale' ? 'السعر' : 'التكلفة/وحدة'}</th><th class="num">المخزون</th></tr></thead>
      <tbody>${list.map((i) => `<tr class="click" data-action="item-edit" data-id="${i.id}">
        <td><span class="row"><span class="swatch-dot c-${i.color}" style="width:14px;height:14px;border-radius:4px;background:var(--c);display:inline-block"></span><b>${esc(i.name)}</b></span></td>
        <td>${f === 'sale' ? esc(cats.get(i.categoryId)?.name ?? '—') : esc(i.unit ?? '')}</td>
        <td class="small">${i.variants.map((v) => esc(v.name || '—')).join('، ')}</td>
        <td class="num">${f === 'sale' ? i.variants.map((v) => money(v.price, { symbol: false })).join(' / ') : `${formatMilli(i.variants[0]?.costMilli ?? 0)} د.ع`}</td>
        <td class="num">${i.variants.map((v) => (v.recipe?.length ? '<span class="pill">وصفة</span>' : v.trackStock ? `<span class="pill ${v.stock <= v.lowStock ? 'warn' : ''}">${v.stock}</span>` : '—')).join(' ')}</td></tr>`).join('')
        || `<tr><td colspan="5"><div class="empty">${icon('cup')}<p>${items ? 'لا أصناف' : 'جارٍ التحميل…'}</p></div></td></tr>`}</tbody></table></div>`;
  },

  categories(s, a) {
    return simpleList('التصنيفات', 'category', a.categories, ['الاسم', 'اللون', 'الترتيب'],
      (c) => [`<b>${esc(c.name)}</b>${c.active === false ? ' <span class="pill">مؤرشف</span>' : ''}`, `<span class="pill c-${c.color}" style="background:var(--c);color:#fff">${COLORS[c.color]}</span>`, `<span class="num">${c.sort}</span>`]);
  },
  modifiers(s, a) {
    return simpleList('الإضافات', 'modifier', (a.modifiers ?? []).filter((m) => m.active !== false), ['المجموعة', 'النوع', 'الخيارات'],
      (m) => [`<b>${esc(m.name)}</b>${m.required ? ' <span class="pill petrol">إلزامي</span>' : ''}`, m.selection === 'single' ? 'خيار واحد' : 'متعدد',
        `<span class="small">${m.options.map((o) => `${esc(o.name)}${o.price ? ` (+${money(o.price, { symbol: false })})` : ''}`).join('، ')}</span>`]);
  },
  discounts(s, a) {

function auditDetails(x) {
  const d = x.data ?? {};
  const parts = [];
  if (d.sale) parts.push(`إيصال #${d.sale}${d.refund ? ` ← استرجاع #${d.refund}` : ''}`);
  if (d.receipt) parts.push(`إيصال #${d.receipt}`);
  if (Number.isSafeInteger(d.total)) parts.push(money(d.total));
  if (d.discount) parts.push(esc(d.discount));
  if (d.reason) parts.push(`السبب: ${esc(d.reason)}`);
  if (d.name) parts.push(esc(d.name));
  for (const c of d.priceChanges ?? []) parts.push(`${esc(c.variant || 'السعر')}: ${money(c.from)} ← ${money(c.to)}`);
  if (d.removedSizes) parts.push(`حُذف ${d.removedSizes} حجم`);
  if (Number.isSafeInteger(d.delta)) parts.push(`الكمية ${d.delta > 0 ? '+' : ''}${d.delta.toLocaleString('en-US')}`);
  if (Number.isSafeInteger(d.amount)) parts.push(money(d.amount));
  if (Number.isSafeInteger(d.difference)) parts.push(`الفرق ${money(d.difference, { sign: true })}`);
  if (Number.isSafeInteger(d.startingCash)) parts.push(`بداية ${money(d.startingCash)}`);
  if (d.role) parts.push(esc(ROLES[d.role] ?? d.role));
  if (d.pinChanged) parts.push('تغيير الرمز');
  if (d.active === false) parts.push('تعطيل');
  if (d.category) parts.push(esc(d.category));
  if (d.note) parts.push(esc(d.note));
  if (Array.isArray(d.keys) && d.keys.length) parts.push(esc(d.keys.join('، ')));
  return parts.join(' · ') || '—';
}

const qty = (n, unit) => `${Number(n).toLocaleString('en-US')} ${esc(unit ?? '')}`;

// ---------------------------------------------------------------- التقرير اليومي: نص للمشاركة وورقة للطباعة
function dailyText(d) {
  const sm = d.summary;
  const lines = [
    `📊 التقرير اليومي — ${d.shopName}`, `📅 ${d.date}`, '',
    `صافي المبيعات: ${money(sm.net)}`, `عدد الإيصالات: ${sm.salesCount}`, `متوسط الفاتورة: ${money(sm.avgSale)}`, `الربح الإجمالي: ${money(sm.profit)}`,
    ...(sm.expenses ? [`المصروفات: ${money(sm.expenses)}`] : []), `💰 صافي الربح: ${money(sm.netProfit)}`,
    ...(sm.refundsCount ? [`المرتجعات: ${money(sm.refunds)} (${sm.refundsCount})`] : []),
    ...(sm.discounts ? [`الخصومات: ${money(sm.discounts)}`] : []),
    '', '💳 طرق الدفع:', ...d.byPayment.map((p) => `• ${p.label}: ${money(p.net)} (${p.count})`),
    '', '☕ الأصناف المباعة:', ...d.byItem.map((i) => `• ${i.label}: ${i.qty - i.refundedQty} — ${money(i.net)}`),
  ];
  if (d.consumption.length) {
    lines.push('', '📦 الموارد المصروفة:', ...d.consumption.map((c) => `• ${c.name}: ${Number(c.used).toLocaleString('en-US')} ${c.unit}${c.loss ? ` (+هدر ${c.loss})` : ''} — المتبقي ${Number(c.stock).toLocaleString('en-US')}`));
    lines.push(`تكلفة الموارد: ${money(d.consumptionCost)}`);
  }
  if (d.lowStock.length) lines.push('', '⚠️ تحت حد التنبيه:', ...d.lowStock.map((c) => `• ${c.name}: ${Number(c.stock).toLocaleString('en-US')} ${c.unit}`));
  return lines.join('\n');
}

    ${row('<b>صافي المبيعات د.ع</b>', `<b>${m(sm.net)}</b>`)}${row('الإيصالات', sm.salesCount)}${row('متوسط الفاتورة', m(sm.avgSale))}${row('الربح الإجمالي', m(sm.profit))}
    ${sm.expenses ? row('المصروفات', `-${m(sm.expenses)}`) : ''}${row('<b>صافي الربح</b>', `<b>${m(sm.netProfit)}</b>`)}
    ${sm.refundsCount ? row(`المرتجعات (${sm.refundsCount})`, `-${m(sm.refunds)}`) : ''}${sm.discounts ? row('الخصومات', `-${m(sm.discounts)}`) : ''}
    <hr><b>طرق الدفع</b>${d.byPayment.map((p) => row(`${esc(p.label)} (${p.count})`, m(p.net))).join('')}
    <hr><b>الأصناف المباعة</b>${d.byItem.map((i) => row(`${i.qty - i.refundedQty}× ${esc(i.label)}`, m(i.net))).join('')}
    ${d.consumption.length ? `<hr><b>الموارد المصروفة</b>${d.consumption.map((c) => row(esc(c.name), `${Number(c.used + c.loss).toLocaleString('en-US')} ${esc(c.unit)}`)).join('')}${row('التكلفة', m(d.consumptionCost))}` : ''}
    ${d.lowStock.length ? `<hr><b>تحت حد التنبيه</b>${d.lowStock.map((c) => row(esc(c.name), `${Number(c.stock).toLocaleString('en-US')} ${esc(c.unit)}`)).join('')}` : ''}

function simpleList(title, kind, list, headers, cells) {
  return `<div class="page-head"><h1>${title}</h1><button class="btn primary" data-action="${kind}-new">${icon('plus', 'sm')} إضافة</button></div>
    <div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${(list ?? []).map((x) => `<tr class="click" data-action="${kind}-edit" data-id="${x.id}">${cells(x).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${headers.length}" class="muted">${list ? 'لا عناصر' : 'جارٍ التحميل…'}</td></tr>`}</tbody></table></div>`;
}

function reportRows(tab, r) {
  switch (tab) {
    case 'items': return { head: ['الصنف', 'المباع', 'المسترجع', 'صافي المبيعات', 'التكلفة', 'الربح'], rows: r.byItem.map((x) => [x.label, x.qty, x.refundedQty, x.net, x.cogs, x.profit]), money: [3, 4, 5] };
    case 'categories': return { head: ['التصنيف', 'المباع', 'صافي المبيعات', 'التكلفة', 'الربح'], rows: r.byCategory.map((x) => [x.label, x.qty - x.refundedQty, x.net, x.cogs, x.profit]), money: [2, 3, 4] };
    case 'employees': return { head: ['الموظف', 'الإيصالات', 'المرتجعات', 'الخصومات', 'صافي المبيعات', 'متوسط الفاتورة'], rows: r.byEmployee.map((x) => [x.label, x.salesCount, x.refunds, x.discounts, x.net, x.avgSale]), money: [2, 3, 4, 5] };
    case 'payments': return { head: ['طريقة الدفع', 'العمليات', 'المدفوع', 'المسترجع', 'الصافي'], rows: r.byPayment.map((x) => [x.label, x.count, x.paid, x.refunded, x.net]), money: [2, 3, 4] };
    case 'modifiers': return { head: ['الإضافة', 'العدد', 'المبلغ'], rows: r.byModifier.map((x) => [x.label, x.count, x.amount]), money: [2] };
    case 'discounts': return { head: ['الخصم', 'مرات الاستخدام', 'المبلغ'], rows: r.byDiscount.map((x) => [x.label, x.count, x.amount]), money: [2] };
    case 'dining': return { head: ['نوع الطلب', 'الإيصالات', 'صافي المبيعات'], rows: r.byDining.map((x) => [x.label, x.salesCount, x.net]), money: [2] };
    default: return { head: ['اليوم', 'الإيصالات', 'المرتجعات', 'صافي المبيعات', 'الربح'], rows: r.byDay.map((x) => [x.label, x.salesCount, x.refunds, x.net, x.profit]), money: [2, 3, 4] };
  }
}

function reportTable(tab, r) {
  const { head, rows, money: mcols } = reportRows(tab, r);
  if (!rows.length) return '<div class="empty"><p>لا بيانات في هذه الفترة</p></div>';
  const totals = head.map((_, i) => (i === 0 ? 'المجموع' : rows.reduce((a, row) => a + (Number(row[i]) || 0), 0)));
  const cell = (v, i) => (i === 0 ? `<td>${esc(v)}</td>` : `<td class="num">${mcols.includes(i) ? money(v) : Number(v).toLocaleString('en-US')}</td>`);
  return `<table><thead><tr>${head.map((h, i) => `<th class="${i ? 'num' : ''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((row) => `<tr>${row.map(cell).join('')}</tr>`).join('')}</tbody>
    ${['days', 'items', 'categories', 'payments', 'employees'].includes(tab) ? `<tfoot><tr>${totals.map((v, i) => (i === 0 ? `<td>${v}</td>` : tab === 'employees' && i === 5 ? '<td></td>' : cell(v, i))).join('')}</tr></tfoot>` : ''}</table>`;
}

/** تصغير صورة الفاتورة قبل الإرسال (أطول ضلع 1600 بكسل، JPEG) — يكفي للقراءة ويبقى تحت حد الطلب */
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(Object.assign(new Error('img'), { code: 'INVALID_IMAGE' })); i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return { data: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], mediaType: 'image/jpeg' };
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ---------------------------------------------------------------- التحميل
function presetRange(k) {
  const today = localDate(Date.now(), tz());
  const d = (n) => localDate(Date.now() - n * 86400000, tz());
  const first = `${today.slice(0, 7)}-01`;
  const lastMonthEnd = localDate(new Date(`${first}T00:00:00Z`).getTime() - 86400000, 0);
  const lastMonthStart = `${lastMonthEnd.slice(0, 7)}-01`;
  return { today: [today, today], yesterday: [d(1), d(1)], week: [d(6), today], month: [first, today], lastmonth: [lastMonthStart, lastMonthEnd] }[k];
}
