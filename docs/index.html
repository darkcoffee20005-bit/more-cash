  const viewAdj = (a) => ({ id: a._id, employeeId: a.employeeId, employeeName: a.employeeName, type: a.type, amount: a.amount, reason: a.reason, day: a.day, source: a.source, byName: a.byName });

  // ---------------------------------------------------------------- تصحيح الحضور (نسي الانصراف، وقت خاطئ)
  async function fixAttendance(actor, attId, input = {}) {
    requirePerm(actor, 'hr.manage');
    const a = await ATT().findOne({ _id: checkId(attId) });
    if (!a) throw notFound();
    const inAt = input.inAt ? new Date(input.inAt) : new Date(a.inAt);
    const outAt = input.outAt ? new Date(input.outAt) : null;
    if (Number.isNaN(inAt.getTime()) || (outAt && Number.isNaN(outAt.getTime()))) throw bad('INVALID_DATE');
    if (outAt && (outAt <= inAt || outAt - inAt > 24 * 3600_000)) throw bad('INVALID_RANGE');
    if (inAt > now() || (outAt && outAt > now())) throw bad('INVALID_DATE');
    const note = str(input.note, { field: 'note', min: 2, max: 160 });
    await assertOpenMonth(a.employeeId, a.day && monthOf(a.day), monthOf(localDate(inAt, await tz())));
    const set = { inAt, outAt, open: !outAt, day: localDate(inAt, await tz()), fixed: { byName: actor.name, at: now(), note, before: { inAt: a.inAt, outAt: a.outAt ?? null } } };
    try { await ATT().updateOne({ _id: a._id }, { $set: set }); } catch (e) { if (isDup(e)) throw conflict('ALREADY_CLOCKED_IN'); throw e; }
    await audit({ ...ctx, actor }, 'hr.attendance_fix', { name: a.employeeName, note });
    return viewAtt(await ATT().findOne({ _id: a._id }));
  }

  // ---------------------------------------------------------------- السياسة، جدول الدوام، ملف الموظف
  async function policy() {
    const st = await getSettings(db);
    return { ...HR_POLICY, ...(st.hrPolicy ?? {}) };
  }
  async function getPolicy(actor) { requirePerm(actor, 'hr.manage'); return policy(); }
  async function savePolicy(actor, input = {}) {
    requirePerm(actor, 'admin.employees');
    const cur = await policy();
    const n = (k, min, max) => (input[k] === undefined || input[k] === '' || input[k] === null ? cur[k] : int(input[k], { field: k, min, max }));
    const p = {
      graceMin: n('graceMin', 0, 240), lateStepMin: n('lateStepMin', 1, 240), lateFine: n('lateFine', 0, 10_000_000),
      deductAbsence: input.deductAbsence === undefined ? cur.deductAbsence : input.deductAbsence === true,
      overtimeHourly: n('overtimeHourly', 0, 10_000_000), advanceMaxBp: n('advanceMaxBp', 0, 30000), dayDivisor: cur.dayDivisor,
    };
    await db.collection('settings').updateOne({ _id: 'store' }, { $set: { hrPolicy: p } });
    await audit({ ...ctx, actor }, 'hr.policy', p);
    return p;
  }

  function parseSchedule(list) {
    if (list == null) return null;
    if (!Array.isArray(list) || list.length !== 7) throw bad('INVALID_LIST', 'schedule');
    const out = list.map((d) => {
      if (!d) return null;
      if (!HHMM.test(d.start ?? '') || !HHMM.test(d.end ?? '') || d.start === d.end) throw bad('INVALID_TIME', 'schedule');
      return { start: d.start, end: d.end };
    });
    return out.some(Boolean) ? out : null;
  }
  const planMinutes = (d) => (toMin(d.end) - toMin(d.start) + 1440) % 1440; // دوام يعبر منتصف الليل مقبول

  const profileView = (e, showPay) => ({
    id: e._id, name: e.name, role: e.role, active: e.active, phone: e.phone ?? null, nationalId: e.nationalId ?? null, emergency: e.emergency ?? null,
    notes: e.notes ?? null, hiredAt: e.hiredAt ?? null, schedule: e.schedule ?? null, annualLeave: e.annualLeave ?? 14,
    ...(showPay ? { payType: e.payType ?? 'monthly', salary: e.salary ?? 0, hourlyRate: e.hourlyRate ?? 0 } : {}),
  });

  async function saveProfile(actor, employeeId, input = {}) {
    requirePerm(actor, 'hr.manage');
    const emp = await EMP().findOne({ _id: checkId(employeeId) });
    if (!emp) throw notFound();
    const hiredAt = input.hiredAt ? String(input.hiredAt) : null;
    if (hiredAt && !DATE.test(hiredAt)) throw bad('INVALID_DATE', 'hiredAt');
    const set = {
      phone: str(input.phone, { field: 'phone', max: 20, optional: true }), nationalId: str(input.nationalId, { field: 'nationalId', max: 30, optional: true }),
      emergency: str(input.emergency, { field: 'emergency', max: 60, optional: true }), notes: str(input.notes, { field: 'notes', max: 300, optional: true }),
      hiredAt, schedule: parseSchedule(input.schedule),
    };
    const owner = can(actor.role, 'admin.employees'); // الأجر للمالك فقط
    if (owner) {
      if (input.payType !== undefined) set.payType = oneOf(input.payType, ['monthly', 'hourly'], 'payType');
      if (input.salary !== undefined && input.salary !== null && input.salary !== '') set.salary = int(input.salary, { field: 'salary', min: 0, max: 1_000_000_000 });
      if (input.hourlyRate !== undefined && input.hourlyRate !== null && input.hourlyRate !== '') set.hourlyRate = int(input.hourlyRate, { field: 'hourlyRate', min: 0, max: 10_000_000 });
    }
    await EMP().updateOne({ _id: emp._id }, { $set: set });
    await audit({ ...ctx, actor }, 'hr.profile', { name: emp.name });
    return profileView(await EMP().findOne({ _id: emp._id }), owner);
  }

  // ---------------------------------------------------------------- تحليل أيام الشهر: تأخير، غياب، ساعات إضافية
  function analyze(emp, month, att, leaves, pol, today, t) {
    const sched = emp.schedule ?? null;
    const startDay = emp.hiredAt ?? (emp.createdAt ? localDate(emp.createdAt, t) : `${month}-01`);
    const out = { minutes: 0, lateMin: 0, lateCount: 0, absentDays: 0, overtimeMin: 0, unpaidLeaveDays: 0, paidLeaveDays: 0, preHireDays: 0, late: [], absent: [] };
    for (let d = `${month}-01`; d <= lastDay(month); d = new Date(Date.parse(`${d}T00:00:00Z`) + 86400000).toISOString().slice(0, 10)) {
      if (emp.hiredAt && d < emp.hiredAt) { out.preHireDays += 1; continue; } // قبل التعيين: لا راتب ولا غياب
      const plan = sched?.[weekday(d)] ?? null;
      const mine = att.filter((a) => a.day === d).sort((x, y) => new Date(x.inAt) - new Date(y.inAt));
      const leave = leaves.find((l) => l.from <= d && l.to >= d);
      const closed = mine.length > 0 && mine.every((a) => a.outAt);
      const worked = mine.reduce((sum, a) => sum + (!a.outAt && minutesOf(a) > FORGOT_MIN ? 0 : minutesOf(a)), 0);
      out.minutes += worked;
      if (leave) { if (leave.paid) out.paidLeaveDays += 1; else out.unpaidLeaveDays += 1; }
      if (plan && mine.length) {
        const late = Math.floor((new Date(mine[0].inAt).getTime() - (Date.parse(`${d}T${plan.start}:00Z`) - t * 60000)) / 60000);
        if (late > pol.graceMin) {
          out.lateMin += late; out.lateCount += 1;
          out.late.push({ attendanceId: mine[0]._id, employeeId: emp._id, employeeName: emp.name, day: d, start: plan.start, inAt: mine[0].inAt, lateMin: late,
            fine: pol.lateFine ? Math.ceil(late / pol.lateStepMin) * pol.lateFine : 0 });
        }
      }
      if (sched && closed) out.overtimeMin += Math.max(0, worked - (plan ? planMinutes(plan) : 0));
      if (plan && !mine.length && !leave && d < today && d >= startDay) { out.absentDays += 1; out.absent.push(d); }
    }
    return out;
  }

  /** الراتب المستحق للشهر: شهري (ناقص الإجازة بلا راتب والغياب) أو بالساعة، + الإضافي والحوافز − الغرامات − السحب من الراتب */
  function computePay(emp, month, info, adjs, pol, advances, pays) {
    const payType = emp.payType ?? 'monthly';
    const salary = emp.salary ?? 0;
    const hourlyRate = emp.hourlyRate ?? 0;
    const bonus = adjs.filter((a) => a.type === 'bonus').reduce((x, a) => x + a.amount, 0);
    const fine = adjs.filter((a) => a.type === 'fine').reduce((x, a) => x + a.amount, 0);
    let base; let leaveDeduction = 0; let absenceDeduction = 0; let overtimePay = 0;
    if (payType === 'monthly') {
      // عُيّن خلال الشهر: الراتب بنسبة الأيام من تاريخ التعيين (أجر اليوم = الراتب ÷ 30)
      base = Math.max(0, salary - mulDiv(salary, info.preHireDays, pol.dayDivisor));
      leaveDeduction = Math.min(base, mulDiv(salary, info.unpaidLeaveDays, pol.dayDivisor));
      absenceDeduction = pol.deductAbsence ? Math.min(base - leaveDeduction, mulDiv(salary, info.absentDays, pol.dayDivisor)) : 0;
      overtimePay = mulDiv(pol.overtimeHourly, info.overtimeMin, 60);
    } else {
      base = mulDiv(hourlyRate, info.minutes, 60);
    }
    const gross = base + overtimePay + bonus - fine - leaveDeduction - absenceDeduction;
    let room = Math.max(0, gross);
    const advanceParts = [];
    for (const a of [...advances].sort((x, y) => new Date(x.createdAt) - new Date(y.createdAt))) {
      if (a.startMonth > month) continue;
      const done = pays.filter((p) => p.month !== month).flatMap((p) => p.advanceParts ?? []).filter((x) => x.advanceId === a._id).reduce((x, y) => x + y.amount, 0);
      const take = Math.min(a.perMonth, a.amount - done, room);
      if (take > 0) { advanceParts.push({ advanceId: a._id, amount: take }); room -= take; }
    }
    const advance = advanceParts.reduce((x, y) => x + y.amount, 0);
    return {
      payType, salary, hourlyRate, minutes: info.minutes, base, preHireDays: info.preHireDays, overtimeMin: info.overtimeMin, overtimePay, bonus, fine,
      unpaidLeaveDays: info.unpaidLeaveDays, leaveDeduction, absentDays: info.absentDays, absenceDeduction, gross, advance, advanceParts,
      net: Math.max(0, gross) - advance, shortfall: gross < 0 ? -gross : 0,
    };
  }

  /** أداء الموظف من المبيعات: عدد الطلبات وصافيها، والاسترجاع والإلغاء الذي نفّذه */
  async function performance(month, t, employeeId = null) {
    const from = new Date(Date.parse(`${month}-01T00:00:00Z`) - t * 60000);
    const to = new Date(Date.parse(`${lastDay(month)}T00:00:00Z`) + 86400000 - t * 60000);
    const map = new Map();
    for (const r of await db.collection('receipts').find({ createdAt: { $gte: from, $lt: to }, ...(employeeId ? { employeeId } : {}) }).toArray()) {
      const p = map.get(r.employeeId) ?? { sales: 0, salesTotal: 0, refunds: 0, cancels: 0 };
      if (r.type === 'sale') { p.sales += 1; p.salesTotal += r.totals?.net ?? 0; } else if (r.cancel) p.cancels += 1; else p.refunds += 1;
      map.set(r.employeeId, p);
    }
    return map;
  }

  // ---------------------------------------------------------------- الملخص الشهري والترتيب
  /** opts.perfFor: حساب أداء المبيعات لموظف واحد فقط (سجل الموظف) بدل قراءة إيصالات الشهر كلها */
  async function monthData(month, opts = {}) {
    if (!MONTH.test(String(month ?? ''))) throw new AppError(400, 'INVALID_RANGE');
    const t = await tz();
    const today = localDate(now(), t);
    const pol = await policy();
    const emps = await EMP().find({}).toArray();
    // استعلامات بمدى الشهر (فهرس by_day) لا قراءة كل السجل
    const att = await ATT().find({ day: { $gte: `${month}-01`, $lte: lastDay(month) } }).toArray();
    const adj = await ADJ().find({ day: { $gte: `${month}-01`, $lte: lastDay(month) } }).toArray();
    const lv = await LV().find({ status: 'approved', from: { $lte: lastDay(month) }, to: { $gte: `${month}-01` } }).toArray();
    const award = await AW().findOne({ month });
    const perf = await performance(month, t, opts.perfFor ?? null);
    const detail = new Map();
    const late = [];
    const rows = emps.filter((e) => e.active || att.some((a) => a.employeeId === e._id)).map((e) => {
      const mine = att.filter((a) => a.employeeId === e._id);
      const myAdj = adj.filter((a) => a.employeeId === e._id);
      const info = analyze(e, month, mine, lv.filter((l) => l.employeeId === e._id), pol, today, t);
      detail.set(e._id, { emp: e, info, adj: myAdj });
      late.push(...info.late.map((x) => ({ ...x, fined: myAdj.some((a) => a.source === 'late' && a.refId === x.attendanceId) })));
      return {
        id: e._id, name: e.name, role: e.role, active: e.active, minutes: info.minutes, days: new Set(mine.map((a) => a.day)).size,
        openNow: mine.some((a) => !a.outAt), forgot: mine.some((a) => !a.outAt && minutesOf(a) > FORGOT_MIN),
        bonus: myAdj.filter((a) => a.type === 'bonus').reduce((x, a) => x + a.amount, 0), fine: myAdj.filter((a) => a.type === 'fine').reduce((x, a) => x + a.amount, 0),
        paidLeaveDays: info.paidLeaveDays, unpaidLeaveDays: info.unpaidLeaveDays, lateMin: info.lateMin, lateCount: info.lateCount, absentDays: info.absentDays,
        overtimeMin: info.overtimeMin, hasSchedule: Boolean(e.schedule), perf: perf.get(e._id) ?? { sales: 0, salesTotal: 0, refunds: 0, cancels: 0 },
        salary: e.salary ?? 0, employeeOfMonth: award?.employeeId === e._id,
      };
    });
    rows.sort((a, b) => b.minutes - a.minutes || a.name.localeCompare(b.name, 'ar'));
    rows.forEach((r, i) => { r.rank = r.minutes ? i + 1 : null; });
    late.sort((a, b) => b.day.localeCompare(a.day));
    return { month, rows, late, policy: pol, detail, award: award ? { employeeId: award.employeeId, name: award.name, note: award.note, bonus: award.bonus ?? 0 } : null };
  }


  async function overview(actor, { month } = {}) {
    requirePerm(actor, 'hr.manage');
    const { detail, ...m } = await monthData(month);
    const showPay = can(actor.role, 'admin.employees'); // الرواتب للمالك فقط
    if (showPay) {
      // الصافي التقديري = نفس حساب كشف الرواتب (بالساعة، الغياب، الإجازة بلا راتب، قسط السلفة)
      const pays = await PAY().find({}).toArray();
      const advs = await ADV().find({}).toArray();
      for (const r of m.rows) {
        const paid = pays.find((p) => p.month === m.month && p.employeeId === r.id);
        const d = detail.get(r.id);
        r.net = paid ? paid.net : computePay(d.emp, m.month, d.info, d.adj, m.policy, advs.filter((a) => a.employeeId === r.id), pays.filter((p) => p.employeeId === r.id)).net;
      }
    } else for (const r of m.rows) delete r.salary;
    const t = await tz();
    const today = localDate(now(), t);
    const present = (await ATT().find({ open: true }).toArray()).map(viewAtt);
    const pending = (await LV().find({ status: 'pending' }).toArray()).map(viewLeave).sort((a, b) => a.from.localeCompare(b.from));
    const onLeaveToday = (await LV().find({ status: 'approved', from: { $lte: today }, to: { $gte: today } }).toArray()).map(viewLeave);
    const team = (await EMP().find({ active: true }).toArray()).map((e) => profileView(e, showPay)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    return { ...m, present, pending, onLeaveToday, showPay, team };
  }

  /** سجل الموظف: لنفسه، أو لمسؤول الموارد البشرية لأي موظف */
  async function record(actor, employeeId, { month } = {}) {
    if (!actor) throw new AppError(401, 'NOT_AUTHENTICATED');
    const id = employeeId === 'me' ? actor.id : checkId(employeeId);
    if (id !== actor.id) requirePerm(actor, 'hr.manage');
    const emp = await EMP().findOne({ _id: id });
    if (!emp) throw notFound();
    const t = await tz();
    const m = month && MONTH.test(month) ? month : localDate(now(), t).slice(0, 7);
    const att = (await ATT().find({ employeeId: id, day: { $gte: `${m}-01`, $lte: lastDay(m) } }).toArray()).sort((a, b) => new Date(b.inAt) - new Date(a.inAt)).map(viewAtt);
    const adj = (await ADJ().find({ employeeId: id, day: { $gte: `${m}-01`, $lte: lastDay(m) } }).toArray()).sort((a, b) => b.day.localeCompare(a.day)).map(viewAdj);
    const leaves = (await LV().find({ employeeId: id }).toArray()).sort((a, b) => b.from.localeCompare(a.from)).slice(0, 30).map(viewLeave);
    const awards = (await AW().find({ employeeId: id }).toArray()).sort((a, b) => b.month.localeCompare(a.month)).map((a) => a.month);
    const open = await ATT().findOne({ employeeId: id, open: true });
    const md = await monthData(m, { perfFor: id });
    const summary = md.rows.find((r) => r.id === id) ?? { minutes: 0, days: 0, bonus: 0, fine: 0, paidLeaveDays: 0, rank: null, lateMin: 0, lateCount: 0, absentDays: 0, overtimeMin: 0 };
    const showPay = id === actor.id || can(actor.role, 'admin.employees');
    if (!showPay) delete summary.salary; else summary.net = (summary.salary ?? 0) + summary.bonus - summary.fine;
    const d = md.detail.get(id);
    let payroll = null;
    let advances = [];
    if (showPay) {
      const pays = await PAY().find({ employeeId: id }).toArray();
      const advs = await ADV().find({ employeeId: id }).toArray();
      const paid = pays.find((p) => p.month === m);
      payroll = paid ? viewPay(paid) : d ? { ...computePay(emp, m, d.info, d.adj, md.policy, advs, pays), paid: false, month: m, employeeId: id, name: emp.name } : null;
      advances = advs.map((a) => viewAdv(a, pays)).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
      if (payroll) summary.net = payroll.net;
    }
    const self = id === actor.id;
    return {
      employee: { id: emp._id, name: emp.name, role: emp.role, phone: emp.phone ?? null, active: emp.active, annualLeave: emp.annualLeave ?? 14 },
      profile: profileView(emp, can(actor.role, 'admin.employees')),
      month: m, summary, attendance: att, adjustments: adj, leaves, awards, clockedIn: open ? viewAtt(open) : null,
      late: d?.info.late ?? [], absent: d?.info.absent ?? [], payroll, advances,
      leaveBalance: await leaveBalance(emp, m.slice(0, 4)),
      ...(self && can(actor.role, 'hr.manage') ? { pendingLeaves: await LV().countDocuments({ status: 'pending' }) } : {}),
    };
  }

  /** تسجيل غرامات التأخير المقترحة (مرة واحدة لكل حضور متأخر، ويمكن حذفها بعد ذلك كأي غرامة) */
  async function lateFines(actor, input = {}) {
    requirePerm(actor, 'hr.manage');

      ticketName: str(input.ticketName, { field: 'ticketName', max: 40, optional: true }),
      lines,
      discounts: t.totals.appliedDiscounts.map((d) => ({ name: d.name, type: d.type, value: d.value, amount: d.amount })),
      pointsRedeemed: t.pointsRedeemed, pointsEarned: earned,
      totals: {
        gross: t.totals.gross, discountTotal: t.totals.discountTotal, net: t.totals.net, tax: t.totals.tax,
        taxMode: t.totals.taxMode, total: t.totals.total, cost: lines.reduce((a, l) => a + l.cost, 0),
      },
      payments, refundTotal: 0,
      prep: { status: settings.features?.kds ? 'new' : 'served', updatedAt: now() },
      effectsPending: true,
    };

    try {
      await C('receipts').insertOne(receipt);
    } catch (e) {
      if (isDup(e) && (await C('receipts').findOne({ clientId }))) return { receipt: out(await C('receipts').findOne({ clientId })), duplicate: true };
      throw e;
    }
    await applySaleEffects(receipt, input.ticketId);
    // الوردية أُغلقت قبل وصول هذا البيع (بلا إنترنت، أو في نفس لحظة الإغلاق): يُحدَّث ملخصها وفرقها
    await ctx.shifts.refreshClosed(shift._id);
    for (const d of t.usedDiscounts.filter((x) => x.restricted)) await audit({ ...ctx, actor }, 'discount.restricted', { receipt: receipt.number, discount: d.name });
    return { receipt: out(await C('receipts').findOne({ _id: receipt._id })), duplicate: false };
  }

  async function redeemPoints(customerId, points, clientId) {
    try {
      await C('point_moves').insertOne({ _id: newId(), key: `redeem:${clientId}`, customerId, delta: -points, at: now() });
    } catch (e) {
      if (isDup(e)) return; // خُصمت في محاولة سابقة
      throw e;
    }
    const r = await C('customers').updateOne({ _id: customerId, points: { $gte: points } }, { $inc: { points: -points } });
    if (!r.matchedCount) {
      await C('point_moves').deleteOne({ key: `redeem:${clientId}` });
      throw conflict('INSUFFICIENT_POINTS');
    }
  }

  async function checkStock(lines) {
    const need = new Map(); // variantId → { qty, item }
    for (const l of lines) {
      const v = l.variant;
      const parts = v.recipe?.length ? v.recipe.map((r) => ({ variantId: r.variantId, qty: r.qty * l.qty })) : v.trackStock ? [{ variantId: v._id, qty: l.qty }] : [];
      for (const p of parts) {
        const n = need.get(p.variantId) ?? { qty: 0, item: l.itemName };
        n.qty += p.qty;
        need.set(p.variantId, n);
      }
    }
    if (!need.size) return;
    const stock = new Map((await C('variants').find({ _id: { $in: [...need.keys()] } }).toArray()).map((v) => [v._id, v.stock]));
    for (const [variantId, n] of need) {
      if ((stock.get(variantId) ?? 0) < n.qty) throw conflict('OUT_OF_STOCK', n.item);
    }
  }

  async function applySaleEffects(receipt, ticketId = null) {
    const variantIds = [...new Set(receipt.lines.map((l) => l.variantId))];
    const variants = new Map((await C('variants').find({ _id: { $in: variantIds } }).toArray()).map((v) => [v._id, v]));
    for (const [i, line] of receipt.lines.entries()) {
      const v = variants.get(line.variantId);
      if (!v) continue;
      const parts = v.recipe?.length ? v.recipe.map((r) => ({ variantId: r.variantId, qty: r.qty * line.qty })) : v.trackStock ? [{ variantId: v._id, qty: line.qty }] : [];
      for (const p of parts) {
        await ctx.inventory.applyMove({ key: `sale:${receipt._id}:${i}:${p.variantId}`, variantId: p.variantId, delta: -p.qty, reason: 'sale', refId: receipt._id, by: { id: receipt.employeeId, name: receipt.employeeName } });
      }
    }
    if (receipt.customerId) {
      let fresh = true;
      try {
        await C('point_moves').insertOne({ _id: newId(), key: `sale:${receipt._id}`, customerId: receipt.customerId, delta: receipt.pointsEarned, at: now() });
      } catch (e) {
        if (!isDup(e)) throw e;
        fresh = false;
      }
      if (fresh) {
        await C('customers').updateOne({ _id: receipt.customerId }, {
          $inc: { points: receipt.pointsEarned, visits: 1, totalSpent: receipt.totals.total }, $set: { lastVisitAt: receipt.createdAt },
        });
      }
    }
    if (ticketId) await C('tickets').deleteOne({ _id: ticketId });
    await C('receipts').updateOne({ _id: receipt._id }, { $set: { effectsPending: false } });
  }

  /** يُستدعى عند تشغيل الخادم: يستكمل آثار أي إيصال انقطع تطبيقه */
  async function recoverPending() {
    const pending = await C('receipts').find({ effectsPending: true }).toArray();
    for (const r of pending) {
      if (r.type === 'sale') await applySaleEffects(r);
      else await applyRefundEffects(r);
    }
    return pending.length;
  }

  // ---------------------------------------------------------------- الاسترجاع
  /**
   * طرق إرجاع المبلغ. بلا اختيار صريح: يُرجع المبلغ بنفس طرق الدفع الأصلية، النقد أولاً حتى ما دُفع نقداً
   * (ناقص ما أُرجع نقداً سابقاً) ثم البقية، فلا يُرجَع بطريقة أكثر مما دُفع بها ويبقى النقد المتوقع في الدرج صحيحاً.
   * باختيار صريح (مثلاً إرجاع بيع بالبطاقة نقداً): يُرجع كله بالطريقة المختارة.
   */
  function splitRefund({ sale, previous, total, explicit, settings, drawer }) {
    const active = new Map(settings.paymentTypes.filter((p) => p.active).map((p) => [p.id, p]));
    const line = (type, amount) => ({ typeId: type.id, typeName: type.name, kind: type.kind, amount, tendered: amount, change: 0 });
    if (total === 0) return [];
    if (explicit) {
      const type = active.get(explicit);
      if (!type) throw bad('UNKNOWN_PAYMENT_TYPE');
      if (type.kind === 'cash' && total > drawer) throw bad('DRAWER_INSUFFICIENT', String(drawer));
      return [line(type, total)];
    }
    const paid = new Map();
    for (const p of sale.payments) paid.set(p.typeId, (paid.get(p.typeId) ?? 0) + p.amount);
    for (const r of previous) for (const p of r.payments) if (paid.has(p.typeId)) paid.set(p.typeId, paid.get(p.typeId) - p.amount);
    const order = [...paid.keys()].sort((a, b) => Number((sale.payments.find((p) => p.typeId === b)?.kind) === 'cash') - Number((sale.payments.find((p) => p.typeId === a)?.kind) === 'cash'));
    const out = [];
    let left = total;
    let cashLeft = Math.max(0, drawer);
    for (const id of order) {
      const orig0 = sale.payments.find((p) => p.typeId === id);
      // النقد محدود بما في الدرج الآن؛ ما لا يتوفر نقداً يُرجع بالطريقة الأخرى التي دُفع بها
      const cap = orig0.kind === 'cash' ? cashLeft : Infinity;
      const take = Math.min(left, Math.max(0, paid.get(id)), cap);
      if (orig0.kind === 'cash') cashLeft -= Math.max(0, take);
      if (take <= 0) continue;
      const orig = sale.payments.find((p) => p.typeId === id);
      out.push(line(active.get(id) ?? { id, name: orig.typeName, kind: orig.kind }, take));
      left -= take;
    }
    if (left > 0) {
      // نقص النقد في الدرج عن حصة النقد الأصلية: لا يُحوَّل للبطاقة بأكثر مما دُفع بها، بل يُرفض بوضوح
      const uncovered = total - [...paid.values()].reduce((a, v) => a + Math.max(0, v), 0);
      if (left > Math.max(0, uncovered)) throw bad('DRAWER_INSUFFICIENT', String(drawer));
      // ما تبقى لأن جزءاً سبق إرجاعه بطريقة أخرى صراحةً: بأول طريقة غير نقدية دُفع بها، أو نقداً إن كفى الدرج
      const first = sale.payments.find((p) => p.kind !== 'cash') ?? (cashLeft >= left ? sale.payments[0] : null);
      if (!first) throw bad('DRAWER_INSUFFICIENT', String(drawer));
      const type = active.get(first.typeId) ?? { id: first.typeId, name: first.typeName, kind: first.kind };
      const same = out.find((p) => p.typeId === type.id);
      if (same) { same.amount += left; same.tendered += left; } else out.push(line(type, left));
    }
    return out;
  }

  async function refund(actor, saleId, input = {}) {
    // الإلغاء (من التحضير أو الإيصالات): متاح للكاشير لطلبات ورديته الحالية فقط؛ الاسترجاع العام للمدير والمالك
    const cancel = input.cancel === true;
    if (!cancel) requirePerm(actor, 'pos.refund');
    else if (!can(actor.role, 'pos.refund')) requirePerm(actor, 'pos.cancel');
    const clientId = checkId(input.clientId, 'clientId');
    const prior = await C('receipts').findOne({ clientId });
    if (prior) {
      if (prior.type !== 'refund' || prior.refundOf !== saleId) throw conflict('IDEMPOTENCY_KEY_REUSED');
      return { receipt: out(prior), duplicate: true };
    }
    const sale = await C('receipts').findOne({ _id: checkId(saleId), type: 'sale' });
    if (!sale) throw notFound('RECEIPT_NOT_FOUND');
    const shift = await ctx.shifts.requireOpen();
    if (cancel && !can(actor.role, 'pos.refund') && sale.shiftId !== shift._id) throw new AppError(403, 'FORBIDDEN', 'cancel.other_shift');
    const settings = await getSettings(db);
    const reason = str(input.reason, { field: 'reason', min: 2, max: 120 });
    const restockIngredients = input.restockIngredients === true && sale.prep?.status === 'new';
    const lineVariants = new Map((await C('variants').find({ _id: { $in: [...new Set(sale.lines.map((l) => l.variantId))] } }).toArray()).map((v) => [v._id, v]));

    if (!Array.isArray(input.lines) || input.lines.length === 0) throw bad('EMPTY_REFUND');
    const req = new Map();
    for (const l of input.lines) {
      const index = int(l.index, { field: 'index', max: sale.lines.length - 1 });
      const qty = int(l.qty, { field: 'qty', min: 1, max: 999 });
      req.set(index, (req.get(index) ?? 0) + qty);
    }

    // حجز الكميات ذرياً: يفشل إن تجاوزت أي كمية المتبقي (حتى مع استرجاعين متزامنين)
    const filter = { _id: sale._id };
    const inc = {};
    for (const [index, qty] of req) {
      if (qty > sale.lines[index].qty) throw bad('REFUND_QTY_EXCEEDS', String(index + 1));
      filter[`lines.${index}.refundedQty`] = { $lte: sale.lines[index].qty - qty };
      inc[`lines.${index}.refundedQty`] = qty;
    }
    const reserved = await C('receipts').updateOne(filter, { $inc: inc });
    if (!reserved.matchedCount) throw conflict('REFUND_QTY_EXCEEDS');

    try {
      const previous = await C('receipts').find({ refundOf: sale._id, type: 'refund' }).toArray();
      const already = (index, field) => previous.flatMap((r) => r.lines).filter((x) => x.index === index).reduce((a, x) => a + (x[field] ?? 0), 0);
      const alreadyQty = (index) => previous.flatMap((r) => r.lines).filter((x) => x.index === index).reduce((a, x) => a + x.qty, 0);

      const lines = [...req].map(([index, qty]) => {
        const s = sale.lines[index];
        const part = (field) => refundPortion({ amount: s[field], qty: s.qty, refundQty: qty, alreadyQty: alreadyQty(index), alreadyAmount: already(index, field) });
        const gross = part('gross');
        const net = part('net');
        const tax = part('tax');
        // ما لم تعد مكوناته أو الصنف نفسه للمخزون فهو هدر: تكلفته تبقى على الربح ولا تُطرح من تكلفة البضاعة
        const v = lineVariants.get(s.variantId);
        const returned = v?.recipe?.length ? restockIngredients : v?.trackStock ? input.restock === true : sale.prep?.status === 'new';
        // التكلفة المسترجعة سابقاً = ما عاد للمخزون + ما سُجّل هدراً؛ وإلا تجاوز آخر جزء تكلفة السطر
        const cost = refundPortion({ amount: s.cost, qty: s.qty, refundQty: qty, alreadyQty: alreadyQty(index), alreadyAmount: already(index, 'cost') + already(index, 'wasteCost') });
        return {
          index, itemId: s.itemId, itemName: s.itemName, variantId: s.variantId, variantName: s.variantName,
          categoryId: s.categoryId, categoryName: s.categoryName, qty, unitPrice: s.unitPrice, modifiers: s.modifiers,
          gross, discount: gross - net, net, tax, total: sale.totals.taxMode === 'added' ? net + tax : net,
          cost: returned ? cost : 0, wasteCost: returned ? 0 : cost,
        };
      });
      const total = lines.reduce((a, l) => a + l.total, 0);
      const refundPayments = splitRefund({ sale, previous, total, explicit: input.paymentTypeId, settings, drawer: await ctx.shifts.cashInDrawer(shift) });

      const netRefunded = lines.reduce((a, l) => a + l.net, 0);
      // النقاط المعكوسة تراكمياً: (المكتسب × صافي كل ما استُرجع حتى الآن ÷ صافي البيع) − ما عُكس سابقاً.
      // فلا يتراكم التقريب، والاسترجاع الكامل يعكس المكتسب بالضبط لا أكثر.
      const netBefore = previous.reduce((a, r) => a + r.totals.net, 0);
      const reversedBefore = previous.reduce((a, r) => a + (r.pointsReversed ?? 0), 0);
      const pointsTarget = sale.pointsEarned && sale.totals.net
        ? Number((BigInt(sale.pointsEarned) * BigInt(netBefore + netRefunded) * 2n + BigInt(sale.totals.net)) / (2n * BigInt(sale.totals.net))) : 0;
      const pointsReversed = Math.max(0, Math.min(sale.pointsEarned ?? 0, pointsTarget) - reversedBefore);

      const doc = {
        _id: newId(), number: RECEIPT_BASE + (await nextSeq(db, 'receipt')), clientId, type: 'refund', refundOf: sale._id,
        refundOfNumber: sale.number, createdAt: now(), shiftId: shift._id, employeeId: actor.id, employeeName: actor.name,
        diningOption: sale.diningOption, customerId: sale.customerId, customerName: sale.customerName, reason,
        restock: input.restock === true,
        // إلغاء قبل بدء التحضير: مكونات الوصفة لم تُستعمل فتعود للمخزون
        restockIngredients, cancel, source: input.source === 'kds' ? 'kds' : null, lines,
        totals: {
          gross: lines.reduce((a, l) => a + l.gross, 0), discountTotal: lines.reduce((a, l) => a + l.discount, 0), net: netRefunded,
          tax: lines.reduce((a, l) => a + l.tax, 0), taxMode: sale.totals.taxMode, total, cost: lines.reduce((a, l) => a + l.cost, 0),
        },
        wasteCost: lines.reduce((a, l) => a + l.wasteCost, 0),
        payments: refundPayments,
        pointsReversed, explicitPayment: !!input.paymentTypeId, effectsPending: true, prep: { status: 'served' },
      };
      await C('receipts').insertOne(doc);
      await ctx.shifts.refreshClosed(shift._id);
      const updated = await C('receipts').findOne({ _id: sale._id });
      const fully = updated.lines.every((l) => l.refundedQty >= l.qty);
      const cancelPrep = fully && ['new', 'preparing', 'ready'].includes(updated.prep?.status) ? { 'prep.status': 'cancelled', 'prep.updatedAt': now(), 'prep.cancelledAt': now() } : {};
      const cancelled = cancel ? { cancelled: { at: now(), byName: actor.name, reason, number: doc.number, full: fully } } : {};
      await C('receipts').updateOne({ _id: sale._id }, { $set: { status: fully ? 'refunded' : 'partially_refunded', ...cancelPrep, ...cancelled }, $inc: { refundTotal: total } });
      await applyRefundEffects(doc);
      await audit({ ...ctx, actor }, cancel ? 'receipt.cancel' : 'receipt.refund', { sale: sale.number, refund: doc.number, total, reason, ...(doc.wasteCost ? { wasteCost: doc.wasteCost } : {}), ...(doc.source ? { source: doc.source } : {}) });
      return { receipt: out(await C('receipts').findOne({ _id: doc._id })), duplicate: false };
    } catch (e) {
      // فك الحجز إن لم يُنشأ إيصال الاسترجاع
      const created = await C('receipts').findOne({ clientId });
      if (!created) {
        const undo = {};
        for (const [k, v] of Object.entries(inc)) undo[k] = -v;
        await C('receipts').updateOne({ _id: sale._id }, { $inc: undo });
      }
      if (isDup(e) && created) return { receipt: out(created), duplicate: true };
      throw e;
    }
  }

  async function applyRefundEffects(doc) {
    if (doc.restock || doc.restockIngredients) {
      const variants = new Map((await C('variants').find({ _id: { $in: doc.lines.map((l) => l.variantId) } }).toArray()).map((v) => [v._id, v]));
      const by = { id: doc.employeeId, name: doc.employeeName };
      for (const [i, l] of doc.lines.entries()) {
        const v = variants.get(l.variantId);
        // الصنف الجاهز يعود عند طلب ذلك؛ مكونات المشروب تعود فقط إن أُلغي قبل تحضيره
        if (doc.restock && v?.trackStock && !v.recipe?.length) {
          await ctx.inventory.applyMove({ key: `refund:${doc._id}:${i}`, variantId: v._id, delta: l.qty, reason: 'refund', refId: doc._id, by });
        }
        if (doc.restockIngredients && v?.recipe?.length) {
          for (const r of v.recipe) {
            await ctx.inventory.applyMove({ key: `refund:${doc._id}:${i}:${r.variantId}`, variantId: r.variantId, delta: r.qty * l.qty, reason: 'refund', refId: doc._id, by });
          }
        }
      }
    }
    if (doc.customerId) {
      const c = await C('customers').findOne({ _id: doc.customerId });
      // إن صرف العميل نقاطه قبل الاسترجاع: يُعكس المتاح فقط، ويُسجَّل في الدفتر ما عُكس فعلاً ليبقى الرصيد = مجموع الدفتر
      const taken = c ? Math.min(doc.pointsReversed, Math.max(0, c.points)) : 0;
      let fresh = true;
      try {
        await C('point_moves').insertOne({ _id: newId(), key: `refund:${doc._id}`, customerId: doc.customerId, delta: -taken, at: now() });
      } catch (e) {
        if (!isDup(e)) throw e;
        fresh = false;
      }
      if (fresh && c) await C('customers').updateOne({ _id: c._id }, { $inc: { points: -taken, totalSpent: -doc.totals.total } });
    }
    await C('receipts').updateOne({ _id: doc._id }, { $set: { effectsPending: false } });
  }

  // ---------------------------------------------------------------- الإيصالات
  async function getReceipt(actor, receiptId) {
    requirePerm(actor, 'receipts.view');
    const r = await C('receipts').findOne({ _id: checkId(receiptId) });
    if (!r) throw notFound('RECEIPT_NOT_FOUND');
    const refunds = r.type === 'sale' ? await C('receipts').find({ refundOf: r._id }).sort({ createdAt: 1 }).toArray() : [];
    return { ...out(r, ['clientId', 'effectsPending']), refunds: refunds.map((x) => out(x, ['clientId', 'effectsPending'])) };
  }

  async function listReceipts(actor, { search = '', from = null, to = null, limit = 60, before = null } = {}) {
    requirePerm(actor, 'receipts.view');
    const q = {};
    if (from && to) q.createdAt = { $gte: from, $lt: to };
    if (before) q.createdAt = { ...(q.createdAt ?? {}), $lt: before };
    const s = String(search).trim().replace(/^#/, '');
    if (s) {
      if (/^\d+$/.test(s)) q.number = Number(s);
      else q.customerName = { $regex: escapeRegex(s.slice(0, 40)), $options: 'i' };
    }
    const rows = await C('receipts').find(q).sort({ createdAt: -1 }).limit(Math.min(limit, 200)).toArray();
    return rows.map((r) => ({
      id: r._id, number: r.number, type: r.type, status: r.status, createdAt: r.createdAt, total: r.totals.total,
      employeeName: r.employeeName, customerName: r.customerName, diningOption: r.diningOption,
      payments: r.payments.map((p) => p.typeName), refundOfNumber: r.refundOfNumber ?? null,
      cancel: r.type === 'refund' ? !!r.cancel : !!r.cancelled, reason: r.type === 'refund' ? r.reason ?? null : r.cancelled?.reason ?? null,
      itemsCount: r.lines.reduce((a, l) => a + l.qty, 0),
    }));
  }

  // ---------------------------------------------------------------- شاشة التحضير (KDS)
  async function kdsList(actor) {
    requirePerm(actor, 'kds.use');
    const since = new Date(now().getTime() - 12 * 3600_000);
    const rows = await C('receipts').find({ type: 'sale', 'prep.status': { $in: ['new', 'preparing', 'ready'] }, createdAt: { $gte: since } }).sort({ createdAt: 1 }).limit(80).toArray();
    // آخر الطلبات المسلّمة في الوردية الحالية: لإلغاء طلب لم يستلمه الزبون
    const shift = await C('shifts').findOne({ status: 'open' });
    const served = shift ? await C('receipts').find({ type: 'sale', shiftId: shift._id, 'prep.status': 'served', status: { $ne: 'refunded' } }).sort({ createdAt: -1 }).limit(8).toArray() : [];
    return [...rows, ...served].map((r) => ({
      id: r._id, number: r.number, createdAt: r.createdAt, prep: r.prep, diningOption: r.diningOption, customerName: r.customerName,
      ticketName: r.ticketName, employeeName: r.employeeName, status: r.status, paymentTypeId: r.payments[0]?.typeId ?? null,
      lines: r.lines.map((l) => ({ name: l.itemName, variant: l.variantName, qty: l.qty, refundedQty: l.refundedQty, total: l.total, modifiers: l.modifiers.map((m) => m.name), note: l.note })),
    }));
  }

  async function kdsAdvance(actor, receiptId, { from } = {}) {
    requirePerm(actor, 'kds.use');
    const next = PREP_FLOW[from];
    if (!next) throw bad('INVALID_CHOICE', 'from');
    // الانتقال مشروط بالحالة الحالية: نقرتان متزامنتان لا تقفزان مرحلتين
    const r = await C('receipts').updateOne({ _id: checkId(receiptId), 'prep.status': from }, { $set: { 'prep.status': next, 'prep.updatedAt': now(), [`prep.${next}At`]: now() } });
    return { advanced: r.matchedCount === 1, status: next };
  }

  // ---------------------------------------------------------------- التذاكر المفتوحة
  function cleanTicketLines(lines) {
    if (!Array.isArray(lines) || lines.length > 100) throw bad('INVALID_LIST', 'lines');
    return lines.map((l) => ({
      variantId: checkId(l.variantId, 'variantId'), qty: int(l.qty, { field: 'qty', min: 1, max: 999 }),

// ---- server/app/shifts.js
const __m_server_app_shifts_js = await (async () => {
const { buildReport } = __m_shared_reports_js;
const { AppError, audit, bad, conflict, getSettings, id: checkId, int, isDup, nextSeq, out, requirePerm, str } = __m_server_app_core_js;
// الورديات وإدارة النقد (على نهج Loyverse: رصيد افتتاحي، إدخال/سحب نقد، إغلاق بالنقد الفعلي).
// النقد المتوقع = الافتتاحي + المبيعات النقدية − المرتجعات النقدية + الإدخال − السحب
// يُحسب دائماً من الإيصالات وحركات الوردية، ولا يُخزَّن رصيد قابل للانحراف.



function createShifts(ctx) {
  const { db, now, newId } = ctx;
  const shifts = () => db.collection('shifts');

  async function summarize(shift) {
    const settings = await getSettings(db);
    const receipts = await db.collection('receipts').find({ shiftId: shift._id }).toArray();
    const report = buildReport(receipts, { tzOffsetMin: settings.tzOffsetMin });
    const cashTypes = new Set(settings.paymentTypes.filter((p) => p.kind === 'cash').map((p) => p.id));
    let cashSales = 0;
    let cashRefunds = 0;
    for (const r of receipts) {
      for (const p of r.payments) {
        if (!cashTypes.has(p.typeId) && p.kind !== 'cash') continue;
        if (r.type === 'refund') cashRefunds += p.amount; else cashSales += p.amount;
      }
    }
    const payIn = shift.movements.filter((m) => m.type === 'pay_in').reduce((a, m) => a + m.amount, 0);
    const payOut = shift.movements.filter((m) => m.type === 'pay_out').reduce((a, m) => a + m.amount, 0);
    return {
      startingCash: shift.startingCash, cashSales, cashRefunds, payIn, payOut,
      expectedCash: shift.startingCash + cashSales - cashRefunds + payIn - payOut,
      gross: report.summary.gross, refunds: report.summary.refunds, discounts: report.summary.discounts,
      net: report.summary.net, tax: report.summary.tax, salesCount: report.summary.salesCount,
      refundsCount: report.summary.refundsCount, byPayment: report.byPayment,
    };
  }

  const view = async (shift) => (shift ? { ...out(shift), live: shift.status === 'open' ? await summarize(shift) : null } : null);

  async function current(actor) {
    if (!actor) throw new AppError(401, 'NOT_AUTHENTICATED');
    return view(await shifts().findOne({ status: 'open' }));
  }

  async function requireOpen() {
    const s = await shifts().findOne({ status: 'open' });
    if (!s) throw conflict('NO_OPEN_SHIFT');
    return s;
  }

  async function open(actor, input = {}) {
    requirePerm(actor, 'shift.manage');
    const startingCash = int(input.startingCash ?? 0, { field: 'startingCash', max: 1_000_000_000 });
    const doc = {
      _id: newId(), number: await nextSeq(db, 'shift'), status: 'open', openedAt: now(), openedBy: actor.id, openedByName: actor.name,
      startingCash, movements: [],
    };
    try {
      await shifts().insertOne(doc);
    } catch (e) {
      if (isDup(e)) throw conflict('SHIFT_ALREADY_OPEN');
      throw e;
    }
    await audit({ ...ctx, actor }, 'shift.open', { shiftId: doc._id, startingCash });
    return view(doc);
  }

  async function move(actor, input = {}) {
    requirePerm(actor, 'shift.cash');
    const type = input.type === 'pay_in' || input.type === 'pay_out' ? input.type : null;
    if (!type) throw bad('INVALID_CHOICE', 'type');
    const clientId = checkId(input.clientId, 'clientId');
    const amount = int(input.amount, { field: 'amount', min: 1, max: 1_000_000_000 });
    const note = str(input.note, { field: 'note', min: 1, max: 120 });
    const shift = await requireOpen();
    if (shift.movements.some((m) => m.id === clientId)) return view(shift); // إعادة إرسال: لا شيء جديد
    // لا يُسحب من الدرج أكثر مما فيه: النقد المتوقع لا يصبح سالباً أبداً
    if (type === 'pay_out') {
      const { expectedCash } = await summarize(shift);
      if (amount > expectedCash) throw bad('DRAWER_INSUFFICIENT', String(expectedCash));
    }
    const movement = { id: clientId, type, amount, note, at: now(), by: actor.id, byName: actor.name };
    // شرط "لا توجد حركة بنفس المعرف" يجعل إعادة الإرسال آمنة
    const r = await shifts().updateOne({ _id: shift._id, status: 'open', 'movements.id': { $ne: clientId } }, { $push: { movements: movement } });
    if (r.matchedCount) await audit({ ...ctx, actor }, `shift.${type}`, { shiftId: shift._id, amount, note });
    return view(await shifts().findOne({ _id: shift._id }));
  }

  async function close(actor, input = {}) {
    requirePerm(actor, 'shift.manage');
    const shift = await requireOpen();
    const actualCash = int(input.actualCash, { field: 'actualCash', max: 1_000_000_000 });
    const note = str(input.note, { field: 'note', max: 200, optional: true });
    const settings = await getSettings(db);
    const summary = await summarize(shift);
    const difference = actualCash - summary.expectedCash;
    if (Math.abs(difference) > (settings.cashVarianceAlert ?? 0) && !note) throw bad('VARIANCE_NOTE_REQUIRED', String(difference));
    const openTickets = await db.collection('tickets').countDocuments({});
    const r = await shifts().updateOne({ _id: shift._id, status: 'open' }, {
      $set: { status: 'closed', closedAt: now(), closedBy: actor.id, closedByName: actor.name, actualCash, difference, note, summary, openTicketsAtClose: openTickets },
    });
    if (!r.matchedCount) throw conflict('SHIFT_ALREADY_CLOSED');
    await audit({ ...ctx, actor }, 'shift.close', { shiftId: shift._id, expected: summary.expectedCash, actualCash, difference });
    return view(await shifts().findOne({ _id: shift._id }));
  }

  async function list(actor, { from, to } = {}) {
    requirePerm(actor, 'admin.reports');
    const q = from && to ? { openedAt: { $gte: from, $lt: to } } : {};
    return (await shifts().find(q).sort({ openedAt: -1 }).limit(200).toArray()).map((s) => out(s));
  }

  /**
   * إعادة حساب ملخص وردية أُغلقت ثم وصلها إيصال يخصها (بيع بلا إنترنت أُرسل بعد الإغلاق، أو بيع تزامن مع لحظة الإغلاق).
   * النقد الفعلي المعدود لا يتغير؛ يتغير المتوقع والفرق ليعكسا الحقيقة، ويُسجَّل ذلك في سجل العمليات.
   */
  async function refreshClosed(shiftId) {
    const s = await shifts().findOne({ _id: shiftId });
    if (!s || s.status !== 'closed') return null;
    const summary = await summarize(s);
    if (summary.expectedCash === s.summary?.expectedCash && summary.net === s.summary?.net && summary.salesCount === s.summary?.salesCount) return s;
    const difference = s.actualCash - summary.expectedCash;
    await shifts().updateOne({ _id: s._id }, { $set: { summary, difference, revisedAt: now() } });
    await audit({ ...ctx, actor: null }, 'shift.revised', { shiftId: s._id, number: s.number, expected: summary.expectedCash, before: s.summary?.expectedCash, difference });
    return shifts().findOne({ _id: s._id });
  }

  /** الوردية التي كانت مفتوحة في لحظة معينة (لبيع سُجّل بلا إنترنت) */
  async function shiftAt(at) {
    const list = await shifts().find({ openedAt: { $lte: at } }).sort({ openedAt: -1 }).limit(1).toArray();
    const s = list[0];
    if (!s) return null;
    return s.status === 'open' || (s.closedAt && s.closedAt >= at) ? s : null;

  async function cashInDrawer(shift) {
    return (await summarize(shift ?? await requireOpen())).expectedCash;
  }

  return { current, open, move, close, list, requireOpen, cashInDrawer, refreshClosed, shiftAt };
}

return { createShifts };
})();

  const strip = ({ _id, tenantId, ...rest }) => rest;
  for (const name of ['categories', 'modifiers', 'discounts']) {
    for (const d of await from.collection(name).find({ active: { $ne: false } }).toArray()) {
      await to.collection(name).insertOne({ ...strip(d), _id: map(d._id) });
    }
  }
  const items = await from.collection('items').find({ active: { $ne: false } }).toArray();
  const variants = await from.collection('variants').find({ active: { $ne: false } }).toArray();

      ...strip(it), _id: map(it._id), categoryId: it.categoryId ? (ids.get(it.categoryId) ?? null) : null,
      modifierIds: (it.modifierIds ?? []).filter((m) => ids.has(m)).map((m) => ids.get(m)),
    });
  }
  for (const it of items.filter((i) => i.imageV)) {
    const img = await from.collection('item_images').findOne({ _id: it._id });
    if (img) await to.collection('item_images').insertOne({ ...strip(img), _id: ids.get(it._id) });
  }
  const itemIds = new Set(items.map((i) => i._id));
  for (const v of variants.filter((x) => itemIds.has(x.itemId))) map(v._id);
  for (const v of variants.filter((x) => itemIds.has(x.itemId))) {
    await to.collection('variants').insertOne({
      ...strip(v), _id: ids.get(v._id), itemId: ids.get(v.itemId), stock: 0,
      recipe: (v.recipe ?? []).filter((r) => ids.has(r.variantId)).map((r) => ({ variantId: ids.get(r.variantId), qty: r.qty })),
    });
  }
  const src = await getSettings(from);
  const patch = Object.fromEntries(COPY_SETTINGS.filter((k) => k in src).map((k) => [k, src[k]]));
  await to.collection('settings').updateOne({ _id: 'store' }, { $set: patch });
}

  if (s.online === false) parts.push('<b>بدون إنترنت</b> — البيع يعمل والمبيعات تُحفظ على الجهاز');
  if (pending) parts.push(s.online === false ? `${pending} بانتظار الإرسال` : `جارٍ إرسال ${pending} ${pending === 1 ? 'عملية محفوظة' : 'عمليات محفوظة'}…`);
  return `<div class="net-banner ${s.online === false ? 'off' : ''}" role="status">${icon(s.online === false ? 'alert' : 'clock', 'sm')}
    <span class="low-text">${parts.join(' · ') || ''}${failed ? `${parts.length ? ' · ' : ''}<b>${failed} لم تُقبل</b>` : ''}</span>
    ${failed ? '<button class="btn sm" data-action="offline-review">مراجعة</button>' : ''}</div>`;
}

const lowKey = (list) => list.map((x) => `${x.variantId}:${x.out ? 0 : 1}`).join(',');

function lowBanner(s) {
  const low = s.catalog.lowStock ?? [];
  if (!low.length || s.pos.lowDismissed === lowKey(low)) return '';
  const outN = low.filter((x) => x.out).length;
  const shown = low.slice(0, 4).map((x) => `<span class="${x.out ? 'low-out' : ''}">${esc(x.name)} <b class="num">${x.stock.toLocaleString('en-US')} ${esc(x.unit)}</b></span>`).join('');
  return `<div class="low-banner ${outN ? 'has-out' : ''}" role="alert">${icon('alert', 'sm')}
    <div class="low-text"><b>${outN ? `نفد ${outN} ومنخفض ${low.length - outN}` : `مخزون منخفض: ${low.length} ${low.length === 1 ? 'مادة' : 'مواد'}`}</b>
      <span class="low-list">${shown}${low.length > 4 ? `<span>+${low.length - 4}</span>` : ''}</span></div>
    ${can('admin.inventory') ? '<a class="btn sm" href="#/admin/inventory">المخزون</a>' : ''}
    <button class="icon-btn" data-action="low-dismiss" aria-label="إخفاء التنبيه">${icon('x', 'sm')}</button></div>`;
}

function tile(item, catName) {
  const prices = item.variants.map((v) => v.price);
  const min = Math.min(...prices);
  const out = item.variants.every((v) => v.available !== null && v.available <= 0);
  const low = !out && item.variants.some((v) => v.available !== null && v.available > 0 && v.available <= 3);
  const img = imageSrc(item);
  // بطاقة مربعة: صورة الصنف أو إيموجي على خلفية بلونه، والاسم والسعر فوقها بتدرّج داكن في الأسفل
  return `<button class="tile c-${item.color} ${out ? 'out' : ''} ${img ? 'has-img' : ''}" data-action="pos-item" data-id="${item.id}">
    ${img ? `<img class="t-media" src="${img}" alt="" loading="lazy">` : `<span class="t-media t-emoji" aria-hidden="true">${esc(itemEmoji(item, catName))}</span>`}
    ${out ? '<span class="t-flag pill bad">نفد</span>' : low ? '<span class="t-flag pill warn">قليل</span>' : ''}
    <span class="t-info"><span class="t-name">${esc(item.name)}</span>
    <span class="t-price num">${prices.length > 1 && Math.max(...prices) !== min ? 'من ' : ''}${money(min)}</span></span>
  </button>`;
}

function ticketPane(s) {
  const cart = s.pos.cart;
  const t = safeTotals();
  const customer = cart.customer;
  const lines = cart.lines.map((l, i) => {
    const calc = t.lines[i];
    const sub = [l.variantName, ...l.modifiers.map((m) => m.name)].filter(Boolean).join(' · ');
    const discounted = calc && calc.discount > 0 && l.discountIds.length;
    return `<li class="line ${s.pos.flashKey === l.key ? 'flash' : ''}" data-action="pos-line" data-key="${l.key}" role="button" tabindex="0">
      <div class="l-body"><div class="l-name">${esc(l.itemName)}</div>${sub ? `<div class="l-sub">${esc(sub)}</div>` : ''}
        ${l.note ? `<div class="l-sub">✎ ${esc(l.note)}</div>` : ''}
        ${l.discountIds.length ? `<div class="l-disc">${l.discountIds.map((d) => esc(discountById(d)?.name ?? '')).join('، ')}</div>` : ''}
        <div class="l-total num">${discounted ? `<s>${money(calc.gross, { symbol: false })}</s> ` : ''}${money(discounted ? calc.gross - calc.discount : lineUnit(l) * l.qty)}</div></div>
      <div class="l-step" role="group" aria-label="الكمية">
        <button data-action="line-dec" data-key="${l.key}" aria-label="${l.qty > 1 ? 'إنقاص' : 'حذف'}">${icon(l.qty > 1 ? 'minus' : 'trash', 'sm')}</button>
        <span class="qty-badge num">${l.qty}</span>
        <button data-action="line-inc" data-key="${l.key}" aria-label="زيادة">${icon('plus', 'sm')}</button>
      </div>
    </li>`;
  }).join('');
  const ticketDiscNames = cart.discountIds.map((d) => discountById(d)?.name).filter(Boolean);
  const dining = s.settings.diningOptions;

  return `<aside class="ticket ${cart.lines.length ? '' : 'is-empty'}" aria-label="التذكرة">
    <div class="ticket-head">
      <div class="ticket-title">
        <h2>${cart.ticket ? esc(cart.ticket.name) : 'طلب جديد'}</h2>
        <span class="spacer"></span>
        ${s.settings.features.openTickets && can('pos.tickets') ? `<button class="btn sm" data-action="pos-tickets">${icon('ticket', 'sm')} التذاكر${s.ticketsCount ? ` (${s.ticketsCount})` : ''}</button>` : ''}
        <button class="icon-btn" data-action="pos-clear" title="مسح الطلب" ${cart.lines.length ? '' : 'disabled'}>${icon('trash', 'sm')}</button>
        <button class="icon-btn" data-action="ticket-toggle" title="إخفاء نافذة الطلب" aria-label="إخفاء نافذة الطلب">${icon('arrow', 'sm')}</button>
      </div>
      <div class="ticket-meta">
        <select id="pos-dining" data-change="pos-dining" aria-label="نوع الطلب">${dining.map((d) => `<option value="${d.id}" ${cart.diningOption === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
        <button class="customer-chip ${customer ? 'set' : ''}" data-action="pos-customer">${icon('user', 'sm')} ${customer ? `${esc(customer.name)} · ${customer.points} نقطة` : 'إضافة عميل'}</button>
      </div>
    </div>
    <ul class="lines">${lines ? `<li class="more-lines" data-action="pos-all-lines" hidden></li>${lines}` : `<li class="empty">${icon('cup')}<p>اختر مشروباً لبدء الطلب</p></li>`}</ul>
    <div class="totals">
      <div class="t-row muted"><span>عدد الأصناف</span><span class="num">${cart.lines.reduce((a, l) => a + l.qty, 0)}</span></div>
      <div class="t-row"><span>المجموع</span><span class="num">${money(t.gross)}</span></div>
      ${t.lineDiscount || t.ticketDiscount ? `<div class="t-row disc"><span>الخصم${ticketDiscNames.length ? ` (${esc(ticketDiscNames.join('، '))})` : ''}</span><span class="num">−${money(t.lineDiscount + t.ticketDiscount)}</span></div>` : ''}
      ${t.pointsDiscount ? `<div class="t-row disc"><span>استبدال نقاط</span><span class="num">−${money(t.pointsDiscount)}</span></div>` : ''}
      ${t.tax ? `<div class="t-row"><span>${esc(s.settings.tax.name)} ${s.settings.tax.mode === 'included' ? '(مشمولة)' : ''}</span><span class="num">${money(t.tax)}</span></div>` : ''}
    </div>
    <div class="ticket-actions">
      <div class="row">
        <button class="btn" data-action="pos-discounts" ${cart.lines.length && can('pos.discount') && s.catalog.discounts.length ? '' : 'disabled'}>${icon('tag', 'sm')} خصم</button>
        ${s.settings.features.openTickets && can('pos.tickets') ? `<button class="btn" data-action="pos-save" ${cart.lines.length && !s.busy ? '' : 'disabled'}>${icon('save', 'sm')} ${cart.ticket ? 'تحديث' : 'حفظ'}</button>` : ''}
      </div>
      <button class="btn primary lg block charge" data-action="pos-charge" ${cart.lines.length && !s.busy ? '' : 'disabled'}>
        <span>دفع</span><span class="amount num">${money(t.total)}</span>
      </button>
    </div>
  </aside>`;
}

// ---------------------------------------------------------------- النوافذ
const modals = {
  item(s) {
    const m = s.modal;
    const item = itemById(m.itemId);
    const variant = item.variants.find((v) => v.id === m.variantId);
    const groups = item.modifierIds.map(modifierById).filter(Boolean);
    const chosen = groups.flatMap((g) => g.options.filter((o) => m.options.includes(o.id)));
    const unit = unitPrice(variant.price, chosen.map((o) => o.price));
    const missing = groups.filter((g) => g.required && !g.options.some((o) => m.options.includes(o.id)));
    const discounts = s.catalog.discounts.filter((d) => !d.restricted || can('pos.discount_restricted'));
    const body = `
      ${item.variants.length > 1 ? `<div class="opt-group"><h3>الحجم</h3><div class="opts">${item.variants.map((v) => `
        <button class="opt ${v.id === variant.id ? 'on' : ''}" data-action="item-variant" data-id="${v.id}">
          <span>${esc(v.name)}</span><small>${money(v.price)}${v.available !== null && v.available <= 0 ? ' · نفد' : ''}</small></button>`).join('')}</div></div>` : ''}
      ${groups.map((g) => `<div class="opt-group"><h3>${esc(g.name)} ${g.required ? '<span class="pill petrol">إلزامي</span>' : '<span class="pill">اختياري</span>'}${g.selection === 'multi' ? '<span class="muted small">أكثر من خيار</span>' : ''}</h3>
        <div class="opts">${g.options.map((o) => `<button class="opt ${m.options.includes(o.id) ? 'on' : ''}" data-action="item-option" data-group="${g.id}" data-id="${o.id}">
          <span>${esc(o.name)}</span><small>${o.price ? `+${money(o.price)}` : 'بلا إضافة'}</small></button>`).join('')}</div></div>`).join('')}
      <div class="row wrap"><h3 style="margin-inline-end:auto">الكمية</h3>
        <div class="stepper"><button data-action="item-qty" data-d="-1" aria-label="إنقاص">−</button><span>${m.qty}</span><button data-action="item-qty" data-d="1" aria-label="زيادة">+</button></div></div>
      ${field('ملاحظة للباريستا', `<input id="item-note" maxlength="120" value="${esc(m.note ?? '')}" data-input="item-note" placeholder="مثلاً: حار جداً، بدون رغوة">`)}
      ${m.lineKey && can('pos.discount') && discounts.length ? `<div class="opt-group"><h3>خصم على هذا الصنف</h3><div class="opts">${discounts.map((d) => `
        <button class="opt ${m.discountIds.includes(d.id) ? 'on' : ''}" data-action="item-discount" data-id="${d.id}"><span>${esc(d.name)}</span><small>${discountLabel(d)}${d.restricted ? ' · مقيد' : ''}</small></button>`).join('')}</div></div>` : ''}`;
    const foot = `${m.lineKey ? `<button class="btn danger" data-action="item-remove">${icon('trash', 'sm')} حذف</button>` : ''}
      <button class="btn primary lg" data-action="item-save" ${missing.length ? 'disabled' : ''}>${missing.length ? `اختر ${esc(missing[0].name)}` : `${m.lineKey ? 'حفظ' : 'إضافة'} · ${money(unit * m.qty)}`}</button>`;
    return modalFrame({ title: item.name, body, foot, cls: 'wide' });
  },

  'line-missing'(s) {
    const line = s.pos.cart.lines.find((l) => l.key === s.modal.key);
    if (!line) return '';
    return modalFrame({ title: line.itemName, sub: esc(line.variantName ?? ''),
      body: `<p>${icon('alert', 'sm')} هذا الصنف أو حجمه لم يعد متاحاً في القائمة، فلا يمكن بيعه. احذفه من الطلب ثم أضف البديل.</p>`,
      foot: `<button class="btn danger solid" data-action="line-remove">${icon('trash', 'sm')} حذف من الطلب</button>` });
  },

  'offline-failed'(s) {
    const list = failedSales();
    const reason = (x) => ({ TOTAL_MISMATCH: 'تغيّر سعر أو خصم قبل الإرسال', NO_OPEN_SHIFT: 'أُغلقت الوردية قبل الإرسال', OUT_OF_STOCK: 'نفد المخزون', UNKNOWN_VARIANT: 'صنف لم يعد في القائمة' }[x.error] ?? x.error);
    return modalFrame({ title: 'مبيعات محفوظة لم يقبلها الخادم', cls: 'wide', body: list.length ? `<p class="muted small">بيعت هذه الطلبات بلا إنترنت، ثم رفضها الخادم عند الإرسال. راجعها: أعد المحاولة بعد حل السبب، أو احذفها وسجّلها يدوياً.</p>
      <div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الموظف</th><th class="num">المبلغ</th><th>السبب</th><th></th></tr></thead><tbody>
      ${list.map((x) => `<tr><td class="small">${time(x.queuedAt, s.settings?.tzOffsetMin ?? 180)}</td><td>${esc(x.summary?.employee ?? '')}</td><td class="num">${money(x.summary?.total ?? 0)}</td><td class="small">${esc(reason(x))}</td>
        <td><div class="row" style="gap:6px;justify-content:flex-end"><button class="btn sm" data-action="offline-retry" data-id="${x.body.clientId}">إعادة</button><button class="btn sm danger" data-action="offline-discard" data-id="${x.body.clientId}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">لا شيء للمراجعة.</p>', foot: '<button class="btn" data-action="close-modal">إغلاق</button>' });
  },

  'all-lines'(s) {
    const t = safeTotals();
    const rows = s.pos.cart.lines.map((l, i) => `<tr class="click" data-action="pos-line" data-key="${l.key}"><td class="num">${l.qty}×</td>
      <td><b>${esc(l.itemName)}</b><div class="muted small">${esc([l.variantName, ...l.modifiers.map((x) => x.name)].filter(Boolean).join(' · '))}</div></td>
      <td class="num">${money(t.lines[i] ? t.lines[i].gross - t.lines[i].discount : lineUnit(l) * l.qty)}</td></tr>`).join('');
    return modalFrame({ title: `الطلب · ${s.pos.cart.lines.reduce((a, l) => a + l.qty, 0)} قطعة`, cls: 'wide',
      body: `<div class="table-wrap"><table><tbody>${rows}</tbody></table></div><p class="muted small">اضغط على صنف لتعديل حجمه أو إضافاته.</p>`,
      foot: `<button class="btn primary" data-action="close-modal">تم</button>` });
  },

  discounts(s) {
    const cart = s.pos.cart;
    const list = s.catalog.discounts.filter((d) => !d.restricted || can('pos.discount_restricted'));
    return modalFrame({ title: 'خصم على الطلب', body: `<div class="opts">${list.map((d) => `
      <button class="opt ${cart.discountIds.includes(d.id) ? 'on' : ''}" data-action="ticket-discount" data-id="${d.id}">
        <span>${esc(d.name)}</span><small>${discountLabel(d)}${d.restricted ? ' · يتطلب مديراً' : ''}</small></button>`).join('')}</div>
      <p class="muted small">النسبة تُحسب على المجموع بعد خصومات الأصناف، ثم يُطرح الخصم الثابت. يوزَّع الخصم على الأصناف لحساب الأرباح بدقة.</p>`,
    foot: '<button class="btn primary" data-action="close-modal">تم</button>' });
  },

  customer(s) {
    const m = s.modal;
    const cart = s.pos.cart;
    const loyalty = s.settings.loyalty?.enabled;
    const current = cart.customer;
    const list = (m.results ?? []).map((c) => `<tr class="click" data-action="customer-pick" data-id="${c.id}">
      <td><b>${esc(c.name)}</b><div class="muted small">${esc(c.phone ?? '')}</div></td>
      <td class="num">${c.visits} زيارة</td><td class="num">${loyalty ? `${c.points} نقطة` : ''}</td></tr>`).join('');
    const body = current ? `
      <div class="card pad row wrap"><div class="avatar">${esc(current.name.slice(0, 1))}</div>
        <div><b>${esc(current.name)}</b><div class="muted small">${current.points} نقطة متاحة</div></div><span class="spacer"></span>
        <button class="btn sm danger" data-action="customer-remove">إزالة</button></div>
      ${loyalty && current.points > 0 ? `<form class="stack" data-form="customer-points">
        ${field('استبدال نقاط (1 نقطة = 1 د.ع)', `<input class="amount-input" name="points" id="cust-points" inputmode="numeric" value="${cart.pointsRedeemed || ''}" placeholder="0">`, `بحد أقصى ${Math.min(current.points, cartTotals({ ...cart, pointsRedeemed: 0 }).net)} نقطة`)}
        <button class="btn olive" type="submit">${icon('star', 'sm')} تطبيق</button></form>` : ''}`
      : `<div class="search-box">${icon('search', 'sm')}<input type="search" id="cust-search" placeholder="اسم العميل أو رقم الهاتف" value="${esc(m.search ?? '')}" data-input="customer-search" autofocus autocomplete="off"></div>
      ${list ? `<div class="table-wrap"><table><tbody>${list}</tbody></table></div>` : `<p class="muted small">${m.search ? 'لا نتائج' : 'ابحث، أو أضف عميلاً جديداً'}</p>`}
      <form class="card pad stack" data-form="customer-create"><h3>عميل جديد</h3>
        <div class="grid-2">${field('الاسم', '<input name="name" id="cust-name" required minlength="2" maxlength="50">')}${field('الهاتف', '<input name="phone" id="cust-phone" inputmode="tel" maxlength="20" dir="ltr">')}</div>
        <button class="btn" type="submit">${icon('plus', 'sm')} إضافة وربط بالطلب</button></form>`;
    return modalFrame({ title: 'العميل', body, cls: 'wide' });
  },

  tickets(s) {
    const list = s.modal.list;
    const rows = list === undefined ? '<p class="muted">جارٍ التحميل…</p>' : list.length ? `<div class="table-wrap"><table>
      <thead><tr><th>التذكرة</th><th>الأصناف</th><th>آخر تعديل</th><th class="num">الإجمالي</th><th></th></tr></thead><tbody>
      ${list.map((t) => `<tr class="click" data-action="ticket-open" data-id="${t.id}"><td><b>${esc(t.name)}</b>${t.note ? `<div class="muted small">${esc(t.note)}</div>` : ''}</td>
        <td class="num">${t.lines.reduce((a, l) => a + l.qty, 0)}</td><td class="muted small">${esc(t.updatedBy ?? '')}</td><td class="num">${money(t.displayTotal)}</td>
        <td>${can('pos.void_saved') ? `<button class="icon-btn" data-action="ticket-delete" data-id="${t.id}" aria-label="حذف التذكرة">${icon('trash', 'sm')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('ticket')}<p>لا توجد تذاكر محفوظة</p></div>`;
    // الخريطة: الطاولة المشغولة تُفتح تذكرتها بلمسة
    const map = hasFloor(s) && list?.length ? `${floorMap(floorTables(s), { mode: 'open', occupied: new Map(list.filter((t) => t.tableId).map((t) => [t.tableId, t])) })}${floorLegend()}` : '';
    return modalFrame({ title: 'التذاكر المفتوحة', body: `<div class="stack">${map}${rows}</div>`, cls: 'wide' });
  },

  'save-ticket'(s) {
    const cart = s.pos.cart;
    if (hasFloor(s)) {
      // اختيار الطاولة من الخريطة؛ المشغولة معطّلة، أو حفظ باسم (سفري، اسم عميل)
      const list = s.modal.list;
      const occupied = new Map((list ?? []).filter((t) => t.tableId && t.id !== cart.ticket?.id).map((t) => [t.tableId, t]));
      return modalFrame({ title: 'حفظ التذكرة على طاولة', cls: 'wide', body: `<div class="stack">
        ${list === undefined ? '<p class="muted">جارٍ تحميل الطاولات…</p>' : `${floorMap(floorTables(s), { mode: 'pick', occupied, current: cart.ticket?.tableId ?? null })}${floorLegend()}`}
        <form class="row wrap" data-form="ticket-save" id="ticket-form" style="align-items:flex-end">
          ${field('أو احفظ باسم', `<input name="name" id="ticket-name" maxlength="40" value="${esc(cart.ticket?.tableId ? '' : cart.ticket?.name ?? '')}" placeholder="سفري، أو اسم العميل">`)}
          ${field('ملاحظة', `<input name="note" id="ticket-note" maxlength="120" value="${esc(cart.ticket?.note ?? '')}">`)}
          <button class="btn" type="submit" ${s.busy ? 'disabled' : ''}>حفظ بالاسم</button></form></div>` });
    }
    return modalFrame({ title: 'حفظ التذكرة', body: `<form class="stack" data-form="ticket-save" id="ticket-form">
      ${field('اسم التذكرة', `<input name="name" id="ticket-name" required maxlength="40" value="${esc(cart.ticket?.name ?? '')}" placeholder="طاولة 3، أو اسم العميل" autofocus>`)}
      <div class="row wrap">${['طاولة 1', 'طاولة 2', 'طاولة 3', 'طاولة 4', 'سفري'].map((n) => `<button type="button" class="chip" data-action="ticket-name" data-name="${n}">${n}</button>`).join('')}</div>
      ${field('ملاحظة', '<input name="note" id="ticket-note" maxlength="120">')}
      <button class="btn primary lg" type="submit" ${s.busy ? 'disabled' : ''}>حفظ</button></form>` });
  },

  pay(s) {
    const m = s.modal;
    if (m.stage === 'done') return doneView(m);
    const total = m.total;
    const paid = m.payments.reduce((a, p) => a + p.amount, 0);
    const remaining = total - paid;
    const types = s.settings.paymentTypes.filter((p) => p.active);
    const type = types.find((p) => p.id === m.typeId) ?? types[0];
    const isCash = type.kind === 'cash';
    const amount = parseAmount(m.amountText) ?? remaining;
    const valid = Number.isSafeInteger(amount) && amount > 0 && amount <= remaining;
    return `<div class="modal full" role="dialog" aria-modal="true" aria-label="الدفع" data-stop><div class="pay">
      <section class="pay-side">

function cartLineFrom({ item, variant, optionIds, qty, note, discountIds = [], key }) {
  const mods = item.modifierIds.map(modifierById).filter(Boolean).flatMap((g) => g.options.filter((o) => optionIds.includes(o.id)));
  return {
    key: key ?? uid(), itemId: item.id, itemName: item.name, variantId: variant.id, variantName: variant.name, price: variant.price,
    modifiers: mods.map((o) => ({ id: o.id, name: o.name, price: o.price })), qty, note: note || '', discountIds,
  };
}

/** هل يكفي المخزون لإضافة كمية من هذا الحجم؟ (الخادم يتحقق نهائياً عند الدفع) */
function stockAllows(variantId, extra, exceptKey = null) {
  const v = state.catalog.items.flatMap((i) => i.variants).find((x) => x.id === variantId);
  if (!v || v.available === null || v.available === undefined) return true;
  const inCart = state.pos.cart.lines.filter((l) => l.variantId === variantId && l.key !== exceptKey).reduce((a, l) => a + l.qty, 0);
  return inCart + extra <= v.available;
}
function notAvailable(name, left) {

}

function addToCart(line) {
  const cart = state.pos.cart;
  const same = cart.lines.find((l) => l.variantId === line.variantId && !l.note && !line.note && !l.discountIds.length

  if (same) { same.qty += line.qty; return same.key; }

      id: cart.ticket?.id, version: cart.ticket?.version, name: data.name, note: data.note || null, tableId: data.tableId || null,
      lines: cart.lines.map((l) => ({ variantId: l.variantId, qty: l.qty, modifierOptionIds: l.modifiers.map((x) => x.id), discountIds: l.discountIds, note: l.note || null })),
      discountIds: cart.discountIds, customerId: cart.customer?.id ?? null, diningOption: cart.diningOption, displayTotal: cartTotals().total,

async function shareText(text, title) {
  if (navigator.share) {
    try { await navigator.share({ title, text }); } catch (e) { if (e?.name !== 'AbortError') toast('تعذرت المشاركة', 'bad'); }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('نُسخت القسيمة — الصقها في واتساب'); } catch { toast('تعذر النسخ', 'bad'); }
}

/** تقسيم مبلغ على الساعات كما يفعل الخادم (للمعاينة قبل التأكيد) */
function splitPreview(weights, amount) {
  const total = weights.reduce((a, w) => a + w, 0);
  if (!total) return weights.map(() => 0);
  const shares = weights.map((w) => Math.floor((amount * w) / total));
  let left = amount - shares.reduce((a, x) => a + x, 0);
  const order = weights.map((w, i) => [((amount * w) % total), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (const [, i] of order) { if (!left) break; shares[i] += 1; left -= 1; }
  return shares;
}

// أيام الأسبوع بترتيب العراق (السبت أولاً)
const WEEKDAY_ORDER = [6, 0, 1, 2, 3, 4, 5];
const WEEKDAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
function weekdaysCard(w) {
  if (!w) return '';
  const days = WEEKDAY_ORDER.map((i) => w.days[i]);
  const best = days.reduce((b, d, i) => (d.avgNet > days[b].avgNet ? i : b), 0);
  const worst = days.reduce((b, d, i) => (d.avgNet < days[b].avgNet ? i : b), 0);
  const any = days.some((d) => d.avgNet > 0);
  return `<section class="card pad stack"><div class="row wrap"><h2 style="margin-inline-end:auto">أفضل أيام العمل</h2><span class="muted small">متوسط صافي المبيعات لكل يوم · آخر ${w.weeks} أسابيع</span></div>
    ${any ? `${barChart(days.map((d) => d.avgNet), days.map((d) => WEEKDAY_NAMES[d.weekday]), { highlight: best })}
    <div class="row wrap small"><span class="pill ok">الأفضل: ${WEEKDAY_NAMES[days[best].weekday]} · ${money(days[best].avgNet)} · ${days[best].avgSales} إيصال</span>
      <span class="pill">الأضعف: ${WEEKDAY_NAMES[days[worst].weekday]} · ${money(days[worst].avgNet)}</span></div>` : '<p class="muted">لا مبيعات كافية بعد لمقارنة الأيام</p>'}</section>`;
}

function barChart(values, labels, { height = 200, highlight = -1, fmt = (v) => money(v, { symbol: false }) } = {}) {
  const w = 600;
  const pad = { t: 18, b: 28, l: 6, r: 6 };
  const max = Math.max(1, ...values);
  const nice = niceMax(max);
  const bw = (w - pad.l - pad.r) / values.length;
  const y = (v) => pad.t + (height - pad.t - pad.b) * (1 - v / nice);
  const grid = [0.5, 1].map((f) => `<line class="grid-line" x1="${pad.l}" x2="${w - pad.r}" y1="${y(nice * f)}" y2="${y(nice * f)}"/><text x="${w - pad.r}" y="${y(nice * f) - 3}" text-anchor="start">${fmt(nice * f)}</text>`).join('');
  const bars = values.map((v, i) => {
    const h = Math.max(v > 0 ? 2 : 0, height - pad.b - y(v));
    return `<rect class="bar ${i === highlight ? 'now' : ''}" x="${pad.l + i * bw + bw * 0.18}" y="${height - pad.b - h}" width="${bw * 0.64}" height="${h}" rx="3"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
  }).join('');
  const step = Math.ceil(values.length / 12);
  const xl = labels.map((l, i) => (i % step === 0 ? `<text x="${pad.l + i * bw + bw / 2}" y="${height - 8}" text-anchor="middle">${esc(l)}</text>` : '')).join('');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${height}" role="img" aria-label="رسم بياني">${grid}${bars}${xl}</svg></div>`;
}
function niceMax(v) {
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

function delta(now, before) {
  if (!before) return now ? '<span class="delta up">جديد اليوم</span>' : '<span class="delta muted">—</span>';
  const d = Math.round(((now - before) / Math.abs(before)) * 100);
  return `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% عن أمس</span>`;
}

          </div></section>
        <section class="card pad stack"><h2>طرق الدفع</h2>
          ${st.paymentTypes.map((p, i) => `<div class="row wrap"><input name="pt_name_${i}" id="pt-name-${i}" value="${esc(p.name)}" style="flex:1;min-width:140px" aria-label="اسم طريقة الدفع">

function auditDetails(x) {
  const d = x.data ?? {};
  const parts = [];
  if (d.sale) parts.push(`إيصال #${d.sale}${d.refund ? ` ← استرجاع #${d.refund}` : ''}`);
  if (d.receipt) parts.push(`إيصال #${d.receipt}`);
  if (Number.isSafeInteger(d.total)) parts.push(money(d.total));
  if (d.discount) parts.push(esc(d.discount));
  if (d.reason) parts.push(`السبب: ${esc(d.reason)}`);
  if (d.source === 'kds') parts.push('من شاشة التحضير');
  if (Number.isSafeInteger(d.wasteCost)) parts.push(`هدر ${money(d.wasteCost)}`);
  if (d.name) parts.push(esc(d.name));
  for (const c of d.priceChanges ?? []) parts.push(`${esc(c.variant || 'السعر')}: ${money(c.from)} ← ${money(c.to)}`);
  if (d.removedSizes) parts.push(`حُذف ${d.removedSizes} حجم`);
  if (Number.isSafeInteger(d.delta)) parts.push(`الكمية ${d.delta > 0 ? '+' : ''}${d.delta.toLocaleString('en-US')}`);
  if (Number.isSafeInteger(d.amount)) parts.push(money(d.amount));
  if (Number.isSafeInteger(d.difference)) parts.push(`الفرق ${money(d.difference, { sign: true })}`);
  if (Number.isSafeInteger(d.startingCash)) parts.push(`بداية ${money(d.startingCash)}`);
  if (d.role) parts.push(esc(ROLES[d.role] ?? d.role));
  if (d.pinChanged) parts.push('تغيير الرمز');
  if (d.active === false) parts.push('تعطيل');
  if (d.category) parts.push(esc(d.category));
  if (d.note) parts.push(esc(d.note));
  if (Array.isArray(d.keys) && d.keys.length) parts.push(esc(d.keys.join('، ')));
  return parts.join(' · ') || '—';
}

      ${line('الربح الإجمالي', sp.profit.profit, { href: '#/admin/reports', note: `بعد تكلفة ما بيع ${money(sp.costs.cogs)}` })}

// ---------------------------------------------------------------- التقرير اليومي: نص للمشاركة وورقة للطباعة
function dailyText(d) {
  const sm = d.summary;
  const lines = [
    `📊 التقرير اليومي — ${d.shopName}`, `📅 ${d.date}`, '',
    `صافي المبيعات: ${money(sm.net)}`, `عدد الإيصالات: ${sm.salesCount}`, `متوسط الفاتورة: ${money(sm.avgSale)}`, `الربح الإجمالي: ${money(sm.profit)}`,
    ...(sm.expenses ? [`المصروفات: ${money(sm.expenses)}`] : []), ...(sm.stockLoss ? [`نقص المخزون (هدر وجرد): ${money(sm.stockLoss)}`] : []), `💰 صافي الربح: ${money(sm.netProfit)}`,
    ...(sm.refundsCount ? [`المرتجعات: ${money(sm.refunds)} (${sm.refundsCount})`] : []),
    ...(sm.discounts ? [`الخصومات: ${money(sm.discounts)}`] : []),
    ...((d.cancelled ?? []).length ? ['', `❌ الإيصالات الملغاة (${d.cancelled.length})${sm.wasteCost ? ` — هدر ${money(sm.wasteCost)}` : ''}:`, ...d.cancelled.map((c) => `• #${c.saleNumber} ${c.items}: ${money(c.total)} — ${c.reason} (${c.by})`)] : []),
    '', '💳 طرق الدفع:', ...d.byPayment.map((p) => `• ${p.label}: ${money(p.net)} (${p.count})`),
    '', '☕ الأصناف المباعة:', ...d.byItem.map((i) => `• ${i.label}: ${i.qty - i.refundedQty} — ${money(i.net)}`),
  ];
  if (d.consumption.length) {
    lines.push('', '📦 الموارد المصروفة:', ...d.consumption.map((c) => `• ${c.name}: ${Number(c.used).toLocaleString('en-US')} ${c.unit}${c.loss ? ` (+هدر ${c.loss})` : ''} — المتبقي ${Number(c.stock).toLocaleString('en-US')}`));
    lines.push(`تكلفة الموارد: ${money(d.consumptionCost)}`);
  }
  if (d.lowStock.length) lines.push('', '⚠️ تحت حد التنبيه:', ...d.lowStock.map((c) => `• ${c.name}: ${Number(c.stock).toLocaleString('en-US')} ${c.unit}`));
  return lines.join('\n');
}

    ${(d.cancelled ?? []).length ? `<hr><b>الإيصالات الملغاة</b>${d.cancelled.map((c) => row(`#${c.saleNumber} ${esc(c.reason)}`, `-${m(c.total)}`)).join('')}${sm.wasteCost ? row('الهدر', m(sm.wasteCost)) : ''}` : ''}

    ${d.consumption.length ? `<hr><b>الموارد المصروفة</b>${d.consumption.map((c) => row(esc(c.name), `${Number(c.used + c.loss).toLocaleString('en-US')} ${esc(c.unit)}`)).join('')}${row('التكلفة', m(d.consumptionCost))}` : ''}

function simpleList(title, kind, list, headers, cells) {
  return `<div class="page-head"><h1>${title}</h1><button class="btn primary" data-action="${kind}-new">${icon('plus', 'sm')} إضافة</button></div>
    <div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${(list ?? []).map((x) => `<tr class="click" data-action="${kind}-edit" data-id="${x.id}">${cells(x).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${headers.length}" class="muted">${list ? 'لا عناصر' : 'جارٍ التحميل…'}</td></tr>`}</tbody></table></div>`;

function reportRows(tab, r) {
  switch (tab) {
    case 'items': return { head: ['الصنف', 'المباع', 'المسترجع', 'صافي المبيعات', 'التكلفة', 'الربح'], rows: r.byItem.map((x) => [x.label, x.qty, x.refundedQty, x.net, x.cogs, x.profit]), money: [3, 4, 5] };
    case 'categories': return { head: ['التصنيف', 'المباع', 'صافي المبيعات', 'التكلفة', 'الربح'], rows: r.byCategory.map((x) => [x.label, x.qty - x.refundedQty, x.net, x.cogs, x.profit]), money: [2, 3, 4] };
    case 'employees': return { head: ['الموظف', 'الإيصالات', 'المرتجعات', 'الخصومات', 'صافي المبيعات', 'متوسط الفاتورة'], rows: r.byEmployee.map((x) => [x.label, x.salesCount, x.refunds, x.discounts, x.net, x.avgSale]), money: [2, 3, 4, 5] };
    case 'payments': return { head: ['طريقة الدفع', 'العمليات', 'المدفوع', 'المسترجع', 'الصافي'], rows: r.byPayment.map((x) => [x.label, x.count, x.paid, x.refunded, x.net]), money: [2, 3, 4] };
    case 'modifiers': return { head: ['الإضافة', 'العدد', 'المبلغ'], rows: r.byModifier.map((x) => [x.label, x.count, x.amount]), money: [2] };
    case 'discounts': return { head: ['الخصم', 'مرات الاستخدام', 'المبلغ'], rows: r.byDiscount.map((x) => [x.label, x.count, x.amount]), money: [2] };
    case 'dining': return { head: ['نوع الطلب', 'الإيصالات', 'صافي المبيعات'], rows: r.byDining.map((x) => [x.label, x.salesCount, x.net]), money: [2] };
    default: return { head: ['اليوم', 'الإيصالات', 'المرتجعات', 'صافي المبيعات', 'الربح'], rows: r.byDay.map((x) => [x.label, x.salesCount, x.refunds, x.net, x.profit]), money: [2, 3, 4] };
  }
}

function reportTable(tab, r) {
  const { head, rows, money: mcols } = reportRows(tab, r);
  if (!rows.length) return '<div class="empty"><p>لا بيانات في هذه الفترة</p></div>';
  const totals = head.map((_, i) => (i === 0 ? 'المجموع' : rows.reduce((a, row) => a + (Number(row[i]) || 0), 0)));
  const cell = (v, i) => (i === 0 ? `<td>${esc(v)}</td>` : `<td class="num">${mcols.includes(i) ? money(v) : Number(v).toLocaleString('en-US')}</td>`);
  return `<table><thead><tr>${head.map((h, i) => `<th class="${i ? 'num' : ''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((row) => `<tr>${row.map(cell).join('')}</tr>`).join('')}</tbody>
    ${['days', 'items', 'categories', 'payments', 'employees'].includes(tab) ? `<tfoot><tr>${totals.map((v, i) => (i === 0 ? `<td>${v}</td>` : tab === 'employees' && i === 5 ? '<td></td>' : cell(v, i))).join('')}</tr></tfoot>` : ''}</table>`;
}
