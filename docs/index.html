/* مور كاش — الهوية: «الإيصال هو العلامة»
   الشعار حبة بن شقّها حافة إيصال ممزقة. أخضر القهوة للهيكل، أخضر الورقة للفعل، نحاسي للتمييز،
   وأبيض الإيصال الحراري. خط Lalezar (خط لافتات المقاهي) للعلامة والعناوين الكبيرة فقط.
   (السابق: نظام تصميم أخضر المقاهي
   أخضر عميق للهيكل (الشريط الجانبي ولوحة الدفع)، أخضر واضح للفعل الأساسي، ذهبي دافئ للتمييز،
   وأرضية دافئة محايدة. الشاشة مقسمة كجهاز كاشير: شريط تنقل ← شبكة الأصناف ← التذكرة.) */

:root {
  /* الهوية (2026-11): أخضر بترولي للهيكل، تدرّج زيتوني للفعل والتحديد، بطاقات بيضاء ناعمة على أرضية خضراء باهتة */
  --brand-900: #073c3c;   /* البترولي: الشريط الجانبي واللوحات الداكنة */
  --brand-800: #062c30;
  --brand-700: #0b5960;   /* بترولي فاتح: رؤوس بطاقات التحضير */
  --brand-600: #0d4c4b;   /* زر الإضافة الدائري */
  --brand-100: #eef3dd;   /* زيتوني فاتح: التحديد */
  --olive: #a9b83b;
  --olive-2: #71851e;
  --olive-grad: linear-gradient(135deg, #9fb034 0%, #687b1b 100%);
  --price: #5f7118;
  --gold: #b4c83d;        /* لمسات التمييز على الداكن */
  --gold-soft: #f1f5dc;
  --gold-ink: #55661a;
  --on-brand: #ffffff;
  --heading: #164c43;
  --on-brand-muted: #b9cfca;
  --bg: #eef4f2;
  --bg-grad: linear-gradient(135deg, #f5f8f7 0%, #e7efec 100%);
  --surface: #ffffff;
  --surface-2: #f6f9f8;
  --surface-3: #eaf0ee;
  --line: #dce7e5;
  --line-strong: #c7d6d3;
  --ink: #183336;
  --ink-2: #375457;
  --muted: #62777a;
  --primary: #66791a;
  --primary-ink: #ffffff;
  --primary-hover: #586a15;
  --accent: #5f7118;
  --accent-soft: #eef3dd;
  --ok: #2b7a4b;
  --ok-soft: #e1f1e6;
  --warn: #9a5b0c;
  --warn-soft: #f8ecd6;
  --bad: #b03a2e;
  --bad-soft: #f7e1de;
  --shadow-1: 0 4px 14px rgb(18 58 58 / 8%);
  --shadow-2: 0 18px 48px rgb(18 58 58 / 22%);
  --scrim: rgb(6 30 32 / 55%);
  /* ألوان الأصناف */
  --tile-olive: #0a7c55;
  --tile-petrol: #0f3d31;
  --tile-sage: #6f8f80;
  --tile-teal: #2b8a75;
  --tile-sand: #b8893c;
  --tile-clay: #a5643f;
  --tile-mocha: #6b4a3a;
  --tile-slate: #5f6b68;
  /* الخطوط */
  --font-brand: "Lalezar", "Readex Pro", "IBM Plex Sans Arabic", sans-serif;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  /* المقاسات */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 22px;
  --touch: 48px;
  --rail: 224px;
  --topbar: 56px;
  --ticket: 400px;
  color-scheme: light;
}

/* الألوان فاتحة دائماً (أخضر داكن + أبيض) مهما كان وضع الجهاز؛ الوضع الداكن فقط عند طلبه صراحة */
:root[data-theme="dark"] {
  --bg: #0e1815; --surface: #14211d; --surface-2: #192a25; --surface-3: #20332d; --line: #2a3f38; --line-strong: #375049;
  --ink: #e9efec; --ink-2: #c6d3ce; --muted: #93a39d; --heading: #e6efe9;
  --brand-900: #0a1a15; --brand-100: #163a2e; --gold-soft: #33291a; --gold-ink: #e2c27d; --tile-petrol: #3f7a68; --tile-mocha: #8a6450; --tile-slate: #7b8784;
  --primary: #00a862; --primary-ink: #04150e; --primary-hover: #2bbd7e;
  --accent: #6fd3a8; --accent-soft: #163a2e;
  --ok: #5cc184; --ok-soft: #14301f; --warn: #e3a54a; --warn-soft: #36290f; --bad: #ef7a6c; --bad-soft: #3a1a17;
  --shadow-1: 0 1px 2px rgb(0 0 0 / 35%); --shadow-2: 0 14px 44px rgb(0 0 0 / 50%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
/* ارتفاع الشاشة الفعلي على الآيباد/الآيفون (بدون المنطقة خلف شريط Safari) كي يبقى زر الدفع ظاهراً بلا تمرير */
body { height: 100dvh; overflow: hidden; }
body {
  background: var(--bg-grad) fixed, var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app { height: 100%; overflow-y: auto; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
.num, td.num, .money { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .75rem; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.row > input, .row > select { width: auto; flex: 1 1 120px; min-width: 0; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 18px; height: 18px; }

/* ---------------------------------------------------------------- عناصر التحكم */
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.btn {
  min-height: var(--touch); padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s ease, border-color .15s ease, transform .08s ease; white-space: nowrap; text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--olive-grad); border-color: transparent; color: var(--primary-ink); box-shadow: 0 6px 16px rgb(104 123 27 / 25%); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(135deg, #91a22e 0%, #5c6d17 100%); }
.btn.primary:disabled { box-shadow: none; }
.btn.olive { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-3); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .9rem; border-radius: var(--r-sm); }
.btn.lg { min-height: 60px; font-size: 1.1rem; border-radius: var(--r-lg); }
.btn.block { width: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-md); border: none; background: transparent; display: inline-grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-3); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 2px; }

input, select, textarea {
  font: inherit; color: inherit; width: 100%; min-height: var(--touch); padding: 10px 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-strong); background: var(--surface);
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--primary); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .85rem; color: var(--ink-2); font-weight: 500; }
.field .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.amount-input { font-size: 1.6rem; font-variant-numeric: tabular-nums; text-align: center; direction: ltr; font-family: var(--font-display); }

.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface);
  font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { background: var(--olive-grad); color: #fff; border-color: transparent; }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-3); border-radius: var(--r-md); }
.seg button { border: none; background: transparent; min-height: 38px; padding: 0 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.petrol { background: #e2eeee; color: var(--brand-700); }
.pill.olive { background: var(--gold-soft); color: var(--gold-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card.pad { padding: 18px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg.i { width: 40px; height: 40px; stroke-width: 1.3; color: var(--line-strong); }

/* ---------------------------------------------------------------- رمز الموظف */
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 6px 0 4px; direction: ltr; }
.pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); transition: .12s; }
.pin-dots span.on { background: var(--primary); border-color: var(--primary); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; direction: ltr; }
.keypad button {
  height: 68px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); font-family: var(--font-display);
  font-size: 1.6rem; font-weight: 500; box-shadow: var(--shadow-1);
}
.keypad button:active { background: var(--surface-3); }
.keypad .muted-key { font-size: 1rem; color: var(--muted); background: transparent; box-shadow: none; border-color: transparent; }

/* ---------------------------------------------------------------- الهيكل */
/* شريط علوي داكن بعرض الشاشة، وتحته الشريط الجانبي (يميناً) والمحتوى */
.shell { height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: var(--topbar) minmax(0, 1fr); }
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
  background: #082f33; color: #e8f1ef; min-width: 0;
}
.tb-start, .tb-end { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-end { margin-inline-start: auto; }
.tb-shop { font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
.tb-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgb(180 200 61 / 16%); color: #d9e69a; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.tb-date { color: #b9cfca; font-size: .9rem; white-space: nowrap; }
.tb-clock { font-family: var(--font-display); font-size: 1rem; color: #fff; }
.tb-net { display: inline-flex; align-items: center; gap: 7px; font-size: .88rem; white-space: nowrap; }
.tb-net i { width: 9px; height: 9px; border-radius: 50%; background: var(--olive); box-shadow: 0 0 0 3px rgb(169 184 59 / 25%); }
.tb-net.off { color: #f3c98a; }
.tb-net.off i { background: #e3a54a; box-shadow: 0 0 0 3px rgb(227 165 74 / 25%); }
.tb-me { display: inline-flex; align-items: center; gap: 9px; padding-inline-start: 12px; border-inline-start: 1px solid rgb(255 255 255 / 12%); }
.tb-me .avatar { width: 36px; height: 36px; background: #174e50; font-size: .95rem; }
.tb-name { display: flex; flex-direction: column; line-height: 1.15; }
.tb-name b { font-size: .92rem; font-weight: 600; }
.tb-name small { font-size: .72rem; color: #b9cfca; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 16%); background: transparent; color: #e8f1ef; font-size: .85rem; }
.tb-btn:hover { background: rgb(255 255 255 / 8%); }

.rail {
  background: linear-gradient(180deg, var(--brand-900) 0%, var(--brand-800) 100%); color: #e8f1ef; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: 14px 12px max(14px, env(safe-area-inset-bottom, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
}
.rail::-webkit-scrollbar { display: none; }
.rail-brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 16px; margin-bottom: 6px; border-bottom: 1px solid rgb(255 255 255 / 10%); color: #fff; text-decoration: none; }
.rail-brand .mark { width: 44px; height: 44px; }
.rail-brand span { display: flex; flex-direction: column; line-height: 1.1; }
.rail-brand b { font-family: var(--font-brand); font-weight: 400; font-size: 1.45rem; }
.rail-brand small { color: #b9cfca; font-size: .78rem; letter-spacing: .04em; direction: ltr; text-align: end; }
.rail > a:not(.rail-brand) {
  display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 13px;
  color: inherit; text-decoration: none; font-size: 1.02rem; font-weight: 600; position: relative;
}
.rail > a:not(.rail-brand) + a:not(.on)::after { content: none; }
.rail > a:not(.rail-brand):hover { background: rgb(255 255 255 / 7%); }
.rail > a.on { background: var(--olive-grad); color: #fff; box-shadow: 0 6px 16px rgb(0 0 0 / 18%); }
.rail > a svg.i { width: 22px; height: 22px; opacity: .95; }
.rail .badge { margin-inline-start: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--gold); color: #1f2410; font-size: .75rem; display: grid; place-items: center; padding: 0 6px; font-weight: 700; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-700); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; flex: none; }
.main { min-width: 0; min-height: 0; overflow: auto; }

/* ---------------------------------------------------------------- شاشة البيع */
.pos { height: 100%; min-height: 0; overflow: hidden; display: grid; grid-template-columns: var(--ticket-w, minmax(300px, .85fr)) 14px minmax(0, 1fr); }
.pos > .ticket { order: -2; }
.pos > .splitter { order: -1; }
/* مقبض السحب بين نافذة الطلب والأصناف: منطقة لمس عريضة وخط ظاهر في المنتصف */
.splitter { position: relative; cursor: col-resize; touch-action: none; background: transparent; display: grid; place-items: center; outline: none; }
.splitter span { width: 4px; height: 48px; border-radius: 4px; background: var(--line-strong); transition: background .15s, height .15s; }
.splitter:hover span, .splitter:focus-visible span, .splitter.dragging span { background: var(--primary); height: 72px; }
.splitter.dragging { background: color-mix(in srgb, var(--brand-100) 60%, transparent); }
.catalog { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.pos-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pos-top h1 { font-size: 1.15rem; margin-inline-end: auto; }
.pos-top .clock { font-family: var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.catalog-head { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.search-box { position: relative; }
.search-box svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-box input { padding-inline-start: 44px; background: #f1f5f4; border-color: #dfe8e5; border-radius: 12px; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat-chip { --c: var(--tile-slate); border-radius: 10px; min-height: 40px; padding: 0 16px; background: #f4f7f6; border-color: #d9e4e1; color: #375457; font-weight: 600; font-size: .9rem; }
.cat-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cat-chip.on { background: var(--olive-grad); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgb(104 123 27 / 22%); }
.cat-chip.on::before { background: rgb(255 255 255 / 75%); }
.tiles { flex: 1; overflow-y: auto; padding: 12px 14px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 10px; align-content: start; }
/* overflow: clip وليس hidden: hidden يجعل الحد الأدنى للارتفاع صفراً فتتداخل البطاقات المربعة في الشبكة */
/* بطاقة الصنف مربعة: صورة الصنف أو إيموجي على خلفية بلون الصنف، والاسم والسعر فوقها بتدرّج داكن */
.tile {
  --c: var(--tile-olive);
  position: relative; aspect-ratio: 1 / 1; border-radius: var(--r-md); border: 1px solid var(--line); overflow: clip; padding: 0;
  text-align: start; display: block; box-shadow: var(--shadow-1); background: color-mix(in srgb, var(--c) 30%, #fff);
  transition: transform .08s ease, box-shadow .15s;
}
.tile:hover { box-shadow: 0 6px 18px rgb(30 57 50 / 14%); }
.tile:active { transform: scale(.97); }
.tile .t-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .t-emoji { display: grid; place-items: center; padding-bottom: 22%; font-size: 2.6rem; line-height: 1;
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c) 18%, #fff) 0%, color-mix(in srgb, var(--c) 42%, #fff) 72%);
  filter: drop-shadow(0 3px 3px rgb(0 0 0 / 12%)); }
.tile .t-info { position: absolute; inset: auto 0 0 0; padding: 20px 9px 7px; display: flex; flex-direction: column;
  background: linear-gradient(180deg, transparent, rgb(7 30 30 / 80%)); color: #fff; }
.tile .t-name { font-family: var(--font-display); font-weight: 700; font-size: .9rem; line-height: 1.25; text-shadow: 0 1px 2px rgb(0 0 0 / 35%);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .t-price { font-weight: 600; font-size: .8rem; opacity: .95; font-variant-numeric: tabular-nums; }
.tile .t-flag { position: absolute; z-index: 1; top: 6px; inset-inline-end: 6px; }
.tile.out .t-media { filter: grayscale(.8); opacity: .55; }
.tile.out .t-info { background: linear-gradient(180deg, transparent, rgb(40 48 48 / 78%)); }
.c-olive { --c: var(--tile-olive); } .c-petrol { --c: var(--tile-petrol); } .c-sage { --c: var(--tile-sage); } .c-teal { --c: var(--tile-teal); }
.c-sand { --c: var(--tile-sand); } .c-clay { --c: var(--tile-clay); } .c-mocha { --c: var(--tile-mocha); } .c-slate { --c: var(--tile-slate); }

.ticket { background: var(--surface); display: flex; flex-direction: column; min-height: 0; overflow: hidden; margin: 12px; margin-inline-end: 0; border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.ticket-head { padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.ticket-title { display: flex; align-items: center; gap: 8px; }
.ticket-title h2 { font-size: 1.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ticket-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.ticket-meta select { min-height: 38px; width: auto; padding: 0 10px; font-size: .9rem; border-radius: var(--r-sm); }
.customer-chip { min-height: 38px; border-radius: var(--r-sm); border: 1px dashed var(--line-strong); background: transparent; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.customer-chip.set { border-style: solid; background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.lines { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 2px 12px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
/* نافذة الطلب لا تُمرَّر: صفوف مضغوطة، ثم تُطوى الأسطر الأقدم في سطر "+N" (fitLines) */
.lines [hidden] { display: none !important; }
.lines.dense { gap: 5px; }
.lines.dense .line { padding-top: 5px; padding-bottom: 5px; }
.lines.dense .l-step button { width: 32px; height: 32px; }
.lines.dense .l-sub { display: none; }
.more-lines { padding: 8px 14px; font-size: .85rem; font-weight: 600; color: var(--primary); background: var(--brand-100); cursor: pointer; text-align: center; border-radius: 10px; flex: none; }
.line.flash { animation: flash .7s ease; }
@keyframes flash { from { background: var(--brand-100); } to { background: transparent; } }
/* إخفاء نافذة الطلب: الأصناف بعرض الشاشة وزر عائم لإعادتها */
.pos.ticket-hidden { grid-template-columns: minmax(0, 1fr) !important; }
.pos.ticket-hidden > .ticket, .pos.ticket-hidden > .splitter { display: none; }
.pos { position: relative; }
.ticket-fab { position: absolute; z-index: 5; bottom: max(16px, env(safe-area-inset-bottom, 0px)); inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 10px;
  min-height: 60px; padding: 0 20px; border-radius: 999px; border: none; background: var(--primary); color: #fff; font-weight: 700; font-size: 1.05rem; box-shadow: var(--shadow-2); }
.ticket-fab .fab-count { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: #fff; color: var(--primary); display: grid; place-items: center; font-size: .9rem; }
.ticket-fab .muted-on { opacity: .75; font-weight: 500; }
.ticket-fab:active { transform: scale(.97); }
.pos.ticket-hidden .tiles { padding-bottom: 96px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border: 1px solid #e2ebe8; border-radius: 12px; background: #fbfdfc; align-items: center; cursor: pointer; flex: none; }
.line:hover { border-color: var(--line-strong); }
.line .l-body { min-width: 0; }
.line .l-name { font-weight: 700; font-size: .95rem; }
.line .l-sub { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .l-disc { font-size: .78rem; color: var(--accent); }
.line .l-total { font-weight: 700; color: var(--price); font-size: .95rem; }
.line .l-total s { color: var(--muted); font-weight: 500; font-size: .8rem; }
.l-step { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 10px; background: #eef3f1; border: 1px solid #d4e0dc; }
.l-step button { width: 36px; height: 36px; border: none; border-radius: 8px; background: transparent; display: grid; place-items: center; color: var(--ink); }
.l-step button:hover { background: #fff; }
.l-step .qty-badge { min-width: 26px; text-align: center; font-weight: 700; font-size: .95rem; }
.totals { margin: 10px 14px 0; padding: 10px 2px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.totals .t-row { display: flex; justify-content: space-between; gap: 10px; }
.totals .t-row .num { font-weight: 700; }
.totals .disc { color: var(--accent); }
.ticket-actions { padding: 10px 14px max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.ticket-actions .row .btn { flex: 1; }
.charge { justify-content: space-between; padding: 0 22px; border-radius: 14px; }
.charge .amount { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }

/* ---------------------------------------------------------------- النوافذ */
.modal-back { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal-back.anim { animation: fade .12s ease; }
.modal-back.anim .modal { animation: rise .16s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(520px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-2); display: flex; flex-direction: column; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.modal.wide { width: min(760px, 100%); }
.modal.full { width: min(1080px, 100%); height: min(720px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--surface); }
.modal-foot .btn { flex: 1; }
.opt-group h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.opt { min-height: 56px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 12px; text-align: start; display: flex; flex-direction: column; justify-content: center; }
.opt small { color: var(--muted); font-variant-numeric: tabular-nums; }
.opt.on { border-color: var(--primary); background: var(--brand-100); box-shadow: inset 0 0 0 1px var(--primary); }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 3px; }
.stepper button { width: 44px; height: 44px; border: none; border-radius: 9px; background: var(--surface-3); font-size: 1.3rem; font-weight: 700; }
.stepper span { min-width: 44px; text-align: center; font-family: var(--font-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* الدفع */
.pay { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); height: 100%; min-height: 0; }
.pay-side { background: var(--brand-900); color: #e8f1ed; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.pay-side .due-label { color: var(--on-brand-muted); }
.pay-side .due { font-family: var(--font-display); font-size: 2.8rem; color: #fff; line-height: 1.1; }
.pay-side .split { display: flex; flex-direction: column; gap: 8px; }
.pay-side .split-row { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: var(--r-md); background: rgb(255 255 255 / 7%); }
.pay-side .remaining { color: var(--gold); font-family: var(--font-display); font-size: 1.3rem; }
.pay-main { padding: 22px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
.pay-types { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.pay-type { min-height: 64px; border-radius: var(--r-lg); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pay-type.on { border-color: var(--primary); background: var(--brand-100); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.done { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 24px; text-align: center; }
.done .tick { width: 76px; height: 76px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done .tick svg { width: 40px; height: 40px; stroke-width: 2.4; }
.done .change { font-family: var(--font-display); font-size: 3rem; color: var(--primary); line-height: 1.1; }

/* ---------------------------------------------------------------- الصفحات */
.page { padding: 22px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head h1 { margin-inline-end: auto; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { width: auto; min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 14px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .78rem; font-weight: 600; color: var(--muted); background: var(--surface-2); letter-spacing: .02em; position: sticky; top: 0; }
tr:last-child td { border-bottom: none; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: end; }
tfoot td { font-weight: 700; background: var(--surface-2); }

.split-view { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.receipt-paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.r-line { display: flex; justify-content: space-between; gap: 10px; }
.r-line .muted { font-size: .85rem; }
.dash { border-top: 1px dashed var(--line-strong); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-1); position: relative; }
.kpi b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--heading); }
.kpi .k-ic { position: absolute; inset-inline-end: 16px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #eaf1e9; color: #176047; }
.kpi:has(.k-ic) { padding-inline-end: 76px; }
.kpi .delta { font-size: .8rem; }
.kpi .delta.up { color: var(--ok); } .kpi .delta.down { color: var(--bad); }
.kpi.lead { background: linear-gradient(135deg, var(--brand-700), var(--brand-900)); border-color: transparent; color: #e8f1ed; }
.kpi.lead .k-ic { background: rgb(255 255 255 / 12%); color: #d9e69a; }
.kpi.lead .label { color: var(--on-brand-muted); }
.kpi.lead b { color: #fff; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { fill: #c9d68a; }
.chart .bar.now { fill: var(--primary); }
.chart text { fill: var(--muted); font-size: 15px; font-family: var(--font-body); }
.chart .grid-line { stroke: var(--line); stroke-dasharray: 3 3; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

.admin { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.admin-nav { background: rgb(255 255 255 / 70%); border-inline-end: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
.admin-nav .label { padding: 12px 12px 6px; }
.admin-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); text-decoration: none; color: var(--ink-2); font-weight: 500; }
.admin-nav a:hover { background: var(--surface-2); }
.admin-nav a.on { background: var(--olive-grad); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgb(104 123 27 / 22%); }
.admin-nav a.on .count { background: #fff; }
.admin-nav a .count { margin-inline-start: auto; }

.kds { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.kds-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; display: flex; flex-direction: column; }
.kds-card header { padding: 12px 14px; display: flex; align-items: center; gap: 8px; color: #fff; background: var(--brand-700); }
.kds-card.preparing header { background: var(--brand-700); }
.kds-card.ready header { background: var(--olive-grad); }
.kds-card.late header { background: var(--bad); }
.kds-card header b { font-family: var(--font-display); font-size: 1.3rem; }
.kds-card ul { list-style: none; margin: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.kds-card li { display: grid; grid-template-columns: 32px 1fr; gap: 6px; }
.kds-card li b { font-family: var(--font-display); font-size: 1.1rem; }
.kds-card li.void { text-decoration: line-through; color: var(--muted); }
.kds-served { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.served-chip { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.kds-actions { display: flex; gap: 8px; padding: 0 14px 14px; }
.kds-actions .btn:first-child { flex: 1; }

.toast-zone { position: fixed; z-index: 60; bottom: max(20px, env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: var(--r-md); box-shadow: var(--shadow-2); font-weight: 500; max-width: min(560px, calc(100vw - 32px)); }
.toast.anim { animation: rise .18s ease; }
.toast.ok { background: var(--ok); color: #fff; } .toast.bad { background: var(--bad); color: #fff; }

.demo-tag { font-size: .66rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #1e2a26; }
.demo-flag { position: fixed; z-index: 30; top: max(10px, env(safe-area-inset-top, 0px)); inset-inline-end: max(12px, env(safe-area-inset-left, 0px)); background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600; pointer-events: none; }

/* ---------------------------------------------------------------- استلام المشتريات وتنبيه المخزون */
.rcv-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(90px, 1fr) minmax(110px, 1fr) auto; gap: 8px; align-items: center; padding: 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.rcv-row.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); }
.rcv-row .rcv-src, .rcv-row .rcv-cost { grid-column: 1 / -1; }
.rcv-num { display: flex; align-items: center; gap: 6px; }
.rcv-num input { min-width: 0; }
.alert-low { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-lg); background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.alert-low > svg.i { flex: none; margin-top: 2px; }
.alert-low .small { color: var(--ink-2); }
.alert-low a { color: inherit; font-weight: 700; }
@media (max-width: 700px) { .rcv-row { grid-template-columns: 1fr 1fr auto; } .rcv-row select { grid-column: 1 / -1; } }

tr.audit-warn td:nth-child(3) b { color: var(--warn); }

/* حالة الاتصال على شاشة البيع */
.net-banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-md); background: var(--brand-100); color: var(--primary); font-size: .9rem; }
.net-banner.off { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.net-banner .low-text { flex: 1; min-width: 0; color: var(--ink-2); }
.net-banner.off .low-text b { color: var(--warn); }

/* تنبيه المخزون على شاشة البيع */
.low-banner { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.low-banner.has-out { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.low-banner .low-text { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: .9rem; }
.low-banner .low-list { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); font-size: .84rem; }
.low-banner .low-out { color: var(--bad); font-weight: 600; }
.low-banner .icon-btn { width: 34px; height: 34px; color: inherit; }
.rail .badge.bad { background: var(--bad); color: #fff; }

/* ---------------------------------------------------------------- استجابة */
/* الآيباد أفقياً: مسافات أقل لتتسع الأصناف والطلب */
@media (orientation: landscape) and (max-height: 900px) and (min-width: 701px) {
  :root { --topbar: 52px; }
  .catalog-head { padding: 10px 12px 8px; gap: 8px; }
  .ticket { margin: 10px; margin-inline-end: 0; }
  .ticket-head { padding: 10px 12px 8px; gap: 8px; }
  .ticket-actions { padding-top: 8px; gap: 6px; }
  .ticket-actions .btn.lg { min-height: 54px; }
}
/* الشريط الجانبي العريض يحتاج شاشة واسعة؛ دونها يصبح شريط أيقونات مع تسمية صغيرة */
@media (max-width: 1279px) {
  :root { --rail: 88px; }
  .rail { padding: 10px 8px; gap: 4px; }
  .rail-brand { justify-content: center; padding: 2px 0 10px; }
  .rail-brand span { display: none; }
  .rail-brand .mark { width: 42px; height: 42px; }
  .rail > a:not(.rail-brand) { flex-direction: column; justify-content: center; gap: 3px; min-height: 0; padding: 9px 2px; font-size: .72rem; font-weight: 600; border-radius: 12px; }
  .rail .badge { position: absolute; top: 3px; inset-inline-end: 8px; min-width: 18px; height: 18px; font-size: .68rem; padding: 0 4px; margin: 0; }
  .tb-date { display: none; }
}
@media (max-width: 900px) {
  .tb-name small, .tb-btn span { display: none; }
  .tb-shop { max-width: 34vw; }
}
@media (max-width: 1180px) { :root { --ticket: 350px; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .admin { grid-template-columns: 1fr; }
  .admin-nav { flex-direction: row; overflow-x: auto; border-inline-end: none; border-bottom: 1px solid var(--line); padding: 8px; }
  .admin-nav .label { display: none; }
  .admin-nav a { white-space: nowrap; }
  .split-view { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .pos { grid-template-columns: var(--ticket-w, minmax(290px, .85fr)) 14px minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); padding: 10px; gap: 8px; }
  .catalog-head { padding: 12px; }
  .pay-side { padding: 20px; }
  .pay-side .due { font-size: 2.2rem; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
  .pos { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .pos > .ticket { order: 0; }
  .pos > .splitter { display: none; }
  .ticket { border-top: 1px solid var(--line); max-height: 52vh; }
  .pay { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: 50px minmax(0, 1fr) auto; }
  .topbar { grid-column: 1; padding: 0 12px; gap: 8px; }
  .tb-pill, .tb-clock, .tb-me .tb-name, .tb-btn[data-action="fullscreen"] { display: none; }
  .rail { flex-direction: row; order: 2; grid-row: 3; padding: 6px max(8px, env(safe-area-inset-left, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .rail-brand { display: none; }
  .ticket { margin: 0; border-radius: 0; }
  .ticket.is-empty .lines, .ticket.is-empty .totals { display: none; }
  .rail > a:not(.rail-brand) { flex: 1; min-width: 60px; }
  .kpis, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------------------------------------------------------------- الطباعة */
@media print {
  html, body { height: auto !important; overflow: visible !important; }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  @page { size: 80mm auto; margin: 0; }
}
#print-area { display: none; }
.paper80 { width: 72mm; margin: 0 auto; font-family: var(--font-body); font-size: 12px; color: #000; background: #fff; padding: 4mm 0; }
.paper80 .c { text-align: center; }
.paper80 .big { font-size: 16px; font-weight: 700; }
.paper80 .row80 { display: flex; justify-content: space-between; gap: 6px; }
.paper80 hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }

.pay-summary { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow: auto; font-size: .9rem; color: var(--on-brand-muted); }
.pay-summary div { display: flex; justify-content: space-between; gap: 10px; }
.kds-card .who { padding: 8px 14px 0; font-weight: 600; }

/* ================================================================ الهوية: العلامة، الصفحة الرئيسية، الحساب */
.mark { display: block; flex: none; }
.wordmark { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-brand); font-weight: 400; font-size: 1.9rem; line-height: 1; color: inherit; text-decoration: none; }
.wordmark .mark { width: 44px; height: 44px; }
.btn.brass { background: var(--gold); border-color: var(--gold); color: #1d1806; }
.btn.brass:hover:not(:disabled) { background: #d8b45f; border-color: #d8b45f; }
.btn.on-dark { background: transparent; color: #fff; border-color: rgb(255 255 255 / 32%); }
.btn.on-dark:hover:not(:disabled) { border-color: #fff; background: rgb(255 255 255 / 6%); }
.btn.on-dark.ghost { border-color: transparent; }

/* ---- شاشات الحساب ورمز الموظف */
.acc { min-height: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
.acc-side { background: var(--brand-900); color: #fff; padding: 28px 48px 40px; display: flex; flex-direction: column; gap: 44px; }
.acc-side .wordmark { color: #fff; align-self: flex-start; }
.acc-side h2 { font-family: var(--font-brand); font-weight: 400; font-size: clamp(2.3rem, 4.2vw, 3.6rem); line-height: 1.08; color: #fff; text-wrap: balance; }
.acc-side .lead { color: var(--on-brand-muted); margin-top: 14px; line-height: 1.8; max-width: 40ch; }
.acc-side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; color: var(--on-brand-muted); }
.acc-side li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.6; }
.acc-side li svg { color: var(--gold); margin-top: 2px; }
.acc-side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.link-btn { background: none; border: 0; padding: 6px 0; color: inherit; text-decoration: underline; text-underline-offset: 4px; font: inherit; }
.acc-side .link-btn { color: var(--on-brand-muted); }
.acc-side .link-btn:hover { color: #fff; }
.acc-main { display: grid; place-items: center; padding: 40px 20px; }
.acc-form { width: min(460px, 100%); display: flex; flex-direction: column; gap: 20px; }
.acc-form h1 { font-family: var(--font-brand); font-weight: 400; font-size: 2.6rem; line-height: 1.1; color: var(--heading); }
.acc-form .sub { color: var(--muted); margin-top: 4px; }
.acc-form a { color: var(--primary); font-weight: 600; }
.acc-form fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.acc-form legend { font-weight: 700; color: var(--ink-2); padding: 0; margin-bottom: 4px; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-inline-end: 64px; }
.pw-wrap button { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: .85rem; padding: 8px; }
.pw-hint { margin: 4px 0 0; color: #9a5b00; background: #fff6e0; border-radius: 8px; padding: 6px 10px; }
.pw-hint[hidden] { display: none; }
.demo-note { background: var(--gold-soft); color: var(--gold-ink); border-radius: var(--r-md); padding: 12px 14px; font-size: .9rem; line-height: 1.7; }
.demo-note b { font-variant-numeric: tabular-nums; }
.shop-name { font-family: var(--font-brand); font-weight: 400; font-size: clamp(2.6rem, 5vw, 4.2rem); line-height: 1.05; color: #fff; text-wrap: balance; }
.pin-card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 18px; }
.pin-card h1 { font-size: 1.5rem; }
.account-card .grid-2 { align-items: end; }

@media (max-width: 900px) {
  .acc { grid-template-columns: 1fr; }
  .acc-side { padding: 20px 16px 28px; gap: 22px; }
  .acc-side ul, .acc-side .lead { display: none; }
  .acc-main { padding: 28px 16px 40px; align-items: start; }
}

/* صورة الصنف في المحرر والقائمة، وحد التنبيه القابل للتعديل */
.item-photo { display: flex; gap: 14px; align-items: center; padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface-2); }
.item-photo .ph { width: 84px; height: 84px; flex: none; border-radius: 16px; overflow: hidden; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); }
.item-photo .ph img { width: 100%; height: 100%; object-fit: cover; }
.item-photo .item-preview { width: 112px; flex: none; cursor: default; }
.item-photo .item-preview:active { transform: none; }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-pick button { width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.35rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.emoji-pick button.on { border-color: var(--olive-b, #687b1b); box-shadow: inset 0 0 0 1px var(--olive-b, #687b1b); background: #f3f7e4; }
img.thumb { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: none; }
.link-num { border: none; background: none; padding: 4px 6px; border-radius: 8px; font: inherit; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.link-num svg.i { width: 14px; height: 14px; color: var(--muted); }
.link-num:hover { background: var(--surface-3); }

/* الموارد البشرية: جدول الدوام في ملف الموظف، تبويبات كثيرة تلتف، وتنبيه نسيان الانصراف */
.sched { display: grid; gap: 6px; }
.sched-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px; border-radius: var(--r-md); background: var(--surface-2); }
.sched-row input[type=time] { width: 120px; min-height: 40px; }
.seg.wrap-seg { flex-wrap: wrap; }
.tb-btn.warn { background: #f8ecd6; color: #9a5b0c; border-color: transparent; text-decoration: none; }
/* روابط داخل أسطر الملخص (المصروفات): بلون الهوية لا بالأزرق الافتراضي */
.r-line a { color: var(--olive-b, #687b1b); font-weight: 600; text-decoration: none; border-bottom: 1px dashed currentColor; }

/* خريطة الطاولات: لوحة 1000×600 بالنسب، تتسع لعرض الشاشة */
.floor { width: 100%; }
.floor-canvas { position: relative; width: 100%; aspect-ratio: 1000 / 600; container-type: inline-size; border-radius: var(--r-lg); border: 1px solid var(--line);
  background: var(--surface-2); background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1.2px); background-size: 2% 3.333%; overflow: hidden; touch-action: none; }
.floor-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; }
.ft { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; text-align: center;
  border-radius: 12px; border: 2px solid #9fb6ad; background: #ffffff; color: var(--ink); font-size: .85rem; line-height: 1.2; overflow: hidden; box-shadow: 0 2px 6px rgb(18 58 58 / 10%); }
.ft.round { border-radius: 50%; }
.ft b { font-family: var(--font-display); font-weight: 700; font-size: clamp(10px, 1.9cqw, 17px); white-space: nowrap; }
.ft small { color: var(--muted); font-size: clamp(9px, 1.4cqw, 13px); white-space: nowrap; }
.ft.zone { background: repeating-linear-gradient(45deg, #e8eeeb, #e8eeeb 8px, #f1f5f3 8px, #f1f5f3 16px); border-style: dashed; color: var(--muted); box-shadow: none; }
.ft.busy { background: #fbeedd; border-color: #d69a45; }
.ft.busy small { color: #8a5a12; font-weight: 600; }
.ft.cur { outline: 3px solid var(--olive-b, #687b1b); outline-offset: 2px; }
button.ft { cursor: pointer; font: inherit; }
button.ft:not(:disabled):hover { border-color: var(--olive-b, #687b1b); box-shadow: 0 4px 12px rgb(104 123 27 / 25%); }
button.ft:disabled { cursor: not-allowed; opacity: .75; }
.floor.pick button.ft:not(.busy):not(:disabled) { background: #eef6e0; border-color: #9fb034; }
.floor.edit .ft { cursor: grab; user-select: none; touch-action: none; }
.floor.edit .ft.sel { border-color: var(--olive-b, #687b1b); box-shadow: 0 0 0 3px rgb(159 176 52 / 35%); z-index: 2; }
.ft-resize { position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; border-radius: 4px; background: var(--olive-b, #687b1b); cursor: nwse-resize; touch-action: none; }
.floor-key { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid #9fb034; background: #eef6e0; vertical-align: middle; }
.floor-key.busy { border-color: #d69a45; background: #fbeedd; }
.floor-editor { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 14px; align-items: start; }
@media (max-width: 1440px) { .floor-editor { grid-template-columns: 1fr; } .floor-panel { max-width: 560px; } }

/* شاشة الحضور والانصراف المشتركة */
.kiosk { min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
.kiosk-head { display: flex; align-items: center; gap: 16px; padding: 20px 24px; background: var(--brand-900, #0a1a15); color: #e8f1ef; }
.kiosk-head h1 { margin: 0; color: #fff; }
.kiosk-head .muted { color: #a9c3bc; }
.kiosk-head .btn { margin-inline-start: auto; }
.kiosk-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 20px 24px; align-items: start; }
.kiosk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.kiosk-emp { display: flex; align-items: center; gap: 14px; padding: 16px; min-height: 92px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); text-align: start; box-shadow: var(--shadow-1); font: inherit; cursor: pointer; }
.kiosk-emp.in { border-color: #9fb034; background: #f6f9ec; }
.kiosk-emp .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #0f3d31; color: #fff; font-weight: 700; font-size: 1.1rem; flex: none; }
.kiosk-pad { width: 340px; position: sticky; top: 20px; }
@media (max-width: 760px) { .kiosk-body { grid-template-columns: 1fr; } .kiosk-pad { width: auto; position: static; order: -1; } }

/* صفحة الاشتراك (حساب بانتظار الموافقة أو تجديد) وشريط تنبيه الاشتراك */
.sub-page { min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow: auto; }
.sub-head { display: flex; align-items: center; gap: 14px; padding: 18px 24px; background: var(--brand-900, #0a1a15); color: #e8f1ef; }
.sub-head h1 { margin: 0; color: #fff; font-size: 1.4rem; }
.sub-head p { color: #a9c3bc; }
.sub-head svg { width: 44px; height: 44px; }
.sub-body { width: min(1100px, 100%); margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.sub-price { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--olive-b, #687b1b); margin: 0; }
.sub-method { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); }
.sub-number { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: .03em; text-align: end; }
.sub-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; font-weight: 600; font-size: .9rem; }
.sub-banner.warn { background: #f8ecd6; color: #7a4b08; }
.sub-banner.bad { background: #f7e1de; color: #8f2b20; }
.sub-banner .btn { margin-inline-start: auto; }
/* شريط الاشتراك فوق الصفحة: الصفحة تأخذ الباقي (شاشة البيع بلا تمرير) */
.main.has-banner { display: flex; flex-direction: column; }
.main.has-banner > :last-child { flex: 1; min-height: 0; }
.card a[href^="https://wa.me"] { color: var(--olive-b, #687b1b); font-weight: 600; }

/* ================================================================ الموقع التعريفي (site.js) */
.st {
  --st-bg: #f6f3ea; --st-bg-2: #efebdf; --st-card: #fcfbf7; --st-line: #e4dfd1; --st-ink: #12302d; --st-soft: #55665f;
  --st-brand: #073c3c; --st-brand-2: #0b4a4a; --st-olive: #687b1b; --st-lime: #b4c83d; --st-gold: #8a6d1d;
  min-height: 100%; background: var(--st-bg); color: var(--st-ink); overflow-x: clip; font-size: 17px;
  background-image: radial-gradient(1200px 600px at 85% -10%, rgb(180 200 61 / 14%), transparent 60%), radial-gradient(900px 500px at 0% 8%, rgb(11 74 74 / 8%), transparent 60%);
}
.st h1, .st h2, .st h3 { font-family: var(--font-display); color: var(--st-ink); text-wrap: balance; }
.st p { margin: 0; }
.st-wrap { width: min(1200px, 100% - 48px); margin-inline: auto; }
.st-narrow { width: min(860px, 100% - 48px); }
.st .spacer { flex: 1; }

/* أزرار */
.st-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 1rem;
  border: 1px solid transparent; text-decoration: none; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; white-space: nowrap; font-family: inherit; }
.st-btn.lg { padding: 16px 32px; font-size: 1.08rem; }
.st-btn.sm { padding: 9px 18px; font-size: .92rem; }
.st-btn.block { width: 100%; }
.st-btn.dark { background: var(--st-brand); color: #fff; box-shadow: 0 10px 24px rgb(7 60 60 / 22%); }
.st-btn.dark:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgb(7 60 60 / 28%); background: var(--st-brand-2); }
.st-btn.light { background: #fff; color: var(--st-ink); border-color: var(--st-line); box-shadow: 0 6px 18px rgb(18 48 45 / 6%); }
.st-btn.light:hover { transform: translateY(-2px); border-color: #cfc8b4; }
.st-btn.light svg { color: #1fa855; }
.st-btn.ghost { background: transparent; color: var(--st-ink); }
.st-btn.ghost:hover { background: rgb(18 48 45 / 6%); }
.st-btn:disabled { opacity: .6; transform: none; cursor: wait; }

/* الشريط العلوي */
.st-nav { position: sticky; top: 0; z-index: 40; background: rgb(246 243 234 / 78%); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid rgb(228 223 209 / 70%); }
.st-nav-in { display: flex; align-items: center; gap: 24px; height: 72px; }
.st-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--st-ink); font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.st-logo .mark { width: 38px; height: 38px; }
.st-links { display: flex; gap: 4px; margin-inline: auto; }
.st-links button, .st-drawer button { background: none; border: 0; padding: 8px 14px; border-radius: 999px; color: var(--st-soft); font: 600 .95rem var(--font-body); cursor: pointer; }
.st-links button:hover { color: var(--st-ink); background: rgb(18 48 45 / 5%); }
.st-nav-cta { display: flex; align-items: center; gap: 8px; }
.st-burger { display: none; background: #fff; border: 1px solid var(--st-line); width: 42px; height: 42px; border-radius: 12px; align-items: center; justify-content: center; color: var(--st-ink); }
.st-drawer { display: none; }

/* البطل */
.st-hero { padding: 88px 0 40px; text-align: center; }
.st-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--st-line); padding: 7px 16px; border-radius: 999px; color: var(--st-olive); font-weight: 700; font-size: .9rem; box-shadow: 0 4px 14px rgb(18 48 45 / 5%); }
.st-hero h1 { font-size: clamp(2.6rem, 6.6vw, 5.4rem); line-height: 1.12; font-weight: 700; margin: 26px auto 0; letter-spacing: -.01em; }
.st-hero h1 em { font-style: normal; background: linear-gradient(120deg, #0b4a4a 10%, #687b1b 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.st-lead { max-width: 60ch; margin: 24px auto 0 !important; color: var(--st-soft); font-size: 1.15rem; line-height: 1.9; }
.st-cta-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 34px; }
.st-stats { display: flex; justify-content: center; gap: clamp(28px, 7vw, 96px); margin: 46px 0 0; flex-wrap: wrap; }
.st-stats div { min-width: 150px; }
.st-stats dt { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: var(--st-gold); line-height: 1.2; }
.st-stats dd { margin: 4px 0 0; color: var(--st-soft); font-size: .92rem; }
.st-device-wrap { position: relative; width: min(980px, 100%); margin: 60px auto 0; }
.st-device { background: #10201f; padding: clamp(8px, 1.4vw, 16px); border-radius: clamp(18px, 2.6vw, 34px); box-shadow: 0 40px 90px rgb(7 40 40 / 26%), 0 0 0 1px rgb(255 255 255 / 6%) inset; }
.st-device img { display: block; width: 100%; height: auto; border-radius: clamp(10px, 1.4vw, 20px); background: #eef4f2; aspect-ratio: 4 / 3; object-fit: cover; }
.st-chip { position: absolute; display: flex; align-items: center; gap: 12px; text-align: start; background: rgb(255 255 255 / 92%); backdrop-filter: blur(10px); border: 1px solid var(--st-line); border-radius: 18px; padding: 12px 16px; box-shadow: 0 18px 40px rgb(18 48 45 / 14%); animation: st-float 6s ease-in-out infinite; }
.st-chip b { display: block; font-size: .95rem; }
.st-chip small { color: var(--st-soft); font-size: .8rem; }
.st-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #2fb36b; box-shadow: 0 0 0 5px rgb(47 179 107 / 16%); }
.st-chip .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #fbecd2; color: #9a5b0c; }
.st-chip .ic.olive { background: #eef3dd; color: var(--st-olive); }
.st-chip.c1 { top: 14%; inset-inline-start: -5%; }
.st-chip.c2 { top: 48%; inset-inline-end: -6%; animation-delay: -2s; }
.st-chip.c3 { bottom: -5%; inset-inline-start: 12%; animation-delay: -4s; }
@keyframes st-float { 50% { transform: translateY(-10px); } }

/* يثقون بنا */
.st-trusted { padding: 70px 0 20px; text-align: center; }
.st-eyebrow { display: inline-flex; align-items: center; gap: 12px; color: var(--st-gold); font-weight: 700; font-size: .92rem; letter-spacing: .02em; }
.st-eyebrow span { width: 26px; height: 1px; background: currentColor; opacity: .5; }
.st-logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 22px; }
.st-logo-card { background: var(--st-card); border: 1px solid var(--st-line); border-radius: 18px; padding: 22px 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.st-logo-card b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .02em; }
.st-logo-card small { color: var(--st-soft); font-size: .82rem; }
.st-logo-card.empty { border-style: dashed; border-color: #d6cfbb; background: transparent; }
.st-logo-card.empty b { color: #9a917b; }
.st-logo-card.empty small { color: #aaa28c; }

/* الأقسام */
.st-sec { padding: clamp(72px, 10vw, 120px) 0; scroll-margin-top: 72px; }
.st-sec.alt { background: linear-gradient(180deg, rgb(239 235 223 / 0%), var(--st-bg-2) 18%, var(--st-bg-2) 82%, rgb(239 235 223 / 0%)); }
.st-head { text-align: center; max-width: 760px; margin: 0 auto 48px; }
.st-head h2 { font-size: clamp(2rem, 4.2vw, 3.1rem); line-height: 1.2; margin-top: 12px; font-weight: 700; }
.st-head p { color: var(--st-soft); margin-top: 14px !important; font-size: 1.08rem; line-height: 1.85; }
.st-mod-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: #eef3dd; color: var(--st-olive); border: 1px solid #dfe7bd; }

function str(value, { field, min = 0, max = 120, optional = false } = {}) {
  if (value == null || value === '') {
    if (optional) return null;
    if (min > 0) throw bad('REQUIRED', field);
    return '';
  }
  if (typeof value !== 'string') throw bad('INVALID_TEXT', field);
  const s = value.trim().replace(/\s+/g, ' ');
  if (s.length < min) throw bad('REQUIRED', field);
  if (s.length > max) throw bad('TOO_LONG', field);
  return s;
}

  if (!Number.isSafeInteger(value) || value < min || value > max) throw bad('INVALID_NUMBER', field);
  return value;
}

const bool = (v) => v === true;

  if (!allowed.includes(value)) throw bad('INVALID_CHOICE', field);

  const { _id, ...rest } = doc;
  for (const k of omit) delete rest[k];
  return { id: _id, ...rest };

// تشفير عبر Web Crypto (متاح في Node 20+ وفي المتصفح).

const enc = new TextEncoder();
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');

function randomToken(bytes = 32) {
  return hex(crypto.getRandomValues(new Uint8Array(bytes)));
}

async function sha256(text) {
  return hex(await crypto.subtle.digest('SHA-256', enc.encode(text)));
}

/**
 * بصمة الرمز السري (PIN) = HMAC-SHA256(سر الخادم، PIN).
 * تسمح بالبحث المباشر وفرض عدم تكرار الرمز بين الموظفين. الحماية الفعلية لرمز من 4–6 أرقام
 * هي تحديد المحاولات (auth.js) وإبقاء السر خارج قاعدة البيانات (PIN_PEPPER).
 */
async function pinLookup(secret, pin) {
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return hex(await crypto.subtle.sign('HMAC', key, enc.encode(`pin:${pin}`)));
}

/** أرقام عربية (٠-٩) وفارسية (۰-۹) → أرقام لاتينية. لوحة الآيباد العربية تكتب "٤٨٢٦" في حقل الرمز */
function normalizePin(pin) {
  if (typeof pin !== 'string') return pin;
  return pin.trim().replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660)).replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06f0));
}

function validPin(pin) {
  return typeof pin === 'string' && /^\d{4,6}$/.test(pin) && !/^(\d)\1+$/.test(pin);
}

// ---------------------------------------------------------------- كلمات مرور حسابات المقاهي
const PBKDF2_ITER = 210_000;

async function pbkdf2(password, saltHex, iterations) {
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const salt = Uint8Array.from(saltHex.match(/../g).map((h) => parseInt(h, 16)));
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256));
}

/** يعيد "pbkdf2$<iter>$<salt>$<hash>" */
async function hashPassword(password, { iterations = PBKDF2_ITER } = {}) {
  const salt = randomToken(16);
  return `pbkdf2$${iterations}$${salt}$${await pbkdf2(password, salt, iterations)}`;
}

async function verifyPassword(password, stored) {
  const [kind, iter, salt, expected] = String(stored ?? '').split('$');
  if (kind !== 'pbkdf2' || !salt || !expected) return false;
  const actual = await pbkdf2(password, salt, Number(iter));
  let diff = actual.length ^ expected.length;
  for (let i = 0; i < Math.min(actual.length, expected.length); i++) diff |= actual.charCodeAt(i) ^ expected.charCodeAt(i);
  return diff === 0;
}

return { randomToken, sha256, pinLookup, normalizePin, validPin, hashPassword, verifyPassword };
})();

    if (input.employeeId && input.employeeId !== actor.id) { requirePerm(actor, 'hr.manage'); employeeId = checkId(input.employeeId, 'employeeId'); }
    const emp = await EMP().findOne({ _id: employeeId });
    if (!emp) throw notFound();
    const overlap = await LV().findOne({ employeeId, status: { $in: ['pending', 'approved'] }, from: { $lte: to }, to: { $gte: from } });
    if (overlap) throw conflict('LEAVE_OVERLAP');
    const doc = { _id: newId(), clientId, employeeId, employeeName: emp.name, from, to, days, type, paid: type !== 'unpaid', reason, status: 'pending', requestedAt: now(), requestedBy: actor.name };
    try { await LV().insertOne(doc); } catch (e) { if (isDup(e)) return viewLeave(await LV().findOne({ clientId })); throw e; }
    return viewLeave(doc);
  }

  async function leaveBalance(emp, year) {
    const used = (await LV().find({ employeeId: emp._id, status: 'approved', type: 'annual' }).toArray())
      .filter((l) => l.from.startsWith(year)).reduce((a, l) => a + l.days, 0);
    const total = emp.annualLeave ?? 14;
    return { total, used, left: total - used };
  }

  async function decideLeave(actor, leaveId, input = {}) {
    requirePerm(actor, 'hr.manage');
    const l = await LV().findOne({ _id: checkId(leaveId) });
    if (!l) throw notFound();
    const status = oneOf(input.status, ['approved', 'rejected'], 'status');
    if (l.status === status) return viewLeave(l);
    if (l.status !== 'pending') throw conflict('LEAVE_ALREADY_DECIDED');
    if (status === 'approved') await assertOpenMonth(l.employeeId, ...leaveMonths(l.from, l.to));
    if (status === 'approved' && l.type === 'annual') {
      const emp = await EMP().findOne({ _id: l.employeeId });
      const bal = await leaveBalance(emp, l.from.slice(0, 4));
      if (l.days > bal.left) throw bad('LEAVE_BALANCE', String(bal.left));
    }
    const r = await LV().updateOne({ _id: l._id, status: 'pending' }, { $set: { status, decidedAt: now(), decidedBy: actor.name, note: str(input.note, { field: 'note', max: 160, optional: true }) } });
    if (!r.matchedCount) throw conflict('LEAVE_ALREADY_DECIDED');
    await audit({ ...ctx, actor }, `hr.leave_${status}`, { name: l.employeeName, from: l.from, to: l.to, days: l.days, type: LEAVE_TYPES[l.type] });
    return viewLeave(await LV().findOne({ _id: l._id }));
  }

  const viewLeave = (l) => ({ id: l._id, employeeId: l.employeeId, employeeName: l.employeeName, from: l.from, to: l.to, days: l.days, type: l.type, typeName: LEAVE_TYPES[l.type], paid: l.paid, reason: l.reason, status: l.status, requestedAt: l.requestedAt, decidedBy: l.decidedBy ?? null, note: l.note ?? null });
