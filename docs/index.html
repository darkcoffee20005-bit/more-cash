/** تصغير صورة الفاتورة قبل الإرسال (أطول ضلع 1600 بكسل، JPEG) — يكفي للقراءة ويبقى تحت حد الطلب */
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(Object.assign(new Error('img'), { code: 'INVALID_IMAGE' })); i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return { data: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], mediaType: 'image/jpeg' };
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ---------------------------------------------------------------- التحميل
function presetRange(k) {
  const today = localDate(Date.now(), tz());
  const d = (n) => localDate(Date.now() - n * 86400000, tz());
  const first = `${today.slice(0, 7)}-01`;
  const lastMonthEnd = localDate(new Date(`${first}T00:00:00Z`).getTime() - 86400000, 0);
  const lastMonthStart = `${lastMonthEnd.slice(0, 7)}-01`;
  return { today: [today, today], yesterday: [d(1), d(1)], week: [d(6), today], month: [first, today], lastmonth: [lastMonthStart, lastMonthEnd] }[k];
}

installFloorEditor(() => (state.route === 'admin' && state.params?.sub === 'floor' ? A().floor : null));

async function loadSection(sub) {
  const a = A();
  const loaders = {
    dashboard: async () => { a.dashboard = await get('/api/admin/dashboard'); },
    hr: () => loadHr(),
    floor: async () => {
      if (a.floor?.dirty) return; // لا تُفقد تعديلات لم تُحفظ عند الرجوع للقسم
      const st = await get('/api/admin/settings').catch(() => state.settings);
      a.floor = { tables: structuredClone(st?.floor?.tables ?? []), selected: null, dirty: false };
    },
    branches: async () => {
      if (!a.branchPreset) a.branchPreset = 'today';
      const [from, to] = presetRange(a.branchPreset);
      a.branches = await get('/api/account/branches');
      a.branchReport = null; render();
      a.branchReport = await get('/api/account/branches/report', { from, to });
    },
    expenses: async () => {
      if (!a.expPreset) a.expPreset = 'month';
      const [from, to] = presetRange(a.expPreset);
      a.expenses = null; a.spending = null; render();
      [a.expenses, a.spending] = await Promise.all([get('/api/admin/expenses', { from, to }), get('/api/admin/expenses/summary', { from, to })]);
    },
    audit: async () => {
      if (!a.auditPreset) a.auditPreset = 'today';
      const [from, to] = presetRange(a.auditPreset);
      a.audit = null; render();
      a.audit = await get('/api/admin/audit', { from, to, group: a.auditGroup || undefined });
    },
    daily: async () => {
      if (!a.dailyDate) a.dailyDate = presetRange('today')[0];
      a.daily = null; render();
      a.daily = await get('/api/admin/reports/daily', { date: a.dailyDate });
    },
    reports: async () => {
      if (!a.from) { a.preset = 'today'; [a.from, a.to] = presetRange('today'); }
      a.report = null; render();
      a.report = await get('/api/admin/reports', { from: a.from, to: a.to });
    },
    shifts: async () => { a.shifts = await get('/api/shifts'); },
    items: async () => { [a.items, a.categories, a.modifiers] = await Promise.all([get('/api/admin/items'), get('/api/admin/categories'), get('/api/admin/modifiers')]); syncImages(a.items); },
    categories: async () => { a.categories = await get('/api/admin/categories'); },
    modifiers: async () => { a.modifiers = await get('/api/admin/modifiers'); },
    discounts: async () => { a.discounts = await get('/api/admin/discounts'); },
    inventory: async () => { a.inventory = await get('/api/admin/inventory'); a.lowCount = a.inventory.lowCount; a.stockItems = null; },
    employees: async () => { a.employees = await get('/api/admin/employees'); },
    settings: async () => { [a.settings, a.account] = await Promise.all([get('/api/admin/settings'), loadAccount()]); },
  };
  await loaders[sub]?.();
  render();
}

async function enter(params) {
  const sub = params.sub || SECTIONS.find(([, , , p]) => can(p))?.[0];

async function shrink(file) {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

      const data = src.split(',')[1];
      if (data.length <= 580_000) return { src, data, mediaType: 'image/jpeg' };
    }

if (typeof document !== 'undefined') {
  setInterval(() => {
    const el = document.querySelector('[data-clock]');
    if (el) el.textContent = time(Date.now(), state.settings?.tzOffsetMin ?? 180);
  }, 20_000);
}

// ---------------------------------------------------------------- ملء الشاشة (الآيباد والمتصفحات المكتبية؛ الآيفون لا يدعمه فيُخفى الزر)
const doc = typeof document !== 'undefined' ? document : null;
const canFullscreen = () => Boolean(doc && (doc.fullscreenEnabled || doc.webkitFullscreenEnabled));
const isFullscreen = () => Boolean(doc && (doc.fullscreenElement || doc.webkitFullscreenElement));
async function toggleFullscreen() {
  const el = doc.documentElement;
  try {
    if (isFullscreen()) await (doc.exitFullscreen ?? doc.webkitExitFullscreen).call(doc);
    else await (el.requestFullscreen ?? el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
  } catch { toast('تعذّر ملء الشاشة. على الآيباد: شارك ← إضافة إلى الشاشة الرئيسية', 'bad'); }
}
if (doc) for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) doc.addEventListener(ev, () => render());

// ---------------------------------------------------------------- الإجراءات العامة
async function loadSession(employee) {
  state.employee = employee;
  state.view = {};
  if (state.online !== false) rememberSession(state.shop, employee);
  if (can('pos.sell') || can('kds.use')) await pos.loadBootstrap().catch(fail);
  if (state.online !== false) await hr.loadMe();
  await navigate();
  flushSales();
}

on({
  'pin-key': (el) => {
    const pin = state.view.pin ?? '';
    if (pin.length < 6) set({ view: { ...state.view, pin: pin + el.dataset.k, pinShake: false } });
    if ((state.view.pin ?? '').length === 6) submitPin();
  },
  'pin-back': () => set({ view: { ...state.view, pin: (state.view.pin ?? '').slice(0, -1) } }),
  'pin-clear': () => set({ view: { ...state.view, pin: '' } }),
  'pin-submit': () => submitPin(),
  keydown: (_el, e) => {
    if (state.employee || !state.shop || state.modal) return;
    if (document.activeElement?.tagName === 'INPUT') return;
    // لوحة مفاتيح عربية: ٠-٩ و۰-۹ تُقبل كأرقام
    const digit = /^[0-9]$/.test(e.key) ? e.key : /^[٠-٩]$/.test(e.key) ? String(e.key.charCodeAt(0) - 0x0660) : /^[۰-۹]$/.test(e.key) ? String(e.key.charCodeAt(0) - 0x06f0) : null;
    if (digit) { const pin = state.view.pin ?? ''; if (pin.length < 6) set({ view: { ...state.view, pin: pin + digit } }); }
    else if (e.key === 'Backspace') set({ view: { ...state.view, pin: (state.view.pin ?? '').slice(0, -1) } });
    else if (e.key === 'Enter') submitPin();
  },
  lock: async () => {
    if (state.online === false) { toast('لا يمكن تبديل الموظف بدون إنترنت. البيع مستمر باسم الموظف الحالي.', 'bad'); return; }
    await post('/api/auth/logout', {}).catch(() => {});
    rememberSession(state.shop, null);
    state.employee = null;
    state.modal = null;
    state.view = { pin: '' };
    render();
  },
  fullscreen: () => toggleFullscreen(),
  'close-modal': () => set({ modal: null }),
  reload: () => location.reload(),
  'modal-back': () => set({ modal: null }),
});

async function submitPin() {
  const pin = state.view.pin ?? '';
  if (pin.length < 4) return;
  await busy(async () => {
    try {
      const r = await post('/api/auth/pin', { pin });
      await loadSession(r.employee);
    } catch (e) {
      state.view = { pin: '', pinShake: true };
      throw e;
    }
  });
}

account.initAccount({ loadSession });

async function boot() {
  setViews(views);
  bindEvents(document.getElementById('app'));
  window.addEventListener('hashchange', () => navigate());
  initOffline();
  try {
    const s = await get('/api/state');
    state.online = true;
    rememberSession(s.shop, s.employee);
    state.shop = s.shop;
    state.authPage = parseHash().route;
    state.ready = true;
    if (parseHash().route === 'platform') await navigate();
    else if (s.employee) await loadSession(s.employee);
    else render();
  } catch (e) {
    state.ready = true;
    // بلا إنترنت: يفتح المقهى المحفوظ على هذا الجهاز باسم آخر موظف، والمبيعات تُحفظ حتى يعود الاتصال
    const saved = e.code === 'NETWORK' ? savedSession() : null;
    if (saved?.shop) {
      state.online = false;
      state.shop = saved.shop;
      if (saved.employee) { await loadSession(saved.employee); return; }
      render();
      return;
    }
    if (e.code === 'DB_NOT_CONFIGURED' || e.code === 'DB_UNAVAILABLE' || e.code === 'NETWORK') state.fatal = errorText(e);
    else fail(e);
    render();
  }
}

return { navigate, views, boot };
})();
